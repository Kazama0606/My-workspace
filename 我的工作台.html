        <div class="card-title">新增專案</div>
        <div class="form-row">
          <input class="input" id="np-name" placeholder="專案名稱，例如：Jimmy 體態調整計畫">
          <input class="input" id="np-note" placeholder="備註（選填）">
          <button class="btn" style="background:var(--blue-accent);color:#fff" id="np-add">新增</button>
        </div>
      </div>
      <div class="grid grid-2" id="project-cards"></div>
    `;
    document.getElementById('np-add').onclick = () => {
      const name = document.getElementById('np-name').value.trim();
      if (!name) return;
      const note = document.getElementById('np-note').value.trim();
      DataStore.addProject(name, note);
      render();
    };

    const wrap = document.getElementById('project-cards');
    if (projects.length === 0) {
      wrap.innerHTML = '<div class="empty-hint">還沒有專案，新增一個開始吧</div>';
      return;
    }
    wrap.innerHTML = projects.map(p => {
      const tasks = DataStore.getTasksByProject(p.id);
      const done = tasks.filter(t => t.done).length;
      const next = tasks.filter(t => !t.done && t.dueDate).sort((a, b) => a.dueDate < b.dueDate ? -1 : 1)[0];
      return `
        <div class="card" style="cursor:pointer" data-id="${p.id}">
          <div class="card-title"><span>${Util.esc(p.name)}</span><span class="tag">${done}/${tasks.length}</span></div>
          ${p.note ? `<div class="muted" style="font-size:12px;margin-bottom:8px">${Util.esc(p.note)}</div>` : ''}
          ${next ? `<div style="font-size:12px" class="${Util.dueClass(next.dueDate)}">下個期限：${next.dueDate} · ${Util.esc(next.title)}</div>` : '<div class="muted" style="font-size:12px">沒有排定期限的任務</div>'}
        </div>
      `;
    }).join('');
    wrap.querySelectorAll('[data-id]').forEach(el => {
      el.onclick = () => { selectedId = el.dataset.id; render(); };
    });
  }

  function renderDetail(root, id) {
    const p = DataStore.getProject(id);
    const tasks = DataStore.getTasksByProject(id).sort((a, b) => {
      if (!!a.dueDate !== !!b.dueDate) return a.dueDate ? -1 : 1;
      return (a.dueDate || '') < (b.dueDate || '') ? -1 : 1;
    });
    root.innerHTML = `
      <div class="page-hd">
        <button class="link-btn" id="back-btn">← 回專案列表</button>
        <div class="page-title" style="margin-top:8px">${Util.esc(p.name)}</div>
        ${p.note ? `<div class="page-sub">${Util.esc(p.note)}</div>` : ''}
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-title">新增任務</div>
        <div class="form-row">
          <input class="input" id="nt-title" placeholder="任務內容，例如：寄送幸福餐配方">
          <input class="input" type="date" id="nt-due" style="max-width:160px">
          <button class="btn" style="background:var(--blue-accent);color:#fff" id="nt-add">新增</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">任務清單</div>
        <div id="task-list"></div>
      </div>
      <div style="margin-top:16px">
        <button class="btn btn-danger btn-sm" id="del-project">刪除此專案</button>
      </div>
    `;
    document.getElementById('back-btn').onclick = () => { selectedId = null; render(); };
    document.getElementById('nt-add').onclick = () => {
      const title = document.getElementById('nt-title').value.trim();
      if (!title) return;
      const due = document.getElementById('nt-due').value;
      DataStore.addTask(id, title, due);
      render();
    };
    document.getElementById('del-project').onclick = () => {
      if (confirm(`確定要刪除「${p.name}」嗎？裡面的任務也會一併刪除。`)) {
        DataStore.deleteProject(id);
        selectedId = null;
        render();
      }
    };

    const listEl = document.getElementById('task-list');
    if (tasks.length === 0) {
      listEl.innerHTML = '<div class="empty-hint">還沒有任務</div>';
      return;
    }
    listEl.innerHTML = tasks.map(t => `
      <div class="list-item">
        <input type="checkbox" ${t.done ? 'checked' : ''} data-toggle="${t.id}">
        <span class="grow ${t.done ? 'strike' : ''}">${Util.esc(t.title)}</span>
        ${t.dueDate ? `<span class="${Util.dueClass(t.dueDate)}">${t.dueDate}</span>` : ''}
        <button class="link-btn" style="color:var(--danger)" data-del="${t.id}">刪除</button>
      </div>
    `).join('');
    listEl.querySelectorAll('[data-toggle]').forEach(el => {
      el.onchange = () => { DataStore.toggleTask(el.dataset.toggle); render(); };
    });
    listEl.querySelectorAll('[data-del]').forEach(el => {
      el.onclick = () => { DataStore.deleteTask(el.dataset.del); render(); };
    });
  }

  return { render };
})();

</script>
<script>
/* 待辦清單頁 — 彙整所有專案裡的任務。雙擊項目編輯，欄位順序：待辦事項→辦理日期→專案名稱→備註 */
window.Pages = window.Pages || {};
Pages.todo = (function () {
  const FLAGS = ['', '‼️', '⚠️', '🔥', '⭐', '📌'];
  const FLAG_LABELS = { '': '（無標記）', '‼️': '‼️ 緊急', '⚠️': '⚠️ 警告', '🔥': '🔥 燒眉毛', '⭐': '⭐ 重要', '📌': '📌 釘選' };
  const SHOP_CATEGORIES = ['家電', '配件', '3C', '服飾', '生活用品', '美妝保養', '食品飲料', '其他'];

  let viewMode = 'open'; // 'open' | 'done'
  let editingId = null;
  let editingShopId = null;

  function render() {
    const root = document.getElementById('page-todo');
    const projects = DataStore.getProjects();
    const projMap = {};
    projects.forEach(p => { projMap[p.id] = p.name; });

    root.innerHTML = `
      <div class="page-hd">
        <div class="page-title">✅ 待辦清單</div>
        <div class="page-sub">彙整所有專案裡的任務，雙擊項目可以編輯；期限 3 天內會自動標紅並提醒</div>
        <button class="link-btn" id="toggle-done-view" style="margin-top:8px;font-size:13px">${viewMode === 'open' ? '查看已完成事項 →' : '← 回待辦清單'}</button>
      </div>
      <div id="todo-body"></div>
      <div id="shopping-body" style="margin-top:20px"></div>
    `;
    document.getElementById('toggle-done-view').onclick = () => {
      viewMode = viewMode === 'open' ? 'done' : 'open';
      editingId = null;
      render();
    };

    if (viewMode === 'done') renderDoneView(projMap);
    else renderOpenView(projects, projMap);
    renderShoppingList();
  }

  function renderOpenView(projects, projMap) {
    const body = document.getElementById('todo-body');
    const tasks = DataStore.getAllTasks().filter(t => !t.done);
    const today = DataStore.todayStr();
    const groups = { overdue: [], today: [], upcoming: [], none: [] };
    tasks.forEach(t => {
      if (!t.dueDate) groups.none.push(t);
      else if (t.dueDate < today) groups.overdue.push(t);
      else if (t.dueDate === today) groups.today.push(t);
      else groups.upcoming.push(t);
    });
    ['overdue', 'today', 'upcoming'].forEach(k => groups[k].sort((a, b) => a.dueDate < b.dueDate ? -1 : 1));

    body.innerHTML = `
      ${sectionHtml('已逾期', groups.overdue, projMap, true)}
      ${sectionHtml('今天', groups.today, projMap, false)}
      ${sectionHtml('之後', groups.upcoming, projMap, false)}
      ${sectionHtml('沒有期限', groups.none, projMap, false)}
      ${tasks.length === 0 ? '<div class="empty-hint">目前沒有待辦事項</div>' : ''}
      <div class="card">
        <div class="card-title">新增待辦</div>
        ${addRowHtml(projects)}
      </div>
    `;

    body.querySelectorAll('[data-toggle]').forEach(el => {
      el.onchange = () => {
        if (el.checked) Util.playDing();
        DataStore.toggleTask(el.dataset.toggle);
        render();
      };
    });
    body.querySelectorAll('[data-dblclick]').forEach(el => {
      el.ondblclick = () => { editingId = el.dataset.dblclick; render(); };
    });
    body.querySelectorAll('[data-del]').forEach(el => {
      el.onclick = () => { DataStore.deleteTask(el.dataset.del); render(); };
    });
    wireEditRow(body);
    wireAddRow();
  }

  function sectionHtml(title, items, projMap, danger) {
    if (items.length === 0) return '';
    return `
      <div class="card" style="margin-bottom:14px">
        <div class="card-title" style="${danger ? 'color:var(--danger)' : ''}">${title}（${items.length}）</div>
        <div class="todo-rows">
          ${items.map(t => t.id === editingId ? editRowHtml(t, projMap) : rowHtml(t, projMap)).join('')}
        </div>
      </div>
    `;
  }

  function rowHtml(t, projMap) {
    const urgent = Util.isUrgent(t.dueDate);
    const dueCls = urgent ? 'due-overdue' : Util.dueClass(t.dueDate);
    return `
      <div class="todo-row" data-dblclick="${t.id}">
        <input type="checkbox" data-toggle="${t.id}">
        <span class="todo-title">${Util.esc(t.title)}${t.flag ? ` <span class="todo-flag">${t.flag}</span>` : ''}</span>
        <span class="todo-due ${dueCls}">${urgent ? '<span class="todo-urgent-icon" title="快到期了">⏰</span> ' : ''}${t.dueDate || '—'}</span>
        ${t.projectId ? `<span class="tag">${Util.esc(projMap[t.projectId] || '未知專案')}</span>` : ''}
        <span class="todo-note muted">${t.note ? Util.esc(t.note) : ''}</span>
        <button class="link-btn" style="color:var(--danger)" data-del="${t.id}">刪除</button>
      </div>
    `;
  }

  function editRowHtml(t, projMap) {
    return `
      <div class="todo-row todo-row-editing" data-editing="${t.id}">
        <div class="todo-edit-top">
          <input class="cell-input" data-f="title" value="${Util.esc(t.title)}" placeholder="待辦事項">
          <input class="cell-input todo-due-input" data-f="dueDate" type="date" value="${t.dueDate || ''}">
          <select class="cell-input" data-f="projectId">
            ${projectOptionsHtml(projMap, t.projectId)}
          </select>
          <select class="cell-input todo-flag-input" data-f="flag">
            ${flagOptionsHtml(t.flag || '')}
          </select>
          <button class="btn btn-sm" style="background:var(--blue-accent);color:#fff" data-confirm>確認</button>
        </div>
        <textarea class="todo-note-input" data-f="note" placeholder="備註，記錄進行到一半的狀況…">${Util.esc(t.note || '')}</textarea>
      </div>
    `;
  }

  function projectOptionsHtml(projMap, selected) {
    const opts = [`<option value="" ${!selected ? 'selected' : ''}>（無專案）</option>`];
    Object.keys(projMap).forEach(pid => {
      opts.push(`<option value="${pid}" ${pid === selected ? 'selected' : ''}>${Util.esc(projMap[pid])}</option>`);
    });
    return opts.join('');
  }

  function flagOptionsHtml(selected) {
    return FLAGS.map(f => `<option value="${f}" ${f === selected ? 'selected' : ''}>${FLAG_LABELS[f]}</option>`).join('');
  }

  function wireEditRow(body) {
    const row = body.querySelector('[data-editing]');
    if (!row) return;
    const id = row.dataset.editing;
    const commit = () => {
      const title = row.querySelector('[data-f="title"]').value.trim();
      if (!title) { editingId = null; render(); return; }
      const dueDate = row.querySelector('[data-f="dueDate"]').value;
      const projectId = row.querySelector('[data-f="projectId"]').value;
      const flag = row.querySelector('[data-f="flag"]').value;
      const note = row.querySelector('[data-f="note"]').value.trim();
      DataStore.updateTask(id, { title, dueDate, projectId, flag, note });
      editingId = null;
      render();
    };
    row.querySelector('[data-confirm]').onclick = commit;
    row.querySelectorAll('.todo-edit-top input').forEach(inp => {
      inp.onkeydown = (e) => { if (e.key === 'Enter') commit(); };
    });
  }

  function addRowHtml(projects) {
    const projMap = {};
    projects.forEach(p => { projMap[p.id] = p.name; });
    return `
      <div class="todo-row todo-row-editing">
        <div class="todo-edit-top">
          <input class="cell-input" id="add-title" placeholder="待辦事項">
          <input class="cell-input date-icon-only" id="add-due" type="date" title="辦理日期">
          <select class="cell-input" id="add-project">
            ${projectOptionsHtml(projMap, '')}
          </select>
          <select class="cell-input todo-flag-input" id="add-flag">
            ${flagOptionsHtml('')}
          </select>
          <button class="btn btn-sm" style="background:var(--blue-accent);color:#fff" id="add-todo-btn">新增</button>
        </div>
        <textarea class="todo-note-input" id="add-note" placeholder="備註（選填）"></textarea>
      </div>
    `;
  }

  function wireAddRow() {
    const btn = document.getElementById('add-todo-btn');
    if (!btn) return;
    const submit = () => {
      const title = document.getElementById('add-title').value.trim();
      if (!title) return;
      const dueDate = document.getElementById('add-due').value;
      const projectId = document.getElementById('add-project').value;
      const flag = document.getElementById('add-flag').value;
      const note = document.getElementById('add-note').value.trim();
      Util.playPop();
      DataStore.addTask(projectId, title, dueDate, note, flag);
      render();
    };
    btn.onclick = submit;
    ['add-title', 'add-due'].forEach(id => {
      document.getElementById(id).onkeydown = (e) => { if (e.key === 'Enter') submit(); };
    });
  }

  function renderDoneView(projMap) {
    const body = document.getElementById('todo-body');
    const doneTasks = [...DataStore.getAllTasks()].filter(t => t.done).sort((a, b) => b.createdAt < a.createdAt ? -1 : 1);
    body.innerHTML = `
      <div class="card">
        <div class="card-title">已完成事項（${doneTasks.length}）</div>
        ${doneTasks.length === 0 ? '<div class="empty-hint">還沒有已完成的事項</div>' : `
          <div class="todo-rows">
            ${doneTasks.map(t => `
              <div class="todo-row">
                <input type="checkbox" checked data-restore="${t.id}" title="取消勾選以恢復待辦">
                <span class="todo-title strike">${Util.esc(t.title)}${t.flag ? ` <span class="todo-flag">${t.flag}</span>` : ''}</span>
                <span class="todo-due muted">${t.dueDate || '—'}</span>
                ${t.projectId ? `<span class="tag">${Util.esc(projMap[t.projectId] || '未知專案')}</span>` : ''}
                <span class="todo-note muted">${t.note ? Util.esc(t.note) : ''}</span>
              </div>
            `).join('')}
          </div>
        `}
      </div>
    `;
    body.querySelectorAll('[data-restore]').forEach(el => {
      el.onchange = () => { DataStore.toggleTask(el.dataset.restore); render(); };
    });
  }

  const SHOP_PLATFORMS = ['淘寶', '蝦皮', '安麗官網', '實體商店', '其他'];

  function shoppingRowHtml(it) {
    if (it.id === editingShopId) return shopEditRowHtml(it);
    const proxyBits = [];
    if (it.proxyFor) proxyBits.push(`給 ${Util.esc(it.proxyFor)}`);
    if (it.deadline) proxyBits.push(`${it.deadline} 前`);
    if (it.platform) proxyBits.push(Util.esc(it.platform));
    const proxyTitle = it.isProxy ? `🎁 代購${proxyBits.length ? '・' + proxyBits.join('・') : ''}` : '';
    return `
      <div class="shop-item" data-dblclick-shop="${it.id}" style="cursor:pointer">
        <input type="checkbox" ${it.bought ? 'checked' : ''} data-sh-toggle="${it.id}">
        <span class="shop-item-name ${it.bought ? 'strike' : ''}" title="${it.qty ? 'x' + Util.esc(it.qty) : ''}">${Util.esc(it.name)}${it.qty ? ` <span class="muted">x${Util.esc(it.qty)}</span>` : ''}</span>
        ${it.category ? `<span class="tag">${Util.esc(it.category)}</span>` : ''}
        ${it.isProxy ? `<span class="tag" style="background:${CalShared.RECURRING_COLOR.bg};color:${CalShared.RECURRING_COLOR.fg}" title="${Util.esc(proxyTitle)}">🎁</span>` : ''}
        <button class="link-btn" style="color:var(--danger)" data-sh-del="${it.id}">×</button>
      </div>
    `;
  }

  function shopEditRowHtml(it) {
    return `
      <div class="card" style="grid-column:1/-1;margin:4px 0" data-editing-shop="${it.id}">
        <div class="form-row" style="flex-wrap:wrap;margin-bottom:8px">
          <input class="input shop-input" data-f="name" value="${Util.esc(it.name)}" placeholder="品項（可含規格）" style="flex:0 0 220px">
          <input class="input shop-input" data-f="qty" value="${Util.esc(it.qty || '')}" placeholder="數量" style="flex:0 0 70px">
          <select class="input shop-input" data-f="category" style="flex:0 0 130px">
            <option value="">品類(選填)</option>
            ${SHOP_CATEGORIES.map(c => `<option value="${c}" ${c === it.category ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
        </div>
        <label style="display:flex;align-items:center;gap:6px;font-size:14px;margin-bottom:8px">
          <input type="checkbox" data-f="isProxy" ${it.isProxy ? 'checked' : ''}> 這是要幫別人代購的
        </label>
        <div class="form-row" data-proxy-fields style="flex-wrap:wrap;align-items:center;display:${it.isProxy ? 'flex' : 'none'}">
          <input class="input shop-input" data-f="proxyFor" value="${Util.esc(it.proxyFor || '')}" placeholder="要給誰" style="flex:1 1 110px">
          <div style="display:flex;align-items:center;gap:6px;flex:0 0 auto">
            <input class="input shop-input date-icon-only" data-f="deadline" type="date" value="${it.deadline || ''}" title="截止日">
            <span class="muted" data-deadline-label style="font-size:13px;white-space:nowrap">${Util.formatDateZh(it.deadline)}</span>
          </div>
          <select class="input shop-input" data-f="platform" style="flex:1 1 110px">
            <option value="">購買平台</option>
            ${SHOP_PLATFORMS.map(p => `<option value="${p}" ${p === it.platform ? 'selected' : ''}>${p}</option>`).join('')}
          </select>
        </div>
        <div style="display:flex;gap:12px;margin-top:8px">
          <button class="btn btn-sm" style="background:var(--blue-accent);color:#fff" data-confirm-shop>確認</button>
          <button class="link-btn" data-cancel-shop>取消</button>
        </div>
      </div>
    `;
  }

  function renderShoppingList() {
    const container = document.getElementById('shopping-body');
    const items = DataStore.getShoppingItems();
    container.innerHTML = `
      <div class="card">
        <div class="card-title">🛒 隨手買清單</div>
        <div class="shop-grid" id="shopping-rows">
          ${items.length === 0 ? '<div class="empty-hint">目前沒有想買的東西</div>' : items.map(shoppingRowHtml).join('')}
        </div>
        <div class="form-row" style="flex-wrap:wrap;margin-top:14px;margin-bottom:8px">
          <input class="input shop-input" id="sh-name" placeholder="品項（可含規格，例如：Artistry 精華液）" style="flex:0 0 220px">
          <input class="input shop-input" id="sh-qty" placeholder="數量" style="flex:0 0 70px">
          <select class="input shop-input" id="sh-category" style="flex:0 0 130px">
            <option value="">品類(選填)</option>
            ${SHOP_CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('')}
          </select>
        </div>
        <label style="display:flex;align-items:center;gap:6px;font-size:14px;margin-bottom:8px">
          <input type="checkbox" id="sh-proxy"> 這是要幫別人代購的
        </label>
        <div class="form-row" id="sh-proxy-fields" style="flex-wrap:wrap;align-items:center;display:none">
          <input class="input shop-input" id="sh-proxy-for" placeholder="要給誰" style="flex:1 1 110px">
          <div style="display:flex;align-items:center;gap:6px;flex:0 0 auto">
            <input class="input shop-input date-icon-only" id="sh-deadline" type="date" title="截止日">
            <span class="muted" id="sh-deadline-label" style="font-size:13px;white-space:nowrap"></span>
          </div>
          <select class="input shop-input" id="sh-platform" style="flex:1 1 110px">
            <option value="">購買平台</option>
            ${SHOP_PLATFORMS.map(p => `<option value="${p}">${p}</option>`).join('')}
          </select>
        </div>
        <button class="btn btn-sm" style="background:var(--blue-accent);color:#fff" id="sh-add-btn">新增</button>
      </div>
    `;

    document.getElementById('sh-proxy').onchange = (e) => {
      document.getElementById('sh-proxy-fields').style.display = e.target.checked ? 'flex' : 'none';
    };
    document.getElementById('sh-deadline').onchange = (e) => {
      document.getElementById('sh-deadline-label').textContent = Util.formatDateZh(e.target.value);
    };

    container.querySelectorAll('[data-sh-toggle]').forEach(el => {
      el.onchange = () => { DataStore.toggleShoppingItem(el.dataset.shToggle); renderShoppingList(); };
    });
    container.querySelectorAll('[data-sh-del]').forEach(el => {
      el.onclick = (e) => { e.stopPropagation(); DataStore.deleteShoppingItem(el.dataset.shDel); renderShoppingList(); };
    });
    container.querySelectorAll('[data-dblclick-shop]').forEach(el => {
      el.ondblclick = () => { editingShopId = el.dataset.dblclickShop; renderShoppingList(); };
    });

    const editEl = container.querySelector('[data-editing-shop]');
    if (editEl) {
      const editId = editEl.dataset.editingShop;
      const editProxyCb = editEl.querySelector('[data-f="isProxy"]');
      const editProxyFields = editEl.querySelector('[data-proxy-fields]');
      editProxyCb.onchange = () => { editProxyFields.style.display = editProxyCb.checked ? 'flex' : 'none'; };
      editEl.querySelector('[data-f="deadline"]').onchange = (e) => {
        editEl.querySelector('[data-deadline-label]').textContent = Util.formatDateZh(e.target.value);
      };
      const cancelEdit = () => { editingShopId = null; renderShoppingList(); };
      const confirmEdit = () => {
        const name = editEl.querySelector('[data-f="name"]').value.trim();
        if (!name) { cancelEdit(); return; }
        const qty = editEl.querySelector('[data-f="qty"]').value.trim();
        const category = editEl.querySelector('[data-f="category"]').value;
        const isProxy = editProxyCb.checked;
        const proxyFor = editEl.querySelector('[data-f="proxyFor"]').value.trim();
        const deadline = editEl.querySelector('[data-f="deadline"]').value;
        const platform = editEl.querySelector('[data-f="platform"]').value;
        DataStore.updateShoppingItem(editId, { name, qty, category, isProxy, proxyFor, deadline, platform });
        editingShopId = null;
        renderShoppingList();
      };
      editEl.querySelector('[data-confirm-shop]').onclick = confirmEdit;
      editEl.querySelector('[data-cancel-shop]').onclick = cancelEdit;
      editEl.querySelector('[data-f="name"]').onkeydown = (e) => { if (e.key === 'Enter') confirmEdit(); };
    }

    const submit = () => {
      const name = document.getElementById('sh-name').value.trim();
      if (!name) return;
      const qty = document.getElementById('sh-qty').value.trim();
      const category = document.getElementById('sh-category').value;
      const isProxy = document.getElementById('sh-proxy').checked;
      const proxyFor = document.getElementById('sh-proxy-for').value.trim();
      const deadline = document.getElementById('sh-deadline').value;
      const platform = document.getElementById('sh-platform').value;
      Util.playPop();
      DataStore.addShoppingItem({ name, qty, category, isProxy, proxyFor, deadline, platform });
      renderShoppingList();
    };
    document.getElementById('sh-add-btn').onclick = submit;
    document.getElementById('sh-name').onkeydown = (e) => { if (e.key === 'Enter') submit(); };
  }

  return { render };
})();

</script>
<script>
/* 行事曆頁 — 月曆格(用 CalShared 共用邏輯) + 固定行程管理 + .ics 匯入 + 鍵盤方向鍵 */
window.Pages = window.Pages || {};
Pages.calendar = (function () {
  const now = new Date();
  let viewYear = now.getFullYear();
  let viewMonth = now.getMonth();
  let selectedDate = DataStore.todayStr();
  let keyboardBound = false;
  let dayViewDate = null; // null = 月曆檢視；有值 = 週檢視(以這天所在的那一週為準)，值是該天的日期字串
  let bulkCancelOpen = false; // 批次取消固定行程的工具面板是否展開
  let bulkCancelResult = null; // 上次批次取消的結果數量，用來顯示「已取消 N 個」的提示

  const dayPanel = CalShared.createDayPanel({
    getSelected: () => selectedDate,
    setSelected: (d) => {
      selectedDate = d;
      const dt = new Date(d + 'T00:00:00');
      viewYear = dt.getFullYear();
      viewMonth = dt.getMonth();
    },
    onRerender: () => render(),
  });

  function render() {
    if (dayViewDate) { renderDayView(); } else { renderMonthView(); }
  }

  function renderMonthView() {
    const root = document.getElementById('page-calendar');
    const recurringList = DataStore.getRecurring();
    root.innerHTML = `
      <div class="page-hd">
        <div class="page-title">📅 行事曆</div>
        <div class="page-sub">中班排班、安麗客戶約訪、命理占卜、日本旅行、專案任務期限，全部整合在這裡。點日期格子可以直接新增當天的待辦，雙擊日期可以切換成單日時間軸檢視，選到日期後可以用鍵盤方向鍵移動</div>
        <button class="link-btn" id="toggle-bulk-cancel" style="margin-top:8px;font-size:13px">${bulkCancelOpen ? '← 收起批次取消工具' : '出國／請假？批次取消固定行程 →'}</button>
      </div>
      ${bulkCancelOpen ? `
      <div class="card" style="margin-bottom:20px">
        <div class="card-title">批次取消固定行程</div>
        <div class="muted" style="font-size:12px;margin-bottom:10px">選一段日期範圍(例如出國期間)，勾選要跳過的固定行程，這段期間內原本會出現的那幾天就會被取消，範圍以外的日子、以及範圍之後的重複規則完全不受影響。</div>
        ${recurringList.length === 0 ? '<div class="empty-hint">目前沒有任何固定行程</div>' : `
          <div class="form-row" style="align-items:center;flex-wrap:wrap;margin-bottom:10px">
            <input class="input" id="bulk-cancel-start" type="date" value="${selectedDate}" style="flex:1 1 140px;min-width:120px">
            <span class="muted">～</span>
            <input class="input" id="bulk-cancel-end" type="date" value="${selectedDate}" style="flex:1 1 140px;min-width:120px">
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">
            ${recurringList.map(r => `
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
                <input type="checkbox" class="bulk-cancel-item" value="${r.id}" checked>
                <span class="tag" style="background:${CalShared.categoryOf(r).bg};color:${CalShared.categoryOf(r).fg}">${Util.esc(r.title)}</span>
                <span class="muted" style="font-size:11px">${CalShared.recurrenceLabel(r)}</span>
              </label>
            `).join('')}
          </div>
          <button class="btn" style="background:var(--blue-accent);color:#fff" id="bulk-cancel-confirm">批次取消</button>
          ${bulkCancelResult !== null ? `<div class="muted" style="font-size:12px;margin-top:8px">已取消 ${bulkCancelResult} 個原本會出現的行程項目 ✓</div>` : ''}
        `}
      </div>` : ''}
      <div id="cal-2x2" style="display:grid;grid-template-columns:1fr 300px;grid-template-rows:auto auto;gap:20px;align-items:stretch;margin-bottom:20px">
        <div class="card" id="cal-card" style="grid-column:1;grid-row:1;display:flex;flex-direction:column;min-width:0">
          <div class="cal-hd">
            <button class="btn btn-ghost btn-sm" id="prev-m">←</button>
            <b>${viewYear} 年 ${viewMonth + 1} 月</b>
            <button class="btn btn-ghost btn-sm" id="next-m">→</button>
          </div>
          <div class="cal-grid cal-grid-compact" id="cal-grid" style="flex:1"></div>
        </div>
        <div id="side-col" style="grid-column:2;grid-row:1;min-width:0;max-width:300px;display:flex;flex-direction:column;gap:18px">
          <div id="day-panel" style="display:flex;flex-direction:column;flex:1;min-width:0"></div>
        </div>
        <div class="card" id="habits-embed" style="grid-column:1;grid-row:2"></div>
        <div id="todo-col" style="grid-column:2;grid-row:2;min-width:0;max-width:300px;display:flex;flex-direction:column"></div>
      </div>
    `;
    document.getElementById('prev-m').onclick = () => { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } render(); };
    document.getElementById('next-m').onclick = () => { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } render(); };
    document.getElementById('toggle-bulk-cancel').onclick = () => { bulkCancelOpen = !bulkCancelOpen; bulkCancelResult = null; render(); };
    const bulkConfirmBtn = document.getElementById('bulk-cancel-confirm');
    if (bulkConfirmBtn) {
      bulkConfirmBtn.onclick = () => {
        const start = document.getElementById('bulk-cancel-start').value;
        const end = document.getElementById('bulk-cancel-end').value;
        if (!start || !end || start > end) return;
        const ids = [...document.querySelectorAll('.bulk-cancel-item:checked')].map(el => el.value);
        if (ids.length === 0) return;
        bulkCancelResult = DataStore.cancelRecurringRange(start, end, ids);
        render();
      };
    }
    renderGrid();
    dayPanel.render(document.getElementById('day-panel'), document.getElementById('todo-col'));
    Pages.habits.render('habits-embed');
    bindKeyboardNav();
  }


  function renderGrid() {
    const grid = document.getElementById('cal-grid');
    const dows = ['日', '一', '二', '三', '四', '五', '六'];
    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const today = DataStore.todayStr();

    // 把整個月切成一週一週(7 天一組，頭尾補 null 讓格子對齊星期幾)
    const cells = [];
    for (let i = 0; i < firstDay; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push({ d, dateStr: `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}` });
    while (cells.length % 7 !== 0) cells.push(null);
    const weeks = [];
    for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));

    let html = `<div class="cal-dow-row">${dows.map(d => `<div class="cal-dow">${d}</div>`).join('')}</div>`;
    weeks.forEach(week => {
      const weekDates = week.map(c => c ? c.dateStr : null);
      const bars = CalShared.weekBars(weekDates);
      const reserve = bars.length ? CalShared.BARS_AREA_H + 4 : 0;
      html += `<div class="cal-week-row">
        <div class="cal-week-grid">
          ${week.map((c, dIdx) => {
            if (!c) return `<div class="cal-cell empty"></div>`;
            const { visible, hiddenCount } = CalShared.splitCellItems(CalShared.itemsForDate(c.dateStr).filter(it => it.kind !== 'task'), CalShared.MAX_DOTS);
            const cls = ['cal-cell'];
            if (c.dateStr === today) cls.push('today');
            if (c.dateStr === selectedDate) cls.push('selected');
            return `<div class="${cls.join(' ')}" data-date="${c.dateStr}" style="${reserve ? `padding-bottom:${reserve}px` : ''}">
              ${CalShared.cellHeaderHtml(c.dateStr, c.d)}
              ${visible.map(it => CalShared.dotHtml(it, { hideTime: true, viewDate: c.dateStr })).join('')}
              ${hiddenCount > 0 ? `<div class="cal-cell-more">+${hiddenCount}</div>` : ''}
              ${CalShared.cellBarsHtml(bars, dIdx)}
            </div>`;
          }).join('')}
        </div>
      </div>`;
    });

    grid.innerHTML = html;
    grid.querySelectorAll('[data-date]').forEach(el => {
      el.onclick = () => {
        const picked = dayPanel.pickDate && dayPanel.pickDate(el.dataset.date);
        if (picked) return; // 日期已經灌進新增行程表單，不要整個面板重繪把剛填的值洗掉
        selectedDate = el.dataset.date;
        render();
      };
      el.ondblclick = () => {
        dayViewDate = el.dataset.date;
        selectedDate = el.dataset.date;
        render();
      };
    });
    grid.querySelectorAll('[data-dblclick-bar]').forEach(el => {
      el.ondblclick = (e) => { e.stopPropagation(); dayViewDate = el.dataset.dblclickBar; selectedDate = el.dataset.dblclickBar; render(); };
      el.onclick = (e) => { e.stopPropagation(); selectedDate = el.dataset.dblclickBar; render(); };
    });
    CalShared.wireDragDrop(grid, render);
  }

  function bindKeyboardNav() {
    if (keyboardBound) return;
    keyboardBound = true;
    document.addEventListener('keydown', (e) => {
      const page = document.getElementById('page-calendar');
      if (!page || !page.classList.contains('active')) return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
      const deltas = { ArrowUp: -7, ArrowDown: 7, ArrowLeft: -1, ArrowRight: 1 };
      if (!(e.key in deltas)) return;
      e.preventDefault();
      const d = new Date(selectedDate + 'T00:00:00');
      d.setDate(d.getDate() + deltas[e.key]);
      selectedDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      viewYear = d.getFullYear();
      viewMonth = d.getMonth();
      if (dayViewDate) dayViewDate = selectedDate;
      render();
    });
  }

  // 算出 dateStr 所在那一週的 7 個日期(星期日開始)，實際計算在 renderWeekView 內完成

  const QTR_H = 4; // px，每 5 分鐘一格的高度(24小時 x 12 = 288 格，一小時 = 48px)
  let dayAddHour = null; // 目前是哪個小時正在顯示「新增」表單
  let dayEditId = null; // 目前正在編輯哪筆事件(單日檢視一次只顯示一天，不會撞 id)

  function minutesOf(timeStr) {
    const [h, m] = timeStr.split(':').map(Number);
    return h * 60 + (m || 0);
  }

  // 事件在「選定的這一天」實際佔用的分鐘範圍；跨天事件依當天是開始/中間/結束天自動算出正確區段
  function eventMinuteRangeForDate(it, ds) {
    if (!it.startTime) return { start: 0, end: 24 * 60 }; // 完全沒填時間(純全天事件)，當作佔滿整天
    if (it.kind === 'event' && it.endDate && it.endDate > it.date) {
      if (ds === it.date) return { start: minutesOf(it.startTime), end: 24 * 60 };
      if (ds === it.endDate) return { start: 0, end: it.endTime ? minutesOf(it.endTime) : 24 * 60 };
      return { start: 0, end: 24 * 60 };
    }
    const start = minutesOf(it.startTime);
    let end = it.endTime ? minutesOf(it.endTime) : start + 60;
    if (end <= start) end = start + 30;
    return { start, end: Math.min(end, 24 * 60) };
  }

  function renderDayView() {
    renderWeekView();
  }

  // 「長時間活動」的定義：全天(沒填時間)、跨天、或當天時長 >= 4 小時，符合其中之一就算
  function isLongItem(it, ds) {
    if (!it.startTime) return true;
    if (it.kind === 'event' && it.endDate && it.endDate > it.date) return true;
    const { start, end } = eventMinuteRangeForDate(it, ds || it.date);
    return (end - start) >= 240;
  }

  // 週檢視上方日期圓圈的底色：只有一筆長時間活動就整顆用那個顏色；
  // 如果那天同時有兩筆以上長時間活動(例如台東旅遊當天結束、台南旅遊當天接著開始)，
  // 就依照每一筆實際佔當天的分鐘數比例，用圓錐漸層把圓圈分色，忠實反映當天各佔多少比例
  function dayCircleStyle(ds) {
    const longItems = CalShared.itemsForDate(ds).filter(it => it.kind === 'event' && isLongItem(it, ds));
    if (longItems.length === 0) return '';
    if (longItems.length === 1) return `background:${CalShared.categoryOf(longItems[0]).bg};color:#1a1a1a`;
    const segs = longItems.map(it => {
      const { start, end } = eventMinuteRangeForDate(it, ds);
      return { color: CalShared.categoryOf(it).bg, minutes: Math.max(0, end - start) };
    }).filter(s => s.minutes > 0);
    const total = segs.reduce((s, x) => s + x.minutes, 0);
    if (total === 0) return `background:${CalShared.categoryOf(longItems[0]).bg};color:#1a1a1a`;
    let acc = 0;
    const stops = segs.map(s => {
      const from = (acc / total) * 100;
      acc += s.minutes;
      const to = (acc / total) * 100;
      return `${s.color} ${from}% ${to}%`;
    }).join(', ');
    return `background:conic-gradient(${stops});color:#1a1a1a`;
  }

  let selectedPillId = null; // 單擊時間軸上的行程，先反藍標示選取(不直接進編輯)，雙擊才真的編輯
  let selectedHour = null; // 單擊空白小時格，先反藍標示選取，雙擊才打開新增表單

  // 週檢視：上方一排可點的日期(選哪天就顯示哪天)，下方是選定那天、以小時為間隔的完整時間軸
  // 把有時間重疊的行程分組、各自分配一個「欄(lane)」，讓重疊的行程並排顯示，而不是互相蓋住看不到
  function layoutOverlaps(timedItems, ds) {
    const withRange = timedItems.map(it => {
      const { start, end } = eventMinuteRangeForDate(it, ds);
      return { it, start, end, lane: 0, totalLanes: 1 };
    });
    withRange.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
    // 同一個時間點開始的話，時長比較長的排前面(當底層)，比較短的排後面(疊上去)，
    // 這樣長時間活動(例如整趟旅遊)才會當背景，短暫的行程(例如晚上去某個地方)才會疊在上面凸顯出來
    // 掃描合併：只要兩筆時間重疊，就算同一群(cluster)，群內再各自分配 lane
    const clusters = [];
    withRange.forEach(item => {
      let target = null;
      clusters.forEach(c => {
        if (target) return;
        if (c.items.some(o => o.start < item.end && o.end > item.start)) target = c;
      });
      if (target) target.items.push(item);
      else clusters.push({ items: [item] });
    });
    // 傳遞性合併：A 跟 B 重疊、B 跟 C 重疊，即使 A 跟 C 沒有直接重疊，也要合成同一群
    let merged = true;
    while (merged) {
      merged = false;
      for (let i = 0; i < clusters.length && !merged; i++) {
        for (let j = i + 1; j < clusters.length; j++) {
          const overlap = clusters[i].items.some(a => clusters[j].items.some(b => a.start < b.end && a.end > b.start));
          if (overlap) {
            clusters[i].items = clusters[i].items.concat(clusters[j].items);
            clusters.splice(j, 1);
            merged = true;
            break;
          }
        }
      }
    }
    clusters.forEach(cluster => {
      cluster.items.sort((a, b) => a.start - b.start);
      const laneEnds = [];
      cluster.items.forEach(item => {
        let lane = laneEnds.findIndex(end => end <= item.start);
        if (lane === -1) lane = laneEnds.length;
        laneEnds[lane] = item.end;
        item.lane = lane;
      });
      const totalLanes = laneEnds.length;
      cluster.items.forEach(item => { item.totalLanes = totalLanes; });
    });
    return withRange;
  }

  function renderWeekView() {
    const root = document.getElementById('page-calendar');
    const prevScrollTop = document.querySelector('.day-timeline')?.scrollTop || 0;
    const anchor = new Date(dayViewDate + 'T00:00:00');
    const sunday = new Date(anchor);
    sunday.setDate(anchor.getDate() - anchor.getDay());
    const weekDowLabels = ['日', '一', '二', '三', '四', '五', '六'];
    const weekDates = [];
    for (let i = 0; i < 7; i++) {
      const dt = new Date(sunday);
      dt.setDate(sunday.getDate() + i);
      weekDates.push(`${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`);
    }
    const today = DataStore.todayStr();
    const monthLabel = `${anchor.getFullYear()} 年 ${anchor.getMonth() + 1} 月`;

    const ds = selectedDate;
    const items = CalShared.itemsForDate(ds);
    const allDay = items.filter(it => !it.startTime);
    const timed = items.filter(it => it.startTime);
    const laidOut = layoutOverlaps(timed, ds);
    const rowLine = (mins) => Math.round(mins / 5) + 1; // 288 格(5分鐘一格)換算成第幾條格線(1-indexed)

    let gridHtml = '';
    for (let h = 0; h < 24; h++) {
      const isHourAdding = dayAddHour === h;
      const isHourSelected = selectedHour === h && !isHourAdding;
      gridHtml += `<div class="day-grid-label${isHourSelected ? ' selected' : ''}" data-select-hour="${h}" data-add-hour="${h}" style="grid-column:1;grid-row:${h * 12 + 1} / span 12">${String(h).padStart(2, '0')}:00</div>`;
      gridHtml += `<div class="day-grid-hourbg${isHourSelected ? ' selected' : ''}" data-select-hour="${h}" data-add-hour="${h}" style="grid-column:2;grid-row:${h * 12 + 1} / span 12"></div>`;
    }
    laidOut.forEach(({ it, start, end, lane, totalLanes }) => {
      const r1 = rowLine(start);
      const r2 = Math.max(r1 + 1, rowLine(end));
      const formTopPx = (r1 - 1) * QTR_H;
      const isEditing = it.kind === 'event' && dayEditId === it.id;
      const cat = CalShared.categoryOf(it);
      // 重疊的行程改成「疊層」呈現：最早開始(通常也是比較長)的那筆維持整欄寬度當底層，
      // 之後重疊進來的每一筆維持「整條」但兩邊各留一點邊距(不是整個往右移)、疊在上面，加白色外框跟陰影區隔開來；
      // 底層跟疊層都用同一個左右對稱的邊距基準，確保疊層跟底層之間前後的間距看起來一致
      const laneStyle = lane === 0
        ? 'margin:1px 6px;box-sizing:border-box;'
        : `margin:1px ${6 + lane * 5}px;z-index:${2 + lane};box-shadow:0 2px 8px rgba(0,0,0,.3);border:2px solid #000;box-sizing:border-box;`;
      if (isEditing) {
        // 編輯中的行程：色塊底色保留(不要變白消失)，但編輯表單本身改成獨立浮動視窗(見 renderFloatingForm)，
        // 不再嵌在時間軸格線裡面，這樣表單不管多高都不會撐大可捲動範圍、不會害整個畫面跳動
        gridHtml += `<div class="day-grid-block day-timeline-pill" style="grid-column:2;grid-row:${r1} / ${r2};background:${cat.bg};color:${cat.fg};box-shadow:0 0 0 3px var(--blue-accent);${laneStyle}">
          <div class="day-timeline-pill-title">編輯中…</div>
        </div>`;
        return;
      }
      if (it.kind === 'task') {
        gridHtml += `<div class="day-grid-block day-timeline-pill" style="grid-column:2;grid-row:${r1} / ${r2};background:var(--mint-accent-bg);color:#1a1a1a;${laneStyle}"><div class="day-timeline-pill-title">${Util.esc(it.title)}</div></div>`;
        return;
      }
      const prefix = '';
      const isMultiDay = it.kind === 'event' && it.endDate && it.endDate > it.date;
      const trueStartDay = ds === it.date;
      const trueEndDay = isMultiDay && ds === it.endDate;
      const showTitleBottom = isMultiDay && trueEndDay && !trueStartDay; // 跨天行程結束那天：標題顯示在色塊最下面
      const showTitle = !isMultiDay || trueStartDay || showTitleBottom; // 中間的天(既不是開始也不是結束)不顯示標題
      const timeStr = isMultiDay ? (trueStartDay ? `${it.startTime} 開始` : (trueEndDay ? `→ ${it.endTime} 結束` : '')) : (it.kind === 'event' ? Util.eventSpanLabel(it) : Util.timeRange(it.startTime, it.endTime));
      const isLong = it.kind === 'event' && isLongItem(it, ds);
      // 長時間活動(例如台東旅遊)在週檢視不能直接整筆編輯，只能整筆在月曆頁編輯；
      // 這裡改成點色塊裡的哪個小時，就當作點那個小時要新增/編輯，不加 data-edit-event
      const clickAttr = (it.kind === 'event' && !isLong) ? `data-select-event="${it.id}" data-edit-event="${it.id}"` : '';
      const isPillSelected = it.kind === 'event' && selectedPillId === it.id;
      const selClass = isPillSelected ? ' pill-selected' : '';
      const longClass = isLong ? ' day-long-pill' : '';
      const startHourAttr = isLong ? ` data-pill-start-hour="${Math.floor(start / 60)}"` : '';
      const bottomJustify = showTitleBottom ? ';justify-content:flex-end' : '';
      gridHtml += `<div class="day-grid-block day-timeline-pill${selClass}${longClass}" ${clickAttr}${startHourAttr} style="grid-column:2;grid-row:${r1} / ${r2};background:${cat.bg};color:${cat.fg};${laneStyle}${it.kind === 'event' ? 'cursor:pointer' : ''}${bottomJustify}">
        <div class="day-timeline-pill-row">
          ${showTitle ? `<span class="day-timeline-pill-title">${prefix}${Util.esc(it.title)}</span>` : ''}
          ${timeStr ? `<span class="day-timeline-pill-time">${Util.esc(timeStr)}</span>` : ''}
        </div>
      </div>`;
    });
    // 新增/編輯用的表單改成獨立浮動視窗渲染(見下面 renderFloatingForm)，這裡不再把表單嵌進格線裡

    root.innerHTML = `
      <div class="page-hd">
        <button class="link-btn" id="back-to-month">← 回月曆</button>
        <div class="page-title" style="margin-top:8px">📅 ${monthLabel}</div>
        <div class="page-sub">點上面的日期切換要安排的那一天；下面依小時列出當天的行程，點左邊的小時數字可以在該小時新增行程（即使那小時已經有其他行程也可以疊加），單擊既有行程會反藍選取、雙擊才會打開編輯</div>
      </div>
      <div class="card" style="margin-bottom:20px">
        <div class="cal-hd">
          <button class="btn btn-ghost btn-sm" id="day-prev">← 上週</button>
          <b>${weekDates[0]} ～ ${weekDates[6]}</b>
          <button class="btn btn-ghost btn-sm" id="day-next">下週 →</button>
        </div>
        <div class="week-strip">
          ${weekDates.map((wds, i) => {
            const dt = new Date(wds + 'T00:00:00');
            const isSelected = wds === selectedDate;
            const isToday = wds === today;
            const circleStyle = isSelected ? '' : dayCircleStyle(wds);
            const numStyle = circleStyle ? `style="${circleStyle}"` : '';
            return `<button class="week-strip-day${isSelected ? ' selected' : ''}${isToday ? ' today' : ''}" data-strip-date="${wds}">
              <span class="week-strip-dow">${weekDowLabels[i]}</span>
              <span class="week-strip-num" ${numStyle}>${dt.getDate()}</span>
            </button>`;
          }).join('')}
        </div>
        ${allDay.length ? `<div style="display:flex;flex-direction:column;gap:4px;margin:12px 0 0">
          <div class="muted" style="font-size:11px">未指定時間</div>
          ${allDay.map(it => hourItemPill(it)).join('')}
        </div>` : ''}
        <div class="day-timeline" style="margin-top:12px">
          <div class="day-grid" style="grid-template-columns:48px 1fr;grid-template-rows:repeat(288, ${QTR_H}px)">${gridHtml}</div>
        </div>
      </div>
      <div class="card" id="habits-embed" style="margin-bottom:20px"></div>
    `;

    const timelineEl = root.querySelector('.day-timeline');
    if (timelineEl) timelineEl.scrollTop = prevScrollTop;

    document.getElementById('back-to-month').onclick = () => { dayViewDate = null; dayAddHour = null; dayEditId = null; selectedPillId = null; selectedHour = null; render(); };
    document.getElementById('day-prev').onclick = () => { dayViewDate = Util.shiftDateStr(dayViewDate, -7); selectedDate = dayViewDate; dayAddHour = null; dayEditId = null; selectedPillId = null; selectedHour = null; render(); };
    document.getElementById('day-next').onclick = () => { dayViewDate = Util.shiftDateStr(dayViewDate, 7); selectedDate = dayViewDate; dayAddHour = null; dayEditId = null; selectedPillId = null; selectedHour = null; render(); };
    root.querySelectorAll('[data-strip-date]').forEach(btn => {
      btn.onclick = () => { selectedDate = btn.dataset.stripDate; dayViewDate = selectedDate; dayAddHour = null; dayEditId = null; selectedPillId = null; selectedHour = null; renderWeekView(); };
    });
    root.querySelectorAll('[data-select-hour]').forEach(el => {
      el.onclick = () => { selectedHour = Number(el.dataset.selectHour); dayEditId = null; selectedPillId = null; renderWeekView(); };
      el.ondblclick = () => { dayAddHour = Number(el.dataset.addHour); dayEditId = null; selectedPillId = null; selectedHour = null; renderWeekView(); };
    });
    root.querySelectorAll('[data-select-event]').forEach(el => {
      el.onclick = () => { selectedPillId = el.dataset.selectEvent; selectedHour = null; renderWeekView(); };
    });
    root.querySelectorAll('[data-edit-event]').forEach(el => {
      el.ondblclick = () => { dayEditId = el.dataset.editEvent; dayAddHour = null; selectedPillId = null; selectedHour = null; renderWeekView(); };
    });
    renderFloatingForm(root);
    wirePillHourHover(root);
    Pages.habits.render('habits-embed');
    bindKeyboardNav();
  }

  // 新增/編輯表單改成「浮動視窗」：直接掛在 document.body 底下，用 position:fixed 定位在螢幕上對應的位置，
  // 完全獨立於時間軸的捲動內容之外，不管表單多高，都不會撐大時間軸的可捲動範圍、不會害畫面跟著跳動或捲動
  function renderFloatingForm(root) {
    const oldPopup = document.getElementById('day-form-popup');
    if (oldPopup) oldPopup.remove();
    const timelineEl = root.querySelector('.day-timeline');
    if (!timelineEl) return;

    let innerHtml = null, editing = false, bg = null, topPx = 0;
    if (dayEditId !== null) {
      const it = CalShared.itemsForDate(selectedDate).find(x => x.kind === 'event' && x.id === dayEditId);
      if (it) {
        const { start } = eventMinuteRangeForDate(it, selectedDate);
        topPx = Math.round(start / 5) * QTR_H;
        innerHtml = dayEventFormHtml({ mode: 'edit', item: it });
        editing = true;
        bg = CalShared.categoryOf(it).bg;
      }
    } else if (dayAddHour !== null) {
      topPx = dayAddHour * 12 * QTR_H;
      innerHtml = dayEventFormHtml({ mode: 'add', hour: dayAddHour });
    }
    if (!innerHtml) return;

    const rect = timelineEl.getBoundingClientRect();
    const scrollTop = timelineEl.scrollTop;
    const clickY = rect.top + (topPx - scrollTop); // 使用者點的那個小時，原本應該對齊的位置
    const viewLeft = rect.left + 48; // 扣掉左邊時間標籤欄的寬度

    const popup = document.createElement('div');
    popup.id = 'day-form-popup';
    popup.className = 'week-grid-form' + (editing ? ' editing' : '');
    // 先隱藏、放到畫面外量實際高度，量完才知道要往下展開還是空間不夠要往上展開
    popup.style.cssText = `position:fixed;left:${viewLeft}px;top:-9999px;visibility:hidden;z-index:1000;${bg ? `background:${bg};` : ''}`;
    popup.innerHTML = innerHtml;
    document.body.appendChild(popup);

    const formHeight = popup.offsetHeight;
    const timelineTop = rect.top + 4;
    const timelineBottom = rect.bottom - 4;
    let finalTop;
    if (clickY + formHeight <= timelineBottom) {
      // 往下展開放得下，就貼著點擊位置的上緣往下展開(原本的邏輯)
      finalTop = Math.max(timelineTop, clickY);
    } else {
      // 往下會超出時間軸範圍，改成往上展開，讓表單底部對齊點擊位置(或時間軸底部，取較低者)
      finalTop = Math.max(timelineTop, Math.min(clickY, timelineBottom) - formHeight);
    }
    popup.style.top = `${finalTop}px`;
    popup.style.visibility = 'visible';
    wireDayEventForm();
  }

  // 長時間的色塊，滑鼠移過去只反藍「游標所在那一小時」的那一段，不是整塊都框起來
  function wirePillHourHover(root) {
    const HOUR_PX = QTR_H * 12; // 一小時的實際高度(px)
    root.querySelectorAll('.day-timeline-pill:not(.week-grid-form .day-timeline-pill)').forEach(pill => {
      let overlay = null;
      pill.addEventListener('mousemove', (e) => {
        const rect = pill.getBoundingClientRect();
        const relY = e.clientY - rect.top;
        const hourIndex = Math.max(0, Math.floor(relY / HOUR_PX));
        const top = hourIndex * HOUR_PX;
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.className = 'pill-hour-highlight';
          pill.appendChild(overlay);
        }
        overlay.style.top = `${top}px`;
        overlay.style.height = `${HOUR_PX}px`;
      });
      pill.addEventListener('mouseleave', () => {
        if (overlay) { overlay.remove(); overlay = null; }
      });
    });
    // 長時間活動(台東旅遊這種)的色塊：不能整筆編輯，改成雙擊哪個小時，就當作點那個小時要新增行程
    // (如果那個小時已經有疊層的行程，疊層的 z-index 比較高，雙擊會先命中疊層那筆，正常打開它的編輯，不會誤觸這裡)
    root.querySelectorAll('.day-long-pill').forEach(pill => {
      pill.addEventListener('dblclick', (e) => {
        const rect = pill.getBoundingClientRect();
        const relY = e.clientY - rect.top;
        const relHour = Math.max(0, Math.floor(relY / HOUR_PX));
        const startHour = Number(pill.dataset.pillStartHour || 0);
        const hourIndex = Math.max(0, Math.min(23, startHour + relHour));
        dayAddHour = hourIndex; dayEditId = null; selectedPillId = null; selectedHour = null;
        renderWeekView();
      });
    });
  }

  function hourItemPill(it) {
    if (it.kind === 'task') {
      return `<div class="day-hour-pill" style="background:var(--mint-accent-bg);color:#1a1a1a">${Util.esc(it.title)}</div>`;
    }
    const cat = CalShared.categoryOf(it);
    const prefix = '';
    const timeStr = it.kind === 'event' ? Util.eventSpanLabel(it) : Util.timeRange(it.startTime, it.endTime);
    return `<div class="day-hour-pill" style="background:${cat.bg};color:${cat.fg}">${prefix}${timeStr ? `${timeStr} ` : ''}${Util.esc(it.title)}</div>`;
  }

  // 單日時間軸裡「新增」／「編輯」共用的表單：幾點到幾點、要做什麼、類型顏色、備註
  function dayEventFormHtml(opts) {
    const isEdit = opts.mode === 'edit';
    const it = opts.item;
    const uid = isEdit ? `de-${it.id}` : `da-${opts.hour}`;
    const title = isEdit ? it.title : '';
    const note = isEdit ? (it.note || '') : '';
    const category = isEdit ? it.category : '';
    const categoryColor = isEdit ? it.categoryColor : 'green';
    const startTime = isEdit ? (it.startTime || '') : `${String(opts.hour).padStart(2, '0')}:00`;
    const endTime = isEdit ? (it.endTime || '') : `${String(Math.min(23, opts.hour + 1)).padStart(2, '0')}:00`;
    return `
      <div class="day-add-form" data-form-uid="${uid}" data-form-mode="${opts.mode}" data-form-id="${isEdit ? it.id : ''}">
        <input class="input" id="${uid}-title" placeholder="幾點到幾點要做什麼？" value="${Util.esc(title)}" style="margin-bottom:6px">
        <div style="margin-bottom:6px">${CalShared.categoryFieldHtml(`${uid}-cat`, category, categoryColor)}</div>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:6px;cursor:pointer">
          <input type="checkbox" id="${uid}-allday" ${isEdit && !it.startTime ? 'checked' : ''}> 全天（不指定時間，例如生日）
        </label>
        <div class="form-row" id="${uid}-timerow" style="align-items:center;margin-bottom:6px;${isEdit && !it.startTime ? 'display:none' : ''}">
          ${Util.timeSelectHtml(`${uid}-start`, startTime)}
          <span class="muted">–</span>
          ${Util.timeSelectHtml(`${uid}-end`, endTime)}
        </div>
        <textarea class="input" id="${uid}-note" placeholder="備註（選填）" style="margin-bottom:6px;min-height:44px;resize:vertical">${Util.esc(note)}</textarea>
        <div class="form-row" style="align-items:center;margin-bottom:0">
          <button class="btn btn-sm" style="background:var(--blue-accent);color:#fff" id="${uid}-confirm">${isEdit ? '確認' : '新增'}</button>
          ${isEdit ? `<button class="link-btn" style="color:var(--danger)" id="${uid}-delete">刪除</button>` : ''}
          <button class="link-btn" id="${uid}-cancel">取消</button>
        </div>
      </div>
    `;
  }

  function wireDayEventForm() {
    const form = document.querySelector('[data-form-uid]');
    if (!form) return;
    const uid = form.dataset.formUid;
    const mode = form.dataset.formMode;
    const id = form.dataset.formId;
    const titleInput = document.getElementById(`${uid}-title`);
    CalShared.wireCategoryField(`${uid}-cat`);
    const alldayCb = document.getElementById(`${uid}-allday`);
    const timeRow = document.getElementById(`${uid}-timerow`);
    if (alldayCb) {
      alldayCb.onchange = () => { timeRow.style.display = alldayCb.checked ? 'none' : ''; };
    }
    const confirm = () => {
      const title = titleInput.value.trim();
      if (!title) return;
      const { text: category, color: categoryColor } = CalShared.getCategoryFieldValue(`${uid}-cat`);
      const isAllday = alldayCb && alldayCb.checked;
      const startTime = isAllday ? '' : Util.timeSelectValue(`${uid}-start`);
      const endTime = isAllday ? '' : Util.timeSelectValue(`${uid}-end`);
      const note = document.getElementById(`${uid}-note`).value.trim();
      if (mode === 'add') {
        DataStore.addEvent(selectedDate, title, note, category, startTime, endTime, categoryColor, selectedDate);
        dayAddHour = null;
      } else {
        DataStore.updateEvent(id, { title, category, categoryColor, startTime, endTime, note });
        dayEditId = null;
      }
      cleanup();
      renderWeekView();
    };
    document.getElementById(`${uid}-confirm`).onclick = confirm;
    const cancel = () => { cleanup(); dayAddHour = null; dayEditId = null; renderWeekView(); };
    const cancelBtn = document.getElementById(`${uid}-cancel`);
    if (cancelBtn) cancelBtn.onclick = cancel;
    const delBtn = document.getElementById(`${uid}-delete`);
    if (delBtn) delBtn.onclick = () => { cleanup(); DataStore.deleteEvent(id); dayEditId = null; renderWeekView(); };

    // 點表單以外的空白處，或按 ESC，直接把編輯/新增視窗關掉(不儲存)
    const onOutsideClick = (e) => { if (!form.contains(e.target)) { cleanup(); dayAddHour = null; dayEditId = null; renderWeekView(); } };
    const onKeydown = (e) => { if (e.key === 'Escape') { cleanup(); dayAddHour = null; dayEditId = null; renderWeekView(); } };
    function cleanup() {
      document.removeEventListener('click', onOutsideClick, true);
      document.removeEventListener('keydown', onKeydown);
    }
    // 延遲綁定，避免觸發表單的那次點擊被自己的「外部點擊」偵測到而立刻關閉
    setTimeout(() => {
      document.addEventListener('click', onOutsideClick, true);
      document.addEventListener('keydown', onKeydown);
    }, 0);
  }

  return { render };
})();

</script>
<script>
/* 資產負債頁 — 資產負債表(可直接編輯，Excel 風格) */
window.Pages = window.Pages || {};
Pages.habits = (function () {
  // 習慣追蹤：跟行事曆(有明確時間)、待辦(打勾一次結束)不一樣，這裡專門處理「會重複、常常有量或頻率」的習慣，
  // 例如每天喝水到某個量、一週要運動幾次、每天打卡聽點什麼
  let showAddForm = false;

  function weekStartOf(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() - d.getDay());
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function shiftDate(dateStr, days) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + days);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  let containerId = 'habits-embed'; // 記住最後一次渲染的容器 id，這樣按鈕觸發的重新渲染不用每次都傳參數

  function render(targetId) {
    if (targetId) containerId = targetId;
    const root = document.getElementById(containerId);
    if (!root) return;
    const habits = DataStore.getHabits();
    const today = DataStore.todayStr();

    root.innerHTML = `
      <div class="card-title">
        <span>🔥 今日習慣</span>
        <button class="link-btn" id="toggle-add-habit">${showAddForm ? '取消' : '+ 新增習慣'}</button>
      </div>
      ${showAddForm ? addFormHtml() : ''}
      <div class="grid grid-2" id="habits-grid" style="align-items:start">
        ${habits.length === 0 ? '<div class="empty-hint">還沒有任何習慣，點右上角「+ 新增習慣」開始追蹤吧（例如每天喝水、一週重訓幾次、每天打卡聽點什麼）</div>' : habits.map(h => habitCardHtml(h, today)).join('')}
      </div>
    `;

    document.getElementById('toggle-add-habit').onclick = () => { showAddForm = !showAddForm; render(); };
    wireAddForm();
    wireHabitCards(today);
  }

  function addFormHtml() {
    return `
      <div class="card" style="margin-bottom:16px">
        <div class="card-title">新增習慣</div>
        <input class="input" id="habit-title" placeholder="習慣名稱，例如：每天喝水、重訓、聽安麗創業CD" style="margin-bottom:8px">
        <select class="input" id="habit-type" style="margin-bottom:8px">
          <option value="cumulative">每天要累積到一個量（例如喝水 4000cc）</option>
          <option value="weekly">一週要做到幾次（例如重訓一週 3 次）</option>
          <option value="daily">每天打卡就好（例如聽 CD）</option>
        </select>
        <div class="form-row" id="habit-target-row" style="align-items:center;margin-bottom:8px">
          <input class="input" id="habit-target" type="number" min="1" placeholder="目標數字" style="flex:1">
          <input class="input" id="habit-unit" placeholder="單位（例如 cc、次）" style="flex:1">
        </div>
        <button class="btn" style="background:var(--blue-accent);color:#fff" id="confirm-add-habit">新增</button>
      </div>
    `;
  }

  function wireAddForm() {
    const typeSel = document.getElementById('habit-type');
    if (!typeSel) return;
    const targetRow = document.getElementById('habit-target-row');
    const unitInput = document.getElementById('habit-unit');
    const syncVisibility = () => {
      if (typeSel.value === 'daily') { targetRow.style.display = 'none'; }
      else { targetRow.style.display = ''; unitInput.style.display = typeSel.value === 'weekly' ? 'none' : ''; }
    };
    typeSel.onchange = syncVisibility;
    syncVisibility();
    document.getElementById('confirm-add-habit').onclick = () => {
      const title = document.getElementById('habit-title').value.trim();
      if (!title) return;
      const type = typeSel.value;
      const targetInput = document.getElementById('habit-target').value;
      const target = targetInput || (type === 'weekly' ? 3 : 1);
      const unit = unitInput.value.trim();
      DataStore.addHabit(title, type, target, unit);
      showAddForm = false;
      render();
    };
  }

  function habitCardHtml(h, today) {
    const logs = DataStore.getHabitLogs().filter(l => l.habitId === h.id);
    if (h.type === 'cumulative') {
      const todayTotal = logs.filter(l => l.date === today).reduce((s, l) => s + l.value, 0);
      const pct = Math.min(100, Math.round((todayTotal / h.target) * 100));
      return `<div class="card" data-habit-card="${h.id}">
        <div class="card-title"><span>💧 ${Util.esc(h.title)}</span><button class="link-btn" style="color:var(--danger)" data-del-habit="${h.id}">刪除</button></div>
        <div style="font-size:22px;font-weight:700;margin-bottom:4px">${todayTotal} <span class="muted" style="font-size:13px;font-weight:400">/ ${h.target} ${Util.esc(h.unit)}</span></div>
        <div style="background:var(--border);border-radius:6px;height:8px;overflow:hidden;margin-bottom:10px"><div style="background:var(--blue-accent);height:100%;width:${pct}%"></div></div>
        <div class="form-row" style="align-items:center;margin-bottom:0">
          <input class="input" id="log-amount-${h.id}" type="number" placeholder="加多少" style="flex:1">
          <button class="btn btn-sm" style="background:var(--blue-accent);color:#fff" data-log-habit="${h.id}">+ 記錄</button>
          <button class="btn btn-ghost btn-sm" data-undo-habit="${h.id}">復原上一筆</button>
        </div>
      </div>`;
    }
    if (h.type === 'weekly') {
      const ws = weekStartOf(today);
      const weekDates = Array.from({ length: 7 }, (_, i) => shiftDate(ws, i));
      const weekDows = ['日', '一', '二', '三', '四', '五', '六'];
      const weekLogs = logs.filter(l => weekDates.includes(l.date));
      const doneDates = new Set(weekLogs.map(l => l.date));
      const count = weekLogs.length;
      const doneToday = doneDates.has(today);
      return `<div class="card" data-habit-card="${h.id}">
        <div class="card-title"><span>🏋️ ${Util.esc(h.title)}</span><button class="link-btn" style="color:var(--danger)" data-del-habit="${h.id}">刪除</button></div>
        <div style="font-size:22px;font-weight:700;margin-bottom:8px">${count} <span class="muted" style="font-size:13px;font-weight:400">/ ${h.target} 次（本週）</span></div>
        <div style="display:flex;gap:4px;margin-bottom:10px">
          ${weekDates.map((ds, i) => `<div style="flex:1;text-align:center">
            <div style="height:8px;border-radius:4px;background:${doneDates.has(ds) ? 'var(--blue-accent)' : 'var(--border)'};margin-bottom:2px" title="${ds}"></div>
            <span class="muted" style="font-size:10px">${weekDows[i]}</span>
          </div>`).join('')}
        </div>
        <button class="btn btn-sm" style="background:${doneToday ? 'var(--border)' : 'var(--blue-accent)'};color:${doneToday ? 'var(--muted)' : '#fff'}" data-log-habit="${h.id}" ${doneToday ? 'disabled' : ''}>${doneToday ? '今天已完成 ✓' : '今天打卡一次'}</button>
      </div>`;
    }
    // daily 打卡型：計算連續天數(streak)，從今天往回算，只要那天有記錄就算連續
    let streak = 0;
    let cursor = today;
    const logDates = new Set(logs.map(l => l.date));
    while (logDates.has(cursor)) { streak++; cursor = shiftDate(cursor, -1); }
    const doneToday = logDates.has(today);
    return `<div class="card" data-habit-card="${h.id}">
      <div class="card-title"><span>✅ ${Util.esc(h.title)}</span><button class="link-btn" style="color:var(--danger)" data-del-habit="${h.id}">刪除</button></div>
      <div style="font-size:22px;font-weight:700;margin-bottom:8px">🔥 連續 ${streak} 天</div>
      <button class="btn btn-sm" style="background:${doneToday ? 'var(--border)' : 'var(--blue-accent)'};color:${doneToday ? 'var(--muted)' : '#fff'}" data-log-habit="${h.id}" ${doneToday ? 'disabled' : ''}>${doneToday ? '今天已完成 ✓' : '今天打卡'}</button>
    </div>`;
  }

  function wireHabitCards(today) {
    document.querySelectorAll('[data-del-habit]').forEach(el => {
      el.onclick = () => { DataStore.deleteHabit(el.dataset.delHabit); render(); };
    });
    document.querySelectorAll('[data-log-habit]').forEach(el => {
      el.onclick = () => {
        const id = el.dataset.logHabit;
        const amountInput = document.getElementById(`log-amount-${id}`);
        const value = amountInput ? (Number(amountInput.value) || 0) : 1;
        if (amountInput && value <= 0) return;
        DataStore.logHabit(id, today, value);
        render();
      };
    });
    document.querySelectorAll('[data-undo-habit]').forEach(el => {
      el.onclick = () => { DataStore.removeLastHabitLog(el.dataset.undoHabit, today); render(); };
    });
  }

  return { render };
})();

Pages.finance = (function () {
  function render() {
    const root = document.getElementById('page-finance');
    const assets = DataStore.getAssets();
    const liabilities = DataStore.getLiabilities();
    const assetTotal = assets.reduce((s, a) => s + a.amount, 0);
    const liabTotal = liabilities.reduce((s, l) => s + l.amount, 0);
    const net = assetTotal - liabTotal;

    root.innerHTML = `
      <div class="page-hd">
