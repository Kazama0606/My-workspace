<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%BC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sidebar-bg: #f3ede1;
  --sidebar-text: #6b6255;
  --sidebar-active-bg: #ffffff;
  --sidebar-active-text: #3a3226;

  --home-bg: #fdf8ee;
  --home-accent: #d97706;
  --home-accent-bg: #fdecd2;
  --goal-color: #c2410c;
  --quote-color: #8a6d3b;

  --blue-bg: #eef6fc;
  --blue-accent: #2b7fd1;
  --blue-accent-bg: #dbeefc;

  --mint-bg: #eef9f2;
  --mint-accent: #0d9488;
  --mint-accent-bg: #d7f3e6;

  --beige-bg: #f3ede0;
  --idea-shoot-bg: #ecd889;
  --idea-video-bg: #d9b48c;
  --idea-course-bg: #b8c9a3;
  --idea-marketing-bg: #d9a8a0;
  --idea-branding-bg: #c4a878;

  --card: #ffffff;
  --border: #e6e0d4;
  --text: #2f2b22;
  --muted: #8a8272;
  --danger: #dc2626;
  --danger-bg: #fee2e2;
  --radius: 14px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
}

body {
  font-family: 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', -apple-system, sans-serif;
  color: var(--text);
  min-height: 100vh;
  background: var(--home-bg);
}

/* ── App Shell ── */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 216px;
  flex-shrink: 0;
  background: var(--sidebar-bg);
  padding: 24px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
/* 桌面版：這層包裝不影響原本版面，項目直接照舊排列；手機版另外覆寫成獨立一排(見手機版媒體查詢) */
.sidebar-nav-row { display: contents; }
.sidebar-photo {
  width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; align-self: center; margin-bottom: 16px;
  overflow: hidden; background: var(--home-accent-bg);
  display: flex; align-items: center; justify-content: center; font-size: 48px;
  cursor: pointer; color: var(--home-accent); flex-shrink: 0;
}
.sidebar-photo img { width: 100%; height: 100%; object-fit: cover; }
.sidebar-logo {
  font-size: 15px;
  font-weight: 700;
  color: var(--sidebar-active-text);
  padding: 0 10px 20px;
  letter-spacing: .02em;
}
.sidebar-logo-input {
  border: none; background: transparent; outline: none; padding: 0;
  font: inherit; color: inherit; letter-spacing: inherit; width: 70px;
  border-bottom: 1px dashed var(--border);
}
.sidebar-logo-input:focus { border-bottom-color: var(--home-accent); }

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 9px;
  cursor: pointer;
  color: var(--sidebar-text);
  font-size: 14px;
  font-weight: 500;
  transition: background .15s, color .15s;
  user-select: none;
}
.nav-item:hover { background: rgba(255,255,255,.6); }
.nav-item.active { background: var(--sidebar-active-bg); color: var(--sidebar-active-text); box-shadow: var(--shadow); font-weight: 700; }
.nav-icon { font-size: 16px; width: 20px; text-align: center; }

.main { flex: 1; min-width: 0; padding: 32px 40px; }
.page { display: none; }
.page.active { display: block; }

.page-hd { margin-bottom: 24px; }
.page-title { font-size: 22px; font-weight: 700; }
.page-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

/* per-page background tint */
.page-home { background: var(--home-bg); margin: -32px -40px; padding: 32px 40px; min-height: calc(100vh - 0px); }
.page-projects, .page-todo, .page-calendar, .page-goals { background: var(--blue-bg); margin: -32px -40px; padding: 32px 40px; min-height: 100vh; }
.page-creation { background: var(--beige-bg); margin: -32px -40px; padding: 32px 40px; min-height: 100vh; }
.page-finance { background: var(--mint-bg); margin: -32px -40px; padding: 32px 40px; min-height: 100vh; }

/* home page: 首頁整體字體再放大一點 */
.page-home { font-size: 15px; }
.page-home .card-title { font-size: 14px; }

/* ── Cards / grid ── */
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
}
.card-title { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
/* 首頁右側欄「當天安排／近三日的行程／近期行程」三張卡片，高度統一，看起來整齊一致 */
#home-side-col .card, #home-cal-panel > .card { min-height: 190px; box-sizing: border-box; }
#home-side-col .card-title, #home-cal-panel .card-title { color: #1a1a1a; font-weight: 700; font-size: 14px; }

/* ── Buttons / inputs ── */
.btn {
  padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 13px; font-weight: 600; font-family: inherit; transition: opacity .15s;
}
.btn:hover { opacity: .85; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-danger { background: var(--danger-bg); color: var(--danger); }
.btn-beige { background: var(--home-accent-bg); color: var(--quote-color); font-weight: 600; }

.input, select.input {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 13px; font-family: inherit; background: #fff; color: var(--text);
  box-sizing: border-box; min-height: 38px;
}
input.input[type="date"], input.input[type="time"] { line-height: 20px; }
.time-select { display: inline-flex; align-items: center; gap: 3px; }
.time-select-h, .time-select-m { width: 48px; padding: 8px 2px; text-align: center; flex: 0 0 auto; }
.time-select-colon { color: var(--muted); font-weight: 700; }
.input:focus { outline: none; border-color: var(--blue-accent); }
.input-lg { font-size: 17px; padding: 12px 14px; }
.form-row { display: flex; gap: 8px; margin-bottom: 8px; }
.form-row .input { flex: 1; }

/* ── Lists ── */
.list-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 4px;
  border-bottom: 1px solid var(--border); font-size: 13px; flex-wrap: nowrap;
}
.list-item:last-child { border-bottom: none; }
.list-item .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag {
  display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
  background: var(--blue-accent-bg); color: var(--blue-accent); font-weight: 600; white-space: nowrap;
}
.due-overdue { color: var(--danger); font-weight: 700; }
.due-today { color: var(--home-accent); font-weight: 700; }
.muted { color: var(--muted); }
.strike { text-decoration: line-through; color: var(--muted); }

.empty-hint { color: var(--muted); font-size: 13px; padding: 20px 4px; text-align: center; }

/* ── 待辦清單：欄位順序 待辦事項→辦理日期→專案名稱→備註 ── */
.todo-rows { display: flex; flex-direction: column; }
.todo-row {
  display: flex; align-items: center; gap: 14px; padding: 14px 4px;
  border-bottom: 1px solid var(--border);
}
.todo-row:last-child { border-bottom: none; }
.todo-row .cell-input { flex: 1; }
.todo-title { flex: 1; min-width: 0; font-size: 16px; }
.todo-flag { font-size: 15px; }
.todo-due { flex: 0 0 120px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
.todo-urgent-icon { font-size: 14px; }
.todo-due-input { flex: 0 0 160px !important; }
.todo-note { flex: 1; min-width: 0; font-size: 13px; }
.todo-row select.cell-input { flex: 0 0 150px; }
.todo-flag-input { flex: 0 0 140px !important; }

/* ── 只顯示日曆圖示的日期選取器(隱藏 YYYY/MM/DD 文字，只留可點的小圖示)，僅 WebKit/Chromium(Edge、Chrome)有效 ── */
.date-icon-only {
  flex: 0 0 34px !important; width: 34px; padding: 8px 4px; color: transparent;
  background: var(--card); cursor: pointer;
}
.date-icon-only::-webkit-datetime-edit,
.date-icon-only::-webkit-datetime-edit-fields-wrapper,
.date-icon-only::-webkit-datetime-edit-text,
.date-icon-only::-webkit-datetime-edit-month-field,
.date-icon-only::-webkit-datetime-edit-day-field,
.date-icon-only::-webkit-datetime-edit-year-field { display: none; }
.date-icon-only::-webkit-calendar-picker-indicator { opacity: 1; margin: 0; }

/* 新增／編輯列：上排欄位＋下方大備註框，直向堆疊 */
.todo-row-editing { flex-direction: column; align-items: stretch; gap: 10px; }
.todo-edit-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.todo-note-input {
  width: 100%; min-height: 90px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 15px; font-family: inherit; background: #fff; color: var(--text); resize: vertical;
}
.todo-note-input:focus { outline: none; border-color: var(--blue-accent); }

.link-btn { background: none; border: none; cursor: pointer; color: var(--blue-accent); font-family: inherit; font-size: 13px; font-weight: 600; padding: 0; }

/* ── 行事曆：類型自行輸入 + 顏色選擇器 ── */
.color-swatch-row { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 8px; }
.color-swatch {
  width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent; padding: 0; box-shadow: 0 0 0 1px rgba(0,0,0,.08) inset;
}
.color-swatch.selected { border-color: var(--text); }

/* ── 待辦頁：隨手買清單，3 欄表格排列，標籤緊貼文字 ── */
.shop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 22px; margin-bottom: 8px; }
.shop-item { display: flex; align-items: center; gap: 6px; font-size: 15px; padding: 7px 2px; border-bottom: 1px solid var(--border); min-width: 0; }
.shop-item-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shop-item .tag { flex-shrink: 0; }
.shop-input { font-size: 15px; padding: 9px 11px; }

/* ── Calendar ── */
.cal-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; }
.cal-hd .btn-sm { padding: 6px 14px; font-size: 14px; }
/* ── 週檢視：頂部一排可點的日期(取代原本的 7 天 x 24 小時大表格) ── */
.week-strip { display: flex; gap: 8px; justify-content: space-between; }
.week-strip-day {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: none; border: none; cursor: pointer; padding: 6px 2px; border-radius: 12px; font-family: inherit;
}
.week-strip-dow { font-size: 12px; color: var(--muted); font-weight: 600; }
.week-strip-num {
  width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; color: var(--text); background: var(--home-bg);
}
.week-strip-day.today .week-strip-num { box-shadow: 0 0 0 2px var(--blue-accent) inset; }
.week-strip-day.selected .week-strip-num { background: var(--text); color: #fff; }
.week-strip-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--home-accent); margin-top: -2px; }
/* cal-grid 本身改成上下堆疊：星期標題列 + 每一週一列，每週列裡才是真正的 7 欄格子 */
.cal-grid { display: flex; flex-direction: column; gap: 6px; }
.cal-dow-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-dow { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; padding-bottom: 6px; }
.cal-week-row { display: flex; flex-direction: column; }
.cal-week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; min-width: 0; }
/* 跨天橫條(週檢視上方的全天列專用，月曆格子改用 .cal-cell-bar，見下) */
.cal-week-bar {
  position: absolute; cursor: pointer; overflow: hidden; box-sizing: border-box;
  display: flex; align-items: center; padding: 0 6px;
}
.cal-week-bar-title { font-size: 10px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-week-bar-time { font-weight: 400; opacity: .8; }
.cal-cell {
  min-height: 92px; min-width: 0; background: var(--card); border: 1px solid #b9b0a0; border-radius: 10px;
  padding: 6px; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 3px;
  overflow: hidden; box-sizing: border-box; position: relative;
}
/* 跨天橫條：畫在每一格自己裡面、貼在格子最下方，靠 CSS Grid 同一列格子自動等高，天然對齊成一條連續的線 */
.cal-cell-bar {
  position: absolute; cursor: pointer; overflow: hidden; box-sizing: border-box;
  display: flex; align-items: center; padding: 0 4px; font-size: 9px; font-weight: 600;
}
.cal-cell-bar-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-cell.empty { background: transparent; border: none; cursor: default; }
/* 行事曆頁的月曆格子：改成接近正方形(寬高大致相等)，四個角圓角比例才會看起來均勻一致 */
.cal-grid-compact .cal-cell { aspect-ratio: 1 / 1; min-height: 68px; }
/* 首頁小月曆：格子跟字都放大一點，一眼就看得清楚，不用點也不用 hover；正方形(寬高比1:1)，因為7欄寬度都一樣，天然就會大小一致 */
#home-cal-grid.cal-grid { gap: 10px; }
#home-cal-grid .cal-week-grid { gap: 10px; }
#home-cal-grid .cal-cell { aspect-ratio: 1 / 1; min-height: 90px; padding: 5px; font-size: 11px; gap: 2px; }
#home-cal-grid .cal-daynum { font-size: 13px; }
#home-cal-grid .cal-dow { font-size: 13px; font-weight: 700; color: #1a1a1a; }
#home-cal-grid .cal-dot { font-size: 10px; padding: 2px 4px; }
#home-cal-grid .cal-dot-title { font-size: 10px; }
#home-cal-grid .cal-dot-time { font-size: 9px; }
#home-cal-grid .cal-cell-bar { font-size: 10px; }
#home-cal-grid .cal-cell-bar-title { font-size: 10px; }
#home-cal-grid .cal-holiday-label { font-size: 9px; }
/* 固定行程：不用圖示，改成整個小方塊用類別色「框起來」(虛線外框)跟一般單次行程(只有左邊一條實線)區分；線加粗、加深顏色，一眼就看得出跟一般行程不一樣 */
.cal-dot.recurring { border: 2.5px dashed var(--cal-dot-accent, #999); background: color-mix(in srgb, var(--cal-dot-accent, #999) 12%, #fff); }
.cal-cell.today { border-color: var(--blue-accent); border-width: 2px; }
.cal-cell.selected { background: var(--blue-accent-bg); }
.cal-cell.drag-over { background: var(--mint-accent-bg); outline: 2px dashed var(--mint-accent); outline-offset: -2px; }
.cal-daynum-row { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; flex-shrink: 0; }
/* 國定假日標籤：跟行程用的 dot/bar 完全分開的獨立元素，只是日期數字下面一行小小的紅字提示，不會影響行程或跨天活動的排版 */
.cal-holiday-label { font-size: 10px; color: var(--danger); font-weight: 600; line-height: 1.2; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-daynum { font-weight: 700; color: var(--text); }
.cal-daynum.weekend { color: var(--danger); }
.cal-note { font-size: 9px; color: #e57373; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
/* 每個行程方塊固定顯示兩行：標題在上(資訊多時優先保留)，時間在下(較小、可被裁切)，高度固定不會把格子撐高
   改成參考蘋果日曆的風格：白底 + 左邊一條類別色線，取代整塊塗滿的彩色底，顏色種類一多也不會覺得雜亂 */
.cal-dot {
  font-size: 10px; padding: 2px 5px 2px 6px; border-radius: 4px;
  background: #fff; color: #2c2c2c; border-left: 3px solid var(--cal-dot-accent, #999);
  box-shadow: 0 0 0 1px rgba(0,0,0,.06);
  cursor: grab; touch-action: none; user-select: none; display: flex; flex-direction: column; gap: 0; flex-shrink: 0;
  line-height: 1.25;
}
.cal-dot:active { cursor: grabbing; }
.cal-dot-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-dot-time { font-size: 9px; opacity: .65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-dot.task { background: #fff; color: #2c2c2c; border-left: 3px dashed var(--mint-accent); box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
.cal-dot-dragging { opacity: .3; }
.cal-dot-ghost { position: fixed; top: 0; left: 0; z-index: 999; pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.28); opacity: .95; }
.cal-cell-more { font-size: 10px; color: var(--muted); flex-shrink: 0; }
.cal-dot-circles { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.cal-dot-circle { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 1px solid #1a1a1a; box-sizing: border-box; }
/* 事情很多的那天，「+N」改成放在格子右上角的小徽章，一眼就看得出這天比較忙、但不會太搶眼；
   只在桌面版生效(min-width:861px)，手機版維持原本簡單文字樣式，完全不受影響 */
@media (min-width: 861px) {
  .cal-cell-more {
    position: absolute; top: 5px; right: 5px; display: flex; align-items: center; justify-content: center;
    background: var(--blue-accent-bg); color: var(--blue-accent); font-weight: 700;
    min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; font-size: 9px; line-height: 1;
    box-sizing: border-box;
  }
  /* 桌面版：同步狀態移到畫面右上角空白處(跟首頁語錄同一排右邊)，不要卡在左側導覽列清單裡 */
  #cloud-sync-status {
    position: fixed; top: 18px; right: 24px; z-index: 40;
    white-space: nowrap; margin: 0 !important;
    padding: 5px 12px; border-radius: 20px; background: var(--card, #fff);
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
}

/* ── 行事曆：週檢視(雙擊月曆日期切換進來)，用 CSS Grid 原生跨列(grid-row)畫出事件方塊，
   對齊 5 分鐘刻度，瀏覽器原生保證位置精準，不會被捲動容器或絕對定位的計算誤差影響 ── */
.day-timeline { max-height: 760px; overflow-y: auto; overflow-x: auto; border-top: 1px solid var(--border); user-select: none; }
.week-strip { user-select: none; }
.week-header-row { display: grid; gap: 0; position: sticky; top: 0; background: var(--card); z-index: 3; }
.week-day-header { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 2px; border-left: 1px solid var(--border); line-height: 1.4; }
.week-day-header.today { color: var(--blue-accent); background: var(--blue-accent-bg); border-radius: 6px 6px 0 0; }
.week-bars-row { position: relative; }
.week-bars-track { position: absolute; left: 0; right: 6px; top: 3px; }
.week-grid { display: grid; min-width: 640px; }
.week-grid-label { font-size: 10px; color: var(--muted); padding: 2px 6px 0 0; text-align: right; font-variant-numeric: tabular-nums; align-self: start; }
.week-grid-hourbg { border-top: 1px solid var(--border); border-left: 1px solid var(--border); box-sizing: border-box; cursor: pointer; }
.week-grid-hourbg:hover { background: var(--blue-accent-bg); }
.week-grid-block { margin: 1px 2px; overflow: hidden; align-self: stretch; }
.week-grid-form { overflow: visible; width: 280px; position: relative; }
.day-grid { display: grid; position: relative; }
.day-grid-label {
  font-size: 11px; color: var(--muted); padding: 4px 8px 0 0; text-align: right; font-variant-numeric: tabular-nums;
  align-self: stretch; cursor: pointer; border-radius: 4px; box-sizing: border-box;
}
.day-grid-label:hover { background: var(--blue-accent-bg); color: var(--blue-accent); }
.day-grid-label.selected { background: var(--blue-accent-bg); color: var(--blue-accent); font-weight: 700; box-shadow: 0 0 0 2px var(--blue-accent) inset; }
.day-grid-hourbg {
  padding: 2px 6px; border-top: 1px solid var(--border); border-left: 1px solid var(--border);
  box-sizing: border-box; cursor: pointer;
}
.day-grid-hourbg:hover { background: var(--blue-accent-bg); }
.day-grid-hourbg.selected { background: var(--blue-accent-bg); box-shadow: 0 0 0 2px var(--blue-accent) inset; }
.day-hour-pill { font-size: 12px; padding: 4px 9px; border-radius: 8px; line-height: 1.4; overflow-wrap: break-word; }
.day-grid-block { margin: 1px 6px 1px 2px; overflow: hidden; align-self: stretch; }
.day-timeline-pill {
  height: 100%; border-radius: 8px; padding: 6px 10px; overflow: hidden; cursor: default;
  display: flex; flex-direction: column; justify-content: flex-start; gap: 1px; box-sizing: border-box;
  position: relative;
}
.day-timeline-pill-row { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.day-timeline-pill-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
.day-timeline-pill-time { font-size: 11px; font-weight: 700; opacity: .85; white-space: nowrap; flex: 0 0 auto; }
.day-timeline-pill-note { font-size: 11px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 選取中：不管色塊底色是什麼，都用深色粗外框 + 陰影確保看得到，不會被同色系背景吃掉 */
.day-timeline-pill.pill-selected { box-shadow: 0 0 0 3px var(--text), 0 2px 8px rgba(0,0,0,.25); }
/* 長時間色塊的 hover 反藍：只反藍游標所在的那一個小時，不是整塊都框起來，用上下黑線分隔那一小時 */
.pill-hour-highlight {
  position: absolute; left: 0; right: 0; background: rgba(59,130,246,.28);
  border-top: 1px solid rgba(0,0,0,.5); border-bottom: 1px solid rgba(0,0,0,.5);
  pointer-events: none; z-index: 1;
}
/* 編輯中：外層維持行程原本的顏色(不要變白消失)，用實線外框標示「正在編輯」，表單本身白底方便閱讀輸入 */
.week-grid-form.editing { border-radius: 8px; box-shadow: 0 0 0 3px var(--blue-accent); padding: 3px; }
.week-grid-form.editing .day-add-form { border: none; box-shadow: none; }
.day-add-form { background: #fff; border: 1px solid var(--blue-accent); border-radius: 8px; padding: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.12); min-width: 160px; }

/* ── 行事曆：本日行程面板的雙擊編輯列(獨立於 todo-row，欄寬只有 300px 要另外調比例) ── */
.dp-edit-row { display: flex; align-items: center; gap: 8px; padding: 10px 4px; border-bottom: 1px solid var(--border); }
.dp-edit-row .dp-edit-title { flex: 1; min-width: 0; }
.dp-edit-row .dp-edit-cat { flex: 0 0 76px; padding: 8px 4px; font-size: 12px; }

/* ── 行事曆：開始日期欄位，樣式跟其他日期/時間欄位保持一致，不再特別上色 ── */
.jump-date-input {
  flex: 1;
}

/* ── Home: hero / date / quote ── */
.hero { display: flex; justify-content: flex-start; align-items: flex-start; gap: 90px; margin-bottom: 20px; flex-wrap: wrap; }
.home-date { font-size: 17px; font-weight: 600; color: var(--text); }
.quote-box {
  font-family: 'Noto Serif TC', 'PingFang TC', serif; font-weight: 700; font-style: normal;
  color: var(--quote-color); font-size: 26px; line-height: 1.6; white-space: nowrap;

/* ── Home: 長期目標預覽(兩欄三列) ── */
.goal-preview-grid { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: min-content; gap: 14px 16px; }
.goal-preview-item { font-size: 17px; font-weight: 700; color: var(--goal-color); line-height: 1.4; overflow-wrap: break-word; }

.project-progress-name { font-size: 15px; font-weight: 600; color: var(--blue-accent); }

.eye-toggle-btn:hover { opacity: .7; }

/* ── Home: chat widget ── */
.chat-log { max-height: 240px; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }

.idea-tile-composer { background: #fff; border: 1px solid var(--border); box-shadow: var(--shadow); }
.idea-tile-shoot { background: var(--idea-shoot-bg); box-shadow: 0 4px 10px rgba(0,0,0,.1); }

.idea-tile-marketing { background: var(--idea-marketing-bg); }

.idea-tile-label { font-size: 14px; font-weight: 700; color: var(--text); }
.idea-tile-del { background: none; border: none; cursor: pointer; color: var(--text); opacity: .45; font-size: 13px; padding: 2px 4px; }

/* ── 內嵌工具 ── */
.embed-frame { width: 100%; height: calc(100vh - 200px); min-height: 600px; border: 1px solid var(--border); border-radius: 12px; background: #fff; }

/* ── 時事快訊：每類兩欄兩列 ── */
.news-item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.news-item {
  display: flex; flex-direction: column; gap: 6px; text-decoration: none; padding: 10px;

  /* 首頁「當天行程」卡片在手機單欄排列時，不需要強制跟其他卡片一樣高，內容多短就多短，不留空白 */

  #cal-2x2 { display: flex !important; flex-direction: column !important; }
  #cal-2x2 > * { width: 100% !important; max-width: none !important; min-width: 0 !important; }

  #home-cal-grid.cal-grid { gap: 4px; }

  #home-cal-grid .cal-cell { height: 150px; min-height: 150px; padding: 3px; font-size: 10px; gap: 1px; aspect-ratio: auto !important; }
  #home-cal-grid .cal-daynum { font-size: 11px; }
  #home-cal-grid .cal-dow { font-size: 11px; }
  /* 雲端同步狀態文字：獨立佔頂部第一排、靠右對齊，下面第二排才是照片+導覽圖示，兩排都在 sticky 固定列裡，
     捲動頁面時整組一起固定在最上面，不會疊到下面頁面內容的標題上 */
  #cloud-sync-status {
    display: block; width: 100%; text-align: right; box-sizing: border-box;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 2px 4px 4px; margin: 0 !important;

  /* 表單欄位在窄螢幕自動換行，不會被擠出畫面外 ── */

  /* ── 顏色選盤在手機上 24 顆色點擠成一團，放大點徑跟間距，不用眼睛硬瞇 ── */
  .color-swatch-row { gap: 12px; }
  .color-swatch { width: 30px; height: 30px; }

  /* ── 待辦清單列在窄螢幕改成可換行，避免多個固定寬度欄位擠壓 ── */
  .todo-row { flex-wrap: wrap; row-gap: 6px; }
  .todo-title { flex: 1 1 100%; }
  .todo-due { flex: 0 0 auto; }
  .todo-row select.cell-input { flex: 1 1 140px; }

  /* ── 單日時間軸：時間標籤欄縮窄一點，讓內容區有更多空間 ── */
  .week-grid, .week-header-row { grid-template-columns: 40px repeat(7,minmax(84px,1fr)) !important; }
  .day-grid-label { font-size: 10px; padding-right: 4px; }
  .day-timeline-pill-title { font-size: 12px; }

  /* ── 資產負債的金額輸入欄在窄螢幕縮小固定寬度 ── */
  .amt-wrap { flex-basis: 120px; }

  /* ── 隨手買清單新增欄位改成整排堆疊 ── */
  .shop-input { flex: 1 1 100% !important; }

<body>
<div class="app">
  <div class="sidebar">
    <div id="cloud-sync-status" style="font-size:11px;color:var(--muted);margin:-8px 0 12px 4px">☁️ 準備中…</div>

    <div class="page page-calendar" id="page-calendar"></div>
    <div class="page page-finance" id="page-finance"></div>
    <div class="page page-creation" id="page-creation"></div>
    <div class="page page-clients" id="page-clients"></div>
  </div>
</div>


<script>
/* 雲端同步層(Firestore REST API，不用 Firebase SDK) — 讓電腦、手機打開同一份資料。
   改用最原始的 REST API(單純的 fetch 請求)，不用 SDK 那套即時串流連線(WebChannel)。
   原因：實測發現有些網路環境(例如公司防火牆的深層封包檢查)會擋掉 WebChannel 這種長時間保持連線的
   串流連線，但一般的 GET/PATCH 這種「發送後很快就結束」的請求可以正常通過，所以整個同步機制
   改成單純的 REST 請求：推送用 PATCH、讀取用輪詢(每隔一段時間 GET 一次)，不再依賴 SDK。 */
const CloudSync = (function () {
  const PROJECT_ID = 'kazama-1cfdb';
  const DOC_URL = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/workspace_sync/main`;
  const POLL_INTERVAL_MS = 20000; // 每 20 秒檢查一次雲端有沒有更新(取代即時監聽)
  let pushTimer = null;
  let pollTimer = null;
  let applyingRemote = false; // 遠端資料寫回本機的當下先擋住推送，避免自己推給自己造成無限迴圈
  // 新裝置/新網域第一次打開時，本機是空的，程式會自動塞幾筆範例資料，如果這個當下立刻推上雲端，
  // 可能會搶在「跟雲端比對、確認要不要套用雲端資料」這個檢查完成之前，把真正的雲端資料蓋掉。
  // 所以剛打開網頁的這段時間先把推送「排隊」，等第一次跟雲端的比對確定完成後才真的送出。
  let allowPush = false;
  let queuedPush = null;

  function setStatus(text, color) {
    const el = document.getElementById('cloud-sync-status');
    if (el) { el.textContent = text; el.style.color = color || ''; }
  }

  function push(payloadStr, updatedAt) {
    if (applyingRemote) return;
    if (!allowPush) { queuedPush = { payloadStr, updatedAt }; return; }
    clearTimeout(pushTimer);
    setStatus('☁️ 同步中…', '#999');
    pushTimer = setTimeout(() => {
      const body = { fields: { payload: { stringValue: payloadStr }, updatedAt: { integerValue: String(updatedAt) } } };
      fetch(DOC_URL, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          setStatus('☁️ 已同步', '#2b7fd1');
        })
        .catch(e => {
          console.warn('推送到雲端失敗', e);
          setStatus('⚠️ 同步失敗：' + (e && e.message ? e.message : e), '#c0392b');
        });
    }, 1000);
  }

  // 第一次跟雲端比對完成(不管是套用了雲端資料、還是使用者選擇保留本機)後呼叫這個，才真的放行推送，
  // 排隊中如果有最新一筆待推送的資料，這時候補推上去
  function releaseQueuedPush() {
    allowPush = true;
    if (queuedPush) {
      const q = queuedPush;
      queuedPush = null;
      push(q.payloadStr, q.updatedAt);
    }
  }

  function pullOnce(onRemoteChange) {
    fetch(DOC_URL)
      .then(res => {
        if (res.status === 404) { setStatus('☁️ 尚未同步過(還沒有雲端資料)', '#999'); releaseQueuedPush(); return null; }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(data => {
        if (!data || !data.fields) { releaseQueuedPush(); return; }
        const payloadStr = data.fields.payload && data.fields.payload.stringValue;
        const updatedAt = data.fields.updatedAt && Number(data.fields.updatedAt.integerValue);
        if (payloadStr && updatedAt) {
          onRemoteChange(payloadStr, updatedAt);
          setStatus('☁️ 已同步', '#2b7fd1');
        } else {
          releaseQueuedPush();
        }
      })
      .catch(e => {
        console.warn('讀取雲端失敗', e);
        setStatus('⚠️ 同步失敗：' + (e && e.message ? e.message : e), '#c0392b');
        releaseQueuedPush(); // 讀取失敗也先放行推送，避免網路一直不順時卡死、永遠存不出去
      });
  }

  // onRemoteChange(payloadStr, updatedAt)：每次輪詢抓到雲端資料就會呼叫一次(呼叫端自己比對時間戳決定要不要套用)
  function listen(onRemoteChange) {
    setStatus('☁️ 準備中…', '#999');
    pullOnce(onRemoteChange); // 先立刻拉一次，不用等第一個輪詢週期
    clearInterval(pollTimer);
    pollTimer = setInterval(() => pullOnce(onRemoteChange), POLL_INTERVAL_MS);
  }

  return {
    push, listen, releaseQueuedPush,
    isEnabled: () => true,
    setApplyingRemote: (v) => { applyingRemote = v; },
  };
})();

    const unit = r.unit || 'week';

      if (d.getDate() !== anchor.getDate()) return false;
      const diffMonths = (d.getFullYear() - anchor.getFullYear()) * 12 + (d.getMonth() - anchor.getMonth());
      if (diffMonths % interval !== 0) return false;
      occurrenceIndex = diffMonths / interval;
    } else if (unit === 'year') {
      if (d.getDate() !== anchor.getDate() || d.getMonth() !== anchor.getMonth()) return false;
      const diffYears = d.getFullYear() - anchor.getFullYear();
      if (diffYears % interval !== 0) return false;
      occurrenceIndex = diffYears / interval;
    } else {
      if (d.getDay() !== anchor.getDay()) return false;
      const diffWeeks = Math.round((d - anchor) / (7 * 86400000));
      if (diffWeeks % interval !== 0) return false;
      occurrenceIndex = diffWeeks / interval;
    }
    if (r.endType === 'date' && r.endValue && dateStr > r.endValue) return false;
    if (r.endType === 'count' && r.endValue && occurrenceIndex >= Number(r.endValue)) return false;
    return true;
  }

        // 找找看是不是舊版沒標記 uid 的匯入殘留(同天同標題)，有的話直接認領，避免重複新增
        const legacy = db.events.find(e => !e.icsUid && e.date === pe.date && e.title === pe.title);
        if (legacy) { legacy.icsUid = pe.uid; legacy.category = category; return; }
        db.events.push({ id: uid(), date: pe.date, title: pe.title, note: '', category, icsUid: pe.uid });
        added++;
      });
      existingTracked.forEach(e => {
        if (!seenUids.has(e.icsUid)) { db.events = db.events.filter(x => x.id !== e.id); removed++; }
      });
      save();
      return { added, updated, removed };
    },

    // ── 行事曆：日期備註(手動填寫，不是自動判斷節日/農民曆) ──
    getDateNote: (date) => {
      const n = db.dateNotes.find(n => n.date === date);
      return n ? n.text : '';
    },
    setDateNote: (date, text) => {
      const trimmed = (text || '').trim();
      const existing = db.dateNotes.find(n => n.date === date);
      if (trimmed) {
        if (existing) existing.text = trimmed;
        else db.dateNotes.push({ id: uid(), date, text: trimmed });
      } else if (existing) {
        db.dateNotes = db.dateNotes.filter(n => n.date !== date);
      }
      save();
    },

    // ── 行事曆固定行程(週/月/年 週期重複，用 anchorDate 當作起算基準) ──
    getRecurring: () => db.recurring,
    addRecurring: (title, anchorDate, interval, unit, category, startTime, endTime, categoryColor, endType, endValue) => {
      const r = {
        id: uid(), title, anchorDate, interval: Number(interval) || 1, unit: unit || 'week',
        category: category || '', categoryColor: categoryColor || '', startTime: startTime || '', endTime: endTime || '',
        endType: endType || 'never', endValue: endValue || '', exceptions: [],
      };
      db.recurring.push(r); save(); return r;
    },
    deleteRecurring: (id) => { db.recurring = db.recurring.filter(r => r.id !== id); save(); },
    updateRecurring: (id, patch) => {
      const r = db.recurring.find(r => r.id === id);
      if (r) { Object.assign(r, patch); save(); }
    },
    // ── 固定行程的「單次取消」：例如出國那幾天，皮膚科/健身教練課這種固定行程要跳過，但後面的重複規則要繼續 ──
    cancelRecurringOccurrence: (id, dateStr) => {
      const r = db.recurring.find(r => r.id === id);
      if (!r) return;
      if (!r.exceptions) r.exceptions = [];
      if (!r.exceptions.includes(dateStr)) r.exceptions.push(dateStr);
      save();
    },
    restoreRecurringOccurrence: (id, dateStr) => {
      const r = db.recurring.find(r => r.id === id);
      if (!r || !r.exceptions) return;
      r.exceptions = r.exceptions.filter(d => d !== dateStr);
      save();
    },
    // ── 批次取消：整段日期範圍內，所有固定行程原本會出現的那幾天都跳過(例如出國那幾天，一次把皮膚科/台中中心/健身教練課都取消掉) ──
    cancelRecurringRange: (startDate, endDate, recurringIds) => {
      let count = 0;
      const targets = recurringIds && recurringIds.length ? db.recurring.filter(r => recurringIds.includes(r.id)) : db.recurring;
      let d = new Date(startDate + 'T00:00:00');
      const end = new Date(endDate + 'T00:00:00');
      const dateList = [];
      while (d <= end) {
        dateList.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`);
        d.setDate(d.getDate() + 1);
      }
      targets.forEach(r => {
        if (!r.exceptions) r.exceptions = [];
        dateList.forEach(dateStr => {
          if (recurringOccursOnRaw(r, dateStr) && !r.exceptions.includes(dateStr)) { r.exceptions.push(dateStr); count++; }
        });
      });
      save();
      return count;
    },
    occursOn: (dateStr) => {
      return db.recurring.filter(r => {
        if (r.exceptions && r.exceptions.includes(dateStr)) return false; // 這天被單獨取消掉了，跳過
        return recurringOccursOnRaw(r, dateStr);
      });
    },

    // ── 習慣追蹤：每天累積量(例如喝水4000cc)、每週次數目標(例如重訓一週3次)、每天打卡(例如聽CD) ──
    getHabits: () => db.habits,
    addHabit: (title, type, target, unit) => {
      const h = { id: uid(), title, type, target: Number(target) || 1, unit: unit || '', createdAt: todayStr() };
      db.habits.push(h); save(); return h;
    },
    updateHabit: (id, patch) => {
      const h = db.habits.find(h => h.id === id);
      if (h) { Object.assign(h, patch); save(); }
    },
    deleteHabit: (id) => {
      db.habits = db.habits.filter(h => h.id !== id);
      db.habitLogs = db.habitLogs.filter(l => l.habitId !== id);
      save();
    },
    getHabitLogs: () => db.habitLogs,
    // 記錄一次(累積型可以打好幾次加總；打卡型/次數型每次記錄算一次)
    logHabit: (habitId, dateStr, value) => {
      const log = { id: uid(), habitId, date: dateStr, value: Number(value) || 1 };
      db.habitLogs.push(log); save(); return log;
    },
    removeLastHabitLog: (habitId, dateStr) => {
      // 復原：刪掉當天最後一筆記錄(用來讓使用者可以「減一次」，不用整天歸零重來)
      const logs = db.habitLogs.filter(l => l.habitId === habitId && l.date === dateStr);
      if (logs.length === 0) return;
      const last = logs[logs.length - 1];
      db.habitLogs = db.habitLogs.filter(l => l.id !== last.id);
      save();
    },
    clearHabitLogsForDate: (habitId, dateStr) => {
      db.habitLogs = db.habitLogs.filter(l => !(l.habitId === habitId && l.date === dateStr));
      save();
    },

    // ── 理財：資產 / 負債(可直接編輯名稱與金額) ──
    getAssets: () => db.assets,
    addAsset: (name, category, amount) => {
      const a = { id: uid(), name, category, amount: Number(amount) || 0 };
      db.assets.push(a); save(); return a;
    },
    updateAsset: (id, name, amount) => {
      const a = db.assets.find(a => a.id === id);
      if (a) { a.name = name; a.amount = Number(amount) || 0; save(); }
    },
    deleteAsset: (id) => { db.assets = db.assets.filter(a => a.id !== id); save(); },

    getLiabilities: () => db.liabilities,
    addLiability: (name, category, amount) => {
      const l = { id: uid(), name, category, amount: Number(amount) || 0 };
      db.liabilities.push(l); save(); return l;
    },
    updateLiability: (id, name, amount) => {
      const l = db.liabilities.find(l => l.id === id);
      if (l) { l.name = name; l.amount = Number(amount) || 0; save(); }
    },
    deleteLiability: (id) => { db.liabilities = db.liabilities.filter(l => l.id !== id); save(); },

    // ── 長期目標 ──
    getGoals: () => db.goals,
    addGoal: (text) => {
      const g = { id: uid(), text, createdAt: new Date().toISOString() };
      db.goals.push(g); save(); return g;
    },
    deleteGoal: (id) => {
      db.goals = db.goals.filter(g => g.id !== id);
      db.subgoals = db.subgoals.filter(s => s.goalId !== id);
      save();
    },

    // ── 長期目標：拆解出的小方向 ──
    getSubgoals: (goalId) => db.subgoals.filter(s => s.goalId === goalId),
    addSubgoal: (goalId, text) => {
      const s = { id: uid(), goalId, text, done: false, createdAt: new Date().toISOString() };
      db.subgoals.push(s); save(); return s;
    },
    toggleSubgoal: (id) => { const s = db.subgoals.find(s => s.id === id); if (s) { s.done = !s.done; save(); } },
    deleteSubgoal: (id) => { db.subgoals = db.subgoals.filter(s => s.id !== id); save(); },

    // ── 側邊欄：照片 ──
    getHomePhoto: () => db.homePhoto,
    setHomePhoto: (dataUrl) => { db.homePhoto = dataUrl || ''; save(); },

    // ── 側邊欄：姓名 ──
    getUserName: () => db.userName,
    setUserName: (name) => { db.userName = (name || '').trim(); save(); },

    // ── 創作靈感：靈感方塊(category 依安麗事業內容分類，detail 依類別而異) ──
    getIdeas: () => db.ideas,
    addIdea: (category, detail, note) => {
      const i = { id: uid(), category, detail: detail || {}, note: note || '', used: false, createdAt: new Date().toISOString() };
      db.ideas.push(i); save(); return i;
    },
    toggleIdeaUsed: (id) => { const i = db.ideas.find(i => i.id === id); if (i) { i.used = !i.used; save(); } },
    deleteIdea: (id) => { db.ideas = db.ideas.filter(i => i.id !== id); save(); },
  };
})();

</script>
<script>
/* 共用小工具，跨模組重複用到的東西放這裡 */
const Util = {
  esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
  // 自製 24 小時制時間選擇器：瀏覽器原生 <input type="time"> 的上午/下午顯示是跟著作業系統的地區設定走，
  // 不是網頁的 lang 屬性能控制的，所以改用兩個下拉選單(HH/MM)自己完全掌控顯示格式，保證不會出現上午/下午
  timeSelectHtml(idPrefix, value, style) {
    const [h, m] = (value || '').split(':');
    const hourOpts = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0'))
      .map(v => `<option value="${v}" ${v === h ? 'selected' : ''}>${v}</option>`).join('');
    const minOpts = Array.from({ length: 12 }, (_, i) => String(i * 5).padStart(2, '0'))
      .map(v => `<option value="${v}" ${v === m ? 'selected' : ''}>${v}</option>`).join('');
    return `<span class="time-select" data-time-select="${idPrefix}" style="${style || ''}">
      <select class="input time-select-h" id="${idPrefix}-h"><option value="">--</option>${hourOpts}</select>
      <span class="time-select-colon">:</span>
      <select class="input time-select-m" id="${idPrefix}-m"><option value="">--</option>${minOpts}</select>
    </span>`;
  },
  timeSelectValue(idPrefix) {
    const h = document.getElementById(`${idPrefix}-h`);
    const m = document.getElementById(`${idPrefix}-m`);
    if (!h || !m || !h.value || !m.value) return '';
    return `${h.value}:${m.value}`;
  },
  timeSelectSet(idPrefix, value) {
    const [h, m] = (value || '').split(':');
    const hEl = document.getElementById(`${idPrefix}-h`);
    const mEl = document.getElementById(`${idPrefix}-m`);
    if (hEl) hEl.value = h || '';
    if (mEl) mEl.value = m || '';
  },
  formatDateZh(dateStr) {
    if (!dateStr) return '';
    const [y, m, d] = dateStr.split('-').map(Number);
    return `${y} 年 ${m} 月 ${d} 日`;
  },
  dueClass(dueDate) {
    if (!dueDate) return 'muted';
    const today = DataStore.todayStr();
    if (dueDate < today) return 'due-overdue';
    if (dueDate === today) return 'due-today';
    return 'muted';
  },
  isUrgent(dueDate) {
    if (!dueDate) return false;
    const diffDays = Math.round((new Date(dueDate) - new Date(DataStore.todayStr())) / 86400000);
    return diffDays <= 3;
  },
  fmtMoney(n) {
    return Math.round(n).toLocaleString('en-US');
  },
  parseMoney(s) {
    const n = Number(String(s).replace(/,/g, '').trim());
    return isNaN(n) ? 0 : n;
  },
  // 把 startTime/endTime("HH:MM")組成顯示用的時間區間文字，兩者都沒填就回傳空字串
  timeRange(startTime, endTime) {
    if (!startTime && !endTime) return '';
    if (startTime && endTime) return `${startTime}–${endTime}`;
    return startTime || endTime;
  },
  // "2026-08-12" → "8/12"
  shortDate(dateStr) {
    if (!dateStr) return '';
    const [, m, d] = dateStr.split('-').map(Number);
    return `${m}/${d}`;
  },
  // 把日期字串往前/往後移動 deltaDays 天，回傳新的 "YYYY-MM-DD"
  shiftDateStr(dateStr, deltaDays) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + deltaDays);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  },
  // 事件的日期/時間顯示文字：同一天只顯示時間區間，跨天則顯示「開始日期 時間→結束日期 時間」
  eventSpanLabel(item) {
    const sameDay = !item.endDate || item.endDate === item.date;
    if (sameDay) return Util.timeRange(item.startTime, item.endTime);
    const startLabel = Util.shortDate(item.date) + (item.startTime ? ` ${item.startTime}` : '');
    const endLabel = Util.shortDate(item.endDate) + (item.endTime ? ` ${item.endTime}` : '');
    return `${startLabel}→${endLabel}`;
  },
  // 簡化版時間文字：用在「日期已經另外顯示」的地方(例如清單旁邊已經有日期欄位)，
  // 跨天行程不重複顯示日期，只講當天實際的狀況：開始那天顯示「幾點出發」、結束那天顯示「幾點結束」、中間的天顯示「全天」；
  // viewDate 沒給的話，預設用行程自己的開始日期(維持原本在「依日期排序的清單」裡的行為，一律顯示出發時間)
  simpleTimeLabel(item, viewDate) {
    if (!item.startTime) return '';
    const isMultiDay = item.endDate && item.endDate > item.date;
    if (!isMultiDay) return Util.timeRange(item.startTime, item.endTime);
    const ds = viewDate || item.date;
    if (ds === item.date) return `${item.startTime} 開始`;
    if (ds === item.endDate) return item.endTime ? `${item.endTime} 結束` : '結束';
    return '全天';
  },
  resizeImage(dataUrl, maxSize, cb) {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.src = dataUrl;
  },
  // 合成小音效，不用外部音檔。特定操作(完成待辦、新增項目)才觸發，避免太吵
  playTone(freq, duration, type) {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = Util._audioCtx || (Util._audioCtx = new Ctx());
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch (e) { /* 瀏覽器不支援就靜默略過 */ }
  },
  playDing() {
    Util.playTone(880, 0.18, 'sine');
    setTimeout(() => Util.playTone(1320, 0.15, 'sine'), 90);
  },
  playPop() {
    Util.playTone(600, 0.08, 'sine');
  },
};

</script>
<script>

   避免像「固定行程只加到一邊」這種兩邊不同步的問題 */
const CalShared = (function () {
  // 顏色調色盤(固定 10 色)，類型名稱由使用者自行輸入，顏色從這裡挑
  const COLOR_PALETTE = [

    { key: 'yellow', label: '黃', bg: '#fef08a', fg: '#1a1a1a' },

    { key: 'gray', label: '灰', bg: '#e2e8f0', fg: '#1a1a1a' },
    { key: 'lime', label: '萊姆', bg: '#b1de7c', fg: '#1a1a1a' },
    { key: 'emerald', label: '翠綠', bg: '#9de7c8', fg: '#1a1a1a' },
    { key: 'cyan', label: '青藍', bg: '#7ccbde', fg: '#1a1a1a' },
    { key: 'violet', label: '紫羅蘭', bg: '#b3a5e9', fg: '#1a1a1a' },
    { key: 'fuchsia', label: '洋紅', bg: '#e79de4', fg: '#1a1a1a' },
    { key: 'rose', label: '玫瑰', bg: '#e9a5b6', fg: '#1a1a1a' },
    { key: 'amber', label: '琥珀', bg: '#dec17c', fg: '#1a1a1a' },
    { key: 'brown', label: '棕', bg: '#d89464', fg: '#1a1a1a' },
    { key: 'sky', label: '天空藍', bg: '#a5cde9', fg: '#1a1a1a' },
    { key: 'slate', label: '石板灰', bg: '#7c9ade', fg: '#1a1a1a' },
    { key: 'olive', label: '橄欖', bg: '#cbdc74', fg: '#1a1a1a' },
    { key: 'chartreuse', label: '黃綠', bg: '#a3e79d', fg: '#1a1a1a' },
    { key: 'orchid', label: '蘭紫', bg: '#d59de7', fg: '#1a1a1a' },
    { key: 'magenta', label: '洋紅', bg: '#e9a5d7', fg: '#1a1a1a' },
  ];
  // 固定行程(🔁)不管選的顏色是什麼，都用 🔁 圖示跟一般事件區分，不再額外固定紫色
  const RECURRING_COLOR = { bg: '#e9d5ff', fg: '#1a1a1a' };
  // 每天最多同時顯示幾個行程小方塊，行事曆頁跟首頁小月曆都吃這個常數，避免兩邊上限不一致
  const MAX_DOTS = 3;

  function colorOf(key) {
    return COLOR_PALETTE.find(c => c.key === key) || COLOR_PALETTE[0];
  }

  // item 需要有 category(自行輸入的類型文字，可能是空字串) 跟 categoryColor(調色盤 key)
  function categoryOf(item) {
    const c = colorOf(item.categoryColor);
    return { label: (item.category || '').trim() || '一般', bg: c.bg, fg: c.fg };
  }

  // 固定行程的重複規則文字，例如「每週三」「每月15號」
  function recurrenceLabel(r) {
    const unit = r.unit || 'week';
    const interval = r.interval || r.intervalWeeks || 1;
    const anchor = new Date(r.anchorDate + 'T00:00:00');
    let base;
    if (unit === 'month') base = (interval === 1 ? '每月' : `每${interval}個月`) + `${anchor.getDate()}號`;
    else if (unit === 'year') base = (interval === 1 ? '每年' : `每${interval}年`) + `${anchor.getMonth() + 1}/${anchor.getDate()}`;
    else {
      const weekday = ['日', '一', '二', '三', '四', '五', '六'][anchor.getDay()];
      base = (interval === 1 ? '每週' : '每雙週') + weekday;
    }
    if (r.endType === 'date' && r.endValue) return `${base}・至${r.endValue}`;
    if (r.endType === 'count' && r.endValue) return `${base}・共${r.endValue}次`;
    return base;
  }

  function itemsForDate(dateStr) {
    const dow = new Date(dateStr + 'T00:00:00').getDay();
    const events = DataStore.getEvents()
      .filter(e => e.date <= dateStr && dateStr <= (e.endDate || e.date))
      .map(e => ({ ...e, kind: 'event', _isStartDay: dateStr === e.date, _isEndDay: dateStr === (e.endDate || e.date), _cellDow: dow }));
    const tasks = DataStore.getAllTasks().filter(t => t.dueDate === dateStr).map(t => ({ ...t, kind: 'task' }));
    const recurring = DataStore.occursOn(dateStr).map(r => ({ ...r, kind: 'recurring' }));
    // 依「這一天實際生效的時間」由早到晚排序：跨天行程在結束那天(或中間的天)算從 00:00 就算數，
    // 開始時間一樣的話用結束時間當第二排序依據(早結束的排前面)；完全沒填時間的排最前面
    function effectiveRange(it) {
      if (!it.startTime) return [-1, -1];
      const [h, m] = it.startTime.split(':').map(Number);
      let startMin = h * 60 + (m || 0);
      let endMin = it.endTime ? (() => { const [eh, em] = it.endTime.split(':').map(Number); return eh * 60 + (em || 0); })() : startMin + 60;
      const isMultiDay = it.kind === 'event' && it.endDate && it.endDate > it.date;
      if (isMultiDay && dateStr !== it.date) {
        startMin = 0;
        if (dateStr !== it.endDate) endMin = 24 * 60;
      } else if (endMin <= startMin) {
        endMin = startMin + 30;
      }
      return [startMin, endMin];
    }
    return [...events, ...recurring, ...tasks].sort((a, b) => {
      const [as, ae] = effectiveRange(a);
      const [bs, be] = effectiveRange(b);
      if (as !== bs) return as - bs;
      return ae - be;
    });
  }

  function daysBetween(d1, d2) {
    return Math.round((new Date(d2 + 'T00:00:00') - new Date(d1 + 'T00:00:00')) / 86400000);
  }
  function minutesOfTime(t) {
    const [h, m] = t.split(':').map(Number);
    return h * 60 + (m || 0);
  }

  // 跨天但不是「長時間」的行程(例如晚上10點半到隔天凌晨12點半，總共才2小時)，不需要用橫條橫跨兩格月曆，
  // 改成當一般行程處理，在開始跟結束那兩天各自顯示一個小方塊就好，比較不會誤導成「這是連續好幾天的長行程」
  function isSpanningEvent(it) {
    if (it.kind !== 'event' || !it.endDate || it.endDate <= it.date) return false;
    const gap = daysBetween(it.date, it.endDate);
    if (gap >= 2) return true; // 中間隔了至少一個完整的天，一定要用橫條才看得出來是連續好幾天
    if (!it.startTime) return true; // 沒填時間的純全天事件，維持用橫條
    const startMin = minutesOfTime(it.startTime);
    const endMin = it.endTime ? minutesOfTime(it.endTime) : startMin;
    const totalMin = (24 * 60 - startMin) + endMin; // 從開始時間到隔天結束時間，經過的總分鐘數
    return totalMin >= 240; // 4 小時以上才算長，用橫條；不然當一般行程處理
  }

  const BAR_H = 16; // px，跨天橫條的高度
  const BAR_GAP = 3; // px，橫條之間的間距
  const MAX_LANES = 2; // 同一週最多同時顯示幾條疊起來的橫條
  const BARS_AREA_H = MAX_LANES * (BAR_H + BAR_GAP);

  // 算出這一週(7 個日期字串，空白天用 null)裡，有哪些跨天行程橫條要畫、畫在哪一欄到哪一欄、疊在第幾層(lane)
  function weekBars(weekDates) {
    const bars = [];
    DataStore.getEvents().filter(e => isSpanningEvent({ ...e, kind: 'event' })).forEach(e => {
      let colStart = -1, colEnd = -1;
      weekDates.forEach((ds, idx) => {
        if (!ds) return;
        if (ds >= e.date && ds <= e.endDate) {
          if (colStart === -1) colStart = idx;
          colEnd = idx;
        }
      });
      if (colStart === -1) return;
      bars.push({ event: e, colStart, colEnd, isStart: weekDates[colStart] === e.date, isEnd: weekDates[colEnd] === e.endDate });
    });
    // lane 分配：貪婪演算法，欄位範圍重疊的橫條要分配到不同 lane，才不會疊在一起看不清楚；
    // 但如果只是「前一個行程結束那天 = 下一個行程開始那天」這種首尾相接，允許共用同一個 lane，看起來像接續的行程
    bars.sort((a, b) => a.colStart - b.colStart);
    const laneEnds = [];
    bars.forEach(bar => {
      let lane = laneEnds.findIndex(endCol => endCol <= bar.colStart);
      if (lane === -1) { lane = laneEnds.length; laneEnds.push(bar.colEnd); }
      else laneEnds[lane] = bar.colEnd;
      bar.lane = lane;
    });
    return bars.filter(b => b.lane < MAX_LANES);
  }

  // 跨天橫條：用「這一週佔的欄位比例(百分比)」定位，天生就會跨過格子之間的間距，畫成一條連續色塊，不會被格線切斷
  function barSegmentHtml(bar) {
    const cat = categoryOf(bar.event);
    const leftPct = (bar.colStart / 7) * 100;
    const widthPct = ((bar.colEnd - bar.colStart + 1) / 7) * 100;
    const top = bar.lane * (BAR_H + BAR_GAP);
    const radius = `${bar.isStart ? '6px' : '0'} ${bar.isEnd ? '6px' : '0'} ${bar.isEnd ? '6px' : '0'} ${bar.isStart ? '6px' : '0'}`;
    const timeStr = bar.isStart ? Util.eventSpanLabel(bar.event) : '';
    return `<div class="cal-week-bar" data-dblclick-bar="${bar.event.date}" style="left:calc(${leftPct}% + 2px);width:calc(${widthPct}% - 4px);top:${top}px;height:${BAR_H}px;background:${cat.bg};color:${cat.fg};border-radius:${radius}">
      <span class="cal-week-bar-title">${bar.isStart ? '' : '↳ '}${Util.esc(bar.event.title)}${timeStr ? ` <span class="cal-week-bar-time">${Util.esc(timeStr)}</span>` : ''}</span>
    </div>`;
  }

  // 月曆格子專用：跨天橫條改成「畫在每一格自己裡面、貼在格子底部」，而不是獨立浮在格子外面一整條。
  // 靠 CSS Grid 同一列格子會自動等高的特性，讓每一天各自的底部色塊自然對齊成一條連續的線，不用算絕對定位橫跨整列。
  // half: null(整格寬) / 'left'(前一筆結束，佔左半) / 'right'(下一筆開始，佔右半) —— 用在「前一個行程結束當天=下一個行程開始當天」時，同一格要左右對半分
  function cellBarStripHtml(bar, dayIdx, half, barH) {
    const h = barH || BAR_H;
    const cat = categoryOf(bar.event);
    const isLeftEdge = dayIdx === bar.colStart;
    const isRightEdge = dayIdx === bar.colEnd;
    let leftRight, radius;
    if (half === 'left') {
      leftRight = `left:${isLeftEdge ? 2 : 0}px;right:calc(50% + 1px);`;
      radius = `${isLeftEdge ? '6px' : '0'} 0 0 ${isLeftEdge ? '6px' : '0'}`;
    } else if (half === 'right') {
      leftRight = `left:calc(50% + 1px);right:${isRightEdge ? 2 : 0}px;`;
      radius = `0 ${isRightEdge ? '6px' : '0'} ${isRightEdge ? '6px' : '0'} 0`;
    } else {
      leftRight = `left:${isLeftEdge ? 2 : 0}px;right:${isRightEdge ? 2 : 0}px;`;
      radius = `${isLeftEdge ? '6px' : '0'} ${isRightEdge ? '6px' : '0'} ${isRightEdge ? '6px' : '0'} ${isLeftEdge ? '6px' : '0'}`;
    }
    const bottomOffset = bar.lane * (h + BAR_GAP) + 2;
    const showTitle = half === 'right' ? true : isLeftEdge;
    return `<div class="cal-cell-bar" data-dblclick-bar="${bar.event.date}" style="bottom:${bottomOffset}px;${leftRight}height:${h}px;background:${cat.bg};color:${cat.fg};border-radius:${radius}">
      ${showTitle ? `<span class="cal-cell-bar-title">${Util.esc(bar.event.title)}</span>` : ''}
    </div>`;
  }

  // 算出某一格(dayIdx)裡所有跨天橫條片段的 HTML，自動處理「同一天、同一 lane 出現兩筆(一個結束、一個開始)」的情況，改成左右對半分而不是疊在一起
  function cellBarsHtml(bars, dayIdx, barH) {
    const cellBars = bars.filter(b => dayIdx >= b.colStart && dayIdx <= b.colEnd);
    const byLane = {};
    cellBars.forEach(b => { (byLane[b.lane] = byLane[b.lane] || []).push(b); });
    const parts = [];
    Object.values(byLane).forEach(group => {
      if (group.length >= 2) {
        const ending = group.find(b => b.colEnd === dayIdx);
        const starting = group.find(b => b.colStart === dayIdx && b !== ending);
        if (ending) parts.push(cellBarStripHtml(ending, dayIdx, 'left', barH));
        if (starting) parts.push(cellBarStripHtml(starting, dayIdx, 'right', barH));
      } else {
        group.forEach(b => parts.push(cellBarStripHtml(b, dayIdx, null, barH)));
      }
    });
    return parts.join('');
  }

  // 月曆格子裡怎麼分配顯示名額(只算單日行程/固定行程/待辦，跨天行程已經改用週橫條呈現，不算在這裡)：
  // 依剩餘名額顯示，擠不下的用「+N 更多」代替
  function splitCellItems(items, maxDots) {
    const regular = items.filter(it => !isSpanningEvent(it));
    const visibleRegular = regular.slice(0, maxDots);
    const hiddenCount = regular.length - visibleRegular.length;
    return { visible: visibleRegular, hiddenCount };
  }

  // 行程方塊：標題永遠在第一行(資訊多時優先顯示標題)，時間在第二行(小字、可被裁切)，
  // 高度固定，不會因為文字太長把格子撐高／變形。(跨天事件不會走到這裡，改由 weekBars/barSegmentHtml 處理)
  function dotHtml(it, opts) {
    const hideTime = opts && opts.hideTime;
    const viewDate = opts && opts.viewDate;
    if (it.kind === 'task') {
      return `<div class="cal-dot task" data-drag-kind="task" data-drag-id="${it.id}"><div class="cal-dot-title">☐ ${Util.esc(it.title)}</div></div>`;
    }
    const cat = categoryOf(it);
    if (it.kind === 'recurring') {
      const timeStr = hideTime ? '' : Util.timeRange(it.startTime, it.endTime);
      return `<div class="cal-dot recurring" style="--cal-dot-accent:${cat.bg}">
        <div class="cal-dot-title">${Util.esc(it.title)}</div>
        ${timeStr ? `<div class="cal-dot-time">${timeStr}</div>` : ''}
      </div>`;
    }
    const isShortMultiDay = it.endDate && it.endDate > it.date; // 已經不會是長時間橫條那種了(那種被 isSpanningEvent 濾掉)，這裡只會是短暫跨午夜的
    const timeStr = hideTime ? '' : (isShortMultiDay ? Util.simpleTimeLabel(it, viewDate) : Util.eventSpanLabel(it));
    return `<div class="cal-dot" data-drag-kind="event" data-drag-id="${it.id}" style="--cal-dot-accent:${cat.bg}">
      <div class="cal-dot-title">${Util.esc(it.title)}</div>
      ${timeStr ? `<div class="cal-dot-time">${timeStr}</div>` : ''}
    </div>`;
  }

  // 拖曳行程到別的日期改期：event 改 date、task 改 dueDate；固定行程不給拖(拖了會影響整個週期規則，容易誤觸)
  // 改用 Pointer Events 自己做拖曳(不用瀏覽器原生 HTML5 drag-and-drop)，因為原生 DnD 在觸控螢幕/觸控板上常常完全沒反應，
  // Pointer Events 滑鼠、觸控、觸控筆都吃得到，比較不會有人「怎麼拖都拖不動」的問題
  function wireDragDrop(gridEl, onRerender) {
    const cells = gridEl.querySelectorAll('[data-date]');
    gridEl.querySelectorAll('[data-drag-id]').forEach(dot => {
      dot.onpointerdown = (downEv) => {
        if (downEv.button !== 0 && downEv.pointerType === 'mouse') return; // 滑鼠只認左鍵，觸控/筆沒有 button 概念
        const startX = downEv.clientX, startY = downEv.clientY;
        const kind = dot.dataset.dragKind;
        const id = dot.dataset.dragId;
        let dragging = false;
        let ghost = null;
        let currentCell = null;

        const cleanup = () => {
          if (ghost) { ghost.remove(); ghost = null; }
          cells.forEach(c => c.classList.remove('drag-over'));
          dot.classList.remove('cal-dot-dragging');
        };

        const onMove = (moveEv) => {
          const dx = moveEv.clientX - startX, dy = moveEv.clientY - startY;
          if (!dragging) {
            if (Math.hypot(dx, dy) < 5) return;
            dragging = true;
            ghost = dot.cloneNode(true);
            ghost.classList.add('cal-dot-ghost');
            document.body.appendChild(ghost);
            dot.classList.add('cal-dot-dragging');
          }
          moveEv.preventDefault();
          ghost.style.left = (moveEv.clientX + 12) + 'px';
          ghost.style.top = (moveEv.clientY + 12) + 'px';
          cells.forEach(c => c.classList.remove('drag-over'));
          const under = document.elementFromPoint(moveEv.clientX, moveEv.clientY);
          currentCell = under ? under.closest('[data-date]') : null;
          if (currentCell) currentCell.classList.add('drag-over');
        };

        const onUp = (upEv) => {
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          document.removeEventListener('pointercancel', onUp);
          if (dragging) {
            upEv.preventDefault();
            if (currentCell) {
              const newDate = currentCell.dataset.date;
              if (kind === 'event') {
                const ev = DataStore.getEvents().find(e => e.id === id);
                if (ev && ev.endDate && ev.endDate > ev.date) {
                  const deltaDays = Math.round((new Date(newDate + 'T00:00:00') - new Date(ev.date + 'T00:00:00')) / 86400000);
                  DataStore.updateEvent(id, { date: newDate, endDate: Util.shiftDateStr(ev.endDate, deltaDays) });
                } else {
                  DataStore.updateEvent(id, { date: newDate });
                }
              } else if (kind === 'task') DataStore.updateTask(id, { dueDate: newDate });
            }
          }
          cleanup();
          if (dragging && currentCell) onRerender();
        };

        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
        document.addEventListener('pointercancel', onUp);
      };
    });
  }

  function noteHtml(dateStr) {
    const note = DataStore.getDateNote(dateStr);
    return note ? `<div class="cal-note">${Util.esc(note)}</div>` : '';
  }

  // 日期格子最上面那一列：左邊日期數字(週末深紅)、右邊節日備註(平行排列，不是疊在下面)
  // 台灣 2026 年（民國115年）國定假日，依行政院人事行政總處公告的辦公日曆表整理；
  // 只用來在日期數字旁邊加一個小標籤，完全不會用到跟行程共用的 dot/bar 系統，不會影響安排的事項或跨天旅遊的呈現
  const TW_HOLIDAYS_2026 = {
    '2026-01-01': '元旦',
    '2026-02-15': '小年夜',
    '2026-02-16': '除夕',
    '2026-02-17': '春節',
    '2026-02-18': '春節',
    '2026-02-19': '春節',
    '2026-02-20': '小年夜補假',
    '2026-02-27': '和平紀念日補假',
    '2026-02-28': '和平紀念日',
    '2026-04-03': '兒童節補假',
    '2026-04-04': '兒童節',
    '2026-04-05': '清明節',
    '2026-04-06': '清明節補假',
    '2026-05-01': '勞動節',
    '2026-06-19': '端午節',
    '2026-09-25': '中秋節',
    '2026-09-28': '教師節',
    '2026-10-09': '國慶日補假',
    '2026-10-10': '國慶日',
    '2026-10-25': '光復節',
    '2026-10-26': '光復節補假',
    '2026-12-25': '行憲紀念日',
  };

  function cellHeaderHtml(dateStr, dayNum) {
    const dow = new Date(dateStr + 'T00:00:00').getDay();
    const weekendCls = (dow === 0 || dow === 6) ? ' weekend' : '';
    const holiday = TW_HOLIDAYS_2026[dateStr];
    return `<div class="cal-daynum-row">
      <span class="cal-daynum${weekendCls}">${dayNum}</span>
      ${noteHtml(dateStr)}
    </div>
    ${holiday ? `<div class="cal-holiday-label">${Util.esc(holiday)}</div>` : ''}`;
  }

  // 類型輸入框(自行輸入文字) + 顏色圓點選擇器；idPrefix 底下會產生 -text / -color(hidden) / -swatches 三個元素
  function categoryFieldHtml(idPrefix, selectedText, selectedColorKey) {
    const colorKey = selectedColorKey || COLOR_PALETTE[0].key;
    return `
      <input class="input" id="${idPrefix}-text" placeholder="類型（自行輸入，例如：安麗事業）" value="${Util.esc(selectedText || '')}" style="margin-bottom:8px">
      <input type="hidden" id="${idPrefix}-color" value="${colorKey}">
      <div class="color-swatch-row" id="${idPrefix}-swatches">
        ${COLOR_PALETTE.map(c => `<button type="button" class="color-swatch${c.key === colorKey ? ' selected' : ''}" data-color-key="${c.key}" style="background:${c.bg}" title="${c.label}"></button>`).join('')}
      </div>
    `;
  }

  // categoryFieldHtml 插入 DOM 後要呼叫這個，讓顏色圓點可以點選
  function wireCategoryField(idPrefix) {
    const row = document.getElementById(`${idPrefix}-swatches`);
    const hidden = document.getElementById(`${idPrefix}-color`);
    if (!row || !hidden) return;
    row.querySelectorAll('.color-swatch').forEach(btn => {
      btn.onclick = () => {
        hidden.value = btn.dataset.colorKey;
        row.querySelectorAll('.color-swatch').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      };
    });
  }

  // 讀出 categoryFieldHtml 目前的值：{ text, color }
  function getCategoryFieldValue(idPrefix) {
    const textEl = document.getElementById(`${idPrefix}-text`);
    const colorEl = document.getElementById(`${idPrefix}-color`);
    return { text: textEl ? textEl.value.trim() : '', color: colorEl ? colorEl.value : COLOR_PALETTE[0].key };
  }

  // 建立一個獨立的「日期細節面板」渲染器：清單(雙擊編輯事件、刪除)＋新增行程＋日期備註
  // opts: { getSelected(), setSelected(date), onRerender() }
  function createDayPanel(opts) {
    let editingId = null;
    let editingRecurringId = null;
    // 日期挑選模式：點開始日期欄位後變成 'start'，點結束日期欄位後變成 'end'；
    // 點月曆格子時若正在挑選中，就把日期填進表單，不觸發整個面板重繪(避免把剛填的值洗掉)
    let pickMode = null;
    let startInputEl = null;
    let endInputEl = null;

    function render(panelEl, todoEl) {
      const selectedDate = opts.getSelected();
      const readOnly = !!opts.readOnly;
      pickMode = null;
      startInputEl = null;
      endInputEl = null;
      // 依照「這一天實際生效的時間」由早到晚排序：跨天行程在結束那天(或中間的天)算從 00:00 就算數；
      // 完全沒填時間的(純全天)排最前面；如果開始時間一樣(例如都是從 00:00 開始生效)，用結束時間當第二排序依據，早結束的排前面
      function effectiveRange(it) {
        if (!it.startTime) return [-1, -1];
        const [h, m] = it.startTime.split(':').map(Number);
        let startMin = h * 60 + (m || 0);
        let endMin = it.endTime ? (() => { const [eh, em] = it.endTime.split(':').map(Number); return eh * 60 + (em || 0); })() : startMin + 60;
        const isMultiDay = it.kind === 'event' && it.endDate && it.endDate > it.date;
        if (isMultiDay && selectedDate !== it.date) {
          startMin = 0; // 跨天行程：不是開始那天(是結束那天或中間的天)，當天從 00:00 就算生效中
          if (selectedDate !== it.endDate) endMin = 24 * 60; // 中間的天：整天都算
          // 結束那天：endMin 維持原本算出來的 it.endTime 分鐘數即可
        } else if (endMin <= startMin) {
          endMin = startMin + 30;
        }
        return [startMin, endMin];
      }
      const items = itemsForDate(selectedDate).sort((a, b) => {
        // 跨天長行程(例如「台南旅遊」這種)排在最前面，當成當天的「背景資訊」先看到，再看幾點有什麼確切行程，兩者不會混在一起搶著比先後
        const aSpan = a.kind === 'event' && isSpanningEvent(a) ? 0 : 1;
        const bSpan = b.kind === 'event' && isSpanningEvent(b) ? 0 : 1;
        if (aSpan !== bSpan) return aSpan - bSpan;
        const [as, ae] = effectiveRange(a);
        const [bs, be] = effectiveRange(b);
        if (as !== bs) return as - bs;
        return ae - be;
      });
      const projects = DataStore.getProjects();
      const projMap = {};
      projects.forEach(p => projMap[p.id] = p.name);
      const uid = 'dp' + Math.random().toString(36).slice(2, 7);

      const scheduleItems = items.filter(it => it.kind !== 'task');
      const taskItems = items.filter(it => it.kind === 'task');

      function renderItemRow(it) {
        const timeStr = it.kind === 'event' ? Util.simpleTimeLabel(it, selectedDate) : Util.timeRange(it.startTime, it.endTime);
        if (it.kind === 'task') {
          return `<div class="list-item">
            <input type="checkbox" ${it.done ? 'checked' : ''} data-toggle-task="${it.id}">
            <span class="grow${it.done ? ' strike' : ''}" style="${it.done ? '' : 'color:#1a1a1a'}">${Util.esc(it.title)}</span>
            <span class="tag">${Util.esc(projMap[it.projectId] || '待辦')}</span>
            ${readOnly ? '' : `<button class="link-btn" style="color:var(--danger)" data-del-task="${it.id}">刪除</button>`}
          </div>`;
        }
        if (it.kind === 'recurring') {
          if (!readOnly && it.id === editingRecurringId) {
            const [unitVal, intervalVal] = [it.unit || 'week', it.interval || 1];
            return `
              <div class="card" style="margin-bottom:12px;padding:0;border:none;box-shadow:none;background:transparent;margin-top:14px" data-editing-recurring="${it.id}">
                <div class="card-title">編輯固定行程</div>
                <input class="input" data-f="title" value="${Util.esc(it.title)}" placeholder="行程內容" style="margin-bottom:8px">

                <input class="input jump-date-input" id="editev-${it.id}-jump-date" data-f="date" type="date" value="${it.date}" style="flex:1 1 120px;min-width:100px">
                <span id="editev-${it.id}-start-wrap" style="${!it.startTime ? 'display:none' : ''}">${Util.timeSelectHtml(`editev-${it.id}-start`, it.startTime)}</span>

              <div class="muted" id="editev-${it.id}-pickhint" style="font-size:11px;margin-top:-4px;margin-bottom:8px">點一下開始或結束日期欄位，再點月曆上的日期即可快速帶入</div>
              <textarea class="input" data-f="note" placeholder="備註（選填）" style="margin-bottom:8px;min-height:44px;resize:vertical">${Util.esc(it.note || '')}</textarea>
              <label style="display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:8px;cursor:pointer">

              </label>
              <select class="input" id="editev-${it.id}-interval" style="margin-bottom:8px;display:none">
                <option value="week:1">每週</option>
                <option value="week:2">每雙週</option>
                <option value="month:1">每個月</option>
                <option value="year:1">每年</option>

              <div id="editev-${it.id}-endtype-wrap" style="display:none;margin-bottom:8px">

                  <option value="date">於某天結束</option>

              <div style="text-align:center"><button class="link-btn" data-cancel-event="${it.id}">取消</button></div>
            </div>
          `;
        }
        const cat = categoryOf(it);
        // 跨天長行程(例如出遊好幾天)改成一條精簡的橫幅樣式：色塊背景、只有標題+日期範圍，不會跟下面時間軸行程的排版混在一起顯得雜亂
        if (isSpanningEvent(it)) {
          const rangeLabel = `${it.date.slice(5)} ～ ${it.endDate.slice(5)}`;
          return `<div class="list-item banner-item"${readOnly ? '' : ` data-dblclick-event="${it.id}"`} style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:${cat.bg};color:${cat.fg};margin-bottom:6px">

        return `<div class="list-item"${readOnly ? '' : ` data-dblclick-event="${it.id}"`} style="display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start">

      const todoCardHtml = readOnly ? '' : `
        <div class="card" id="${uid}-todo-card" data-daypanel-part="todo" style="display:flex;flex-direction:column;flex:1">
