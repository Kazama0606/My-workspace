      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-title">淨資產</div>
        <div class="fin-total">NT$ ${Util.fmtMoney(net)}</div>
        <div class="fin-sub">
          <div class="fin-stat"><b>NT$ ${Util.fmtMoney(assetTotal)}</b><span>總資產</span></div>
          <div class="fin-stat"><b>NT$ ${Util.fmtMoney(liabTotal)}</b><span>總負債</span></div>
        </div>
      </div>
      <div class="grid grid-2">
        <div class="card">
          <div class="card-title">資產</div>
          <div id="asset-rows"></div>
        </div>
        <div class="card">
          <div class="card-title">負債</div>
          <div id="liab-rows"></div>
        </div>
      </div>
    `;

    renderEditableRows('asset-rows', assets, {
      update: (id, name, amount) => DataStore.updateAsset(id, name, amount),
      add: (name, amount) => DataStore.addAsset(name, '', amount),
      remove: (id) => DataStore.deleteAsset(id),
    });
    renderEditableRows('liab-rows', liabilities, {
      update: (id, name, amount) => DataStore.updateLiability(id, name, amount),
      add: (name, amount) => DataStore.addLiability(name, '', amount),
      remove: (id) => DataStore.deleteLiability(id),
    });
  }

  function renderEditableRows(containerId, items, { update, add, remove }) {
    const wrap = document.getElementById(containerId);
    wrap.innerHTML = `
      <div class="edit-rows">
        ${items.map(it => `
          <div class="edit-row" data-id="${it.id}">
            <input class="cell-input" data-field="name" value="${Util.esc(it.name)}">
            <span class="amt-wrap">NT$ <input class="cell-input amt" data-field="amount" type="text" inputmode="decimal" value="${Util.fmtMoney(it.amount)}"></span>
            <button class="link-btn" style="color:var(--danger)" data-del>刪除</button>
          </div>
        `).join('')}
        <div class="edit-row edit-row-new">
          <input class="cell-input" data-new-name placeholder="新增項目名稱">
          <span class="amt-wrap">NT$ <input class="cell-input amt" data-new-amount type="text" inputmode="decimal" placeholder="0"></span>
          <span></span>
        </div>
      </div>
    `;

    wrap.querySelectorAll('.edit-row[data-id]').forEach(row => {
      const id = row.dataset.id;
      const nameInput = row.querySelector('[data-field="name"]');
      const amtInput = row.querySelector('[data-field="amount"]');
      const commit = () => {
        const name = nameInput.value.trim();
        if (!name) { render(); return; }
        update(id, name, Util.parseMoney(amtInput.value));
        render();
      };
      nameInput.onblur = commit;
      amtInput.onblur = commit;
      amtInput.onfocus = () => { amtInput.value = String(Util.parseMoney(amtInput.value)); };
      nameInput.onkeydown = (e) => { if (e.key === 'Enter') nameInput.blur(); };
      amtInput.onkeydown = (e) => { if (e.key === 'Enter') amtInput.blur(); };
      row.querySelector('[data-del]').onclick = () => { remove(id); render(); };
    });

    const newRow = wrap.querySelector('.edit-row-new');
    const newName = newRow.querySelector('[data-new-name]');
    const newAmt = newRow.querySelector('[data-new-amount]');
    const commitNew = () => {
      const name = newName.value.trim();
      if (!name) return;
      add(name, Util.parseMoney(newAmt.value));
      render();
    };
    newName.onblur = commitNew;
    newAmt.onblur = commitNew;
    newName.onkeydown = (e) => { if (e.key === 'Enter') newName.blur(); };
    newAmt.onkeydown = (e) => { if (e.key === 'Enter') newAmt.blur(); };
  }

  return { render };
})();

</script>
<script>
/* 創作靈感頁 — 靈感方塊(安麗事業內容經營)，點「+」直接新增一個方塊 */
window.Pages = window.Pages || {};
Pages.creation = (function () {
  const CLIENT_TYPES = ['潛在客戶', '現有客戶', '下線夥伴', '其他'];
  const CATEGORIES = [
    { key: 'video', label: '🎬 短影音/語音', cls: 'idea-tile-video' },
    { key: 'shoot', label: '📷 客戶內容', cls: 'idea-tile-shoot' },
    { key: 'course', label: '📚 培訓靈感', cls: 'idea-tile-course' },
    { key: 'marketing', label: '📢 社群/行銷', cls: 'idea-tile-marketing' },
    { key: 'branding', label: '🎨 個人品牌', cls: 'idea-tile-branding' },
  ];

  let composing = false;
  let composeCategory = 'video';

  function render() {
    const root = document.getElementById('page-creation');
    const ideas = [...DataStore.getIdeas()].sort((a, b) => {
      if (a.used !== b.used) return a.used ? 1 : -1;
      return b.createdAt < a.createdAt ? -1 : 1;
    });

    root.innerHTML = `
      <div class="page-hd">
        <div class="page-title">🎨 創作靈感</div>
        <div class="page-sub">記錄短影音/語音腳本、客戶案例分享、下線培訓內容、社群貼文靈感。點「＋ 新增靈感」直接建立一個靈感方塊</div>
      </div>
      <div class="idea-grid" id="idea-grid"></div>
    `;

    renderGrid(ideas);
  }

  function renderGrid(ideas) {
    const grid = document.getElementById('idea-grid');
    grid.innerHTML = `
      ${composing ? composerHtml() : `<div class="idea-tile idea-tile-add" id="idea-add-tile">＋ 新增靈感</div>`}
      ${ideas.map(i => tileHtml(i)).join('')}
    `;

    if (composing) {
      wireComposer();
    } else {
      document.getElementById('idea-add-tile').onclick = () => { composing = true; composeCategory = 'video'; render(); };
    }

    grid.querySelectorAll('[data-toggle-used]').forEach(el => {
      el.onchange = () => { DataStore.toggleIdeaUsed(el.dataset.toggleUsed); render(); };
    });
    grid.querySelectorAll('[data-del-idea]').forEach(el => {
      el.onclick = () => { DataStore.deleteIdea(el.dataset.delIdea); render(); };
    });
  }

  function composerHtml() {
    return `
      <div class="idea-tile idea-tile-composer">
        <select class="input" id="compose-category" style="margin-bottom:8px">
          ${CATEGORIES.map(c => `<option value="${c.key}" ${composeCategory === c.key ? 'selected' : ''}>${c.label}</option>`).join('')}
        </select>
        ${composeCategory === 'shoot' ? `
          <select class="input" id="compose-client" style="margin-bottom:8px">
            ${CLIENT_TYPES.map(c => `<option value="${c}">${c}</option>`).join('')}
          </select>
        ` : ''}
        <textarea class="input" id="compose-text" placeholder="輸入內容…" style="margin-bottom:8px;min-height:64px;resize:vertical"></textarea>
        <div style="display:flex;gap:8px">
          <button class="btn btn-sm" style="background:var(--blue-accent);color:#fff;flex:1" id="compose-confirm">新增</button>
          <button class="btn btn-sm btn-ghost" id="compose-cancel">取消</button>
        </div>
      </div>
    `;
  }

  function wireComposer() {
    document.getElementById('compose-category').onchange = (e) => { composeCategory = e.target.value; render(); };
    document.getElementById('compose-cancel').onclick = () => { composing = false; render(); };
    document.getElementById('compose-confirm').onclick = () => {
      const text = document.getElementById('compose-text').value.trim();
      if (!text) return;
      const detail = { text };
      if (composeCategory === 'shoot') {
        detail.client = document.getElementById('compose-client').value;
      }
      DataStore.addIdea(composeCategory, detail, '');
      composing = false;
      render();
    };
  }

  function tileHtml(idea) {
    const cat = CATEGORIES.find(c => c.key === idea.category) || CATEGORIES[0];
    const isShoot = idea.category === 'shoot';
    const sub = isShoot && idea.detail.client ? `<div class="idea-tile-sub">${Util.esc(idea.detail.client)}</div>` : '';
    return `
      <div class="idea-tile ${cat.cls} ${idea.used ? 'idea-tile-used' : ''}">
        <div class="idea-tile-top">
          <span class="idea-tile-label">${cat.label}</span>
          <button class="idea-tile-del" data-del-idea="${idea.id}">✕</button>
        </div>
        ${sub}
        <div class="idea-tile-text">${Util.esc(idea.detail.text || '')}</div>
        <label class="idea-tile-used-toggle">
          <input type="checkbox" ${idea.used ? 'checked' : ''} data-toggle-used="${idea.id}"> 已使用
        </label>
      </div>
    `;
  }

  return { render };
})();

</script>
<script>
/* 客戶紀錄頁 — 記錄跟客戶的對話過程，另外留一欄手動貼上 Claude AI 給的下一步建議(純前端網站沒有後端，
   沒辦法安全地把 API 金鑰放進網頁直接呼叫，所以「AI 建議」是使用者自己去問 Claude 後貼過來，不是網頁自動生成) */
window.Pages = window.Pages || {};
Pages.clients = (function () {
  let selectedId = null;
  const MAX_IMG_DIM = 1000; // 圖片壓縮後最長邊(px)，避免手機截圖太大塞爆 localStorage
  const STAGES = [
    { key: '潛在客戶', bg: '#e5e7eb', fg: '#374151' },
    { key: '邀約OPP', bg: '#fef3c7', fg: '#92400e' },
    { key: '邀約LRC', bg: '#fde68a', fg: '#92400e' },
    { key: '邀約BTC', bg: '#fed7aa', fg: '#9a3412' },
    { key: '已加入', bg: '#bbf7d0', fg: '#166534' },
    { key: '已成交', bg: '#bfdbfe', fg: '#1e40af' },
  ];
  function stageInfo(key) { return STAGES.find(s => s.key === key) || STAGES[0]; }
  function stageCheckboxesHtml(idPrefix, selected) {
    const sel = selected || [];
    return `<div style="display:flex;flex-wrap:wrap;gap:8px 14px">
      ${STAGES.map(s => `
        <label style="display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;padding:4px 10px;border-radius:16px;background:${sel.includes(s.key) ? s.bg : '#f2f0ea'};color:${sel.includes(s.key) ? s.fg : '#666'}">
          <input type="checkbox" class="${idPrefix}-stage-cb" value="${s.key}" ${sel.includes(s.key) ? 'checked' : ''} style="margin:0">${s.key}
        </label>
      `).join('')}
    </div>`;
  }
  function wireStageCheckboxes(idPrefix) {
    document.querySelectorAll(`.${idPrefix}-stage-cb`).forEach(cb => {
      cb.onchange = () => {
        const info = stageInfo(cb.value);
        const label = cb.closest('label');
        if (cb.checked) { label.style.background = info.bg; label.style.color = info.fg; }
        else { label.style.background = '#f2f0ea'; label.style.color = '#666'; }
      };
    });
  }
  function getCheckedStages(idPrefix) {
    return Array.from(document.querySelectorAll(`.${idPrefix}-stage-cb:checked`)).map(cb => cb.value);
  }

  function render() {
    const root = document.getElementById('page-clients');
    if (selectedId && DataStore.getClientLog(selectedId)) {
      renderDetail(root, selectedId);
    } else {
      renderList(root);
    }
  }

  function compressImageFile(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > MAX_IMG_DIM || height > MAX_IMG_DIM) {
            const scale = MAX_IMG_DIM / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve({ name: file.name, kind: 'image', data: canvas.toDataURL('image/jpeg', 0.72) });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function readTextFile(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve({ name: file.name, kind: 'text', data: reader.result });
      reader.readAsText(file);
    });
  }

  function handleFiles(fileList) {
    const files = Array.from(fileList);
    return Promise.all(files.map(f => f.type.startsWith('image/') ? compressImageFile(f) : readTextFile(f)));
  }

  function renderList(root) {
    const logs = DataStore.getClientLogs();
    root.innerHTML = `
      <div class="page-hd">
        <div class="page-title">📇 客戶紀錄</div>
        <div class="page-sub">記錄跟客戶的對話過程，「下一步建議」自己去問 Claude 之後貼回來就好，這個網站沒辦法自動生成建議</div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-title">新增紀錄</div>
        <div class="form-row" style="margin-bottom:8px">
          <input class="input" id="cl-name" placeholder="客戶名稱，例如：吳馬克">
          <input class="input" type="date" id="cl-date" value="${DataStore.todayStr()}" style="max-width:160px">
        </div>
        <div class="muted" style="font-size:12px;margin-bottom:6px">客戶階段（可複選）</div>
        <div style="margin-bottom:12px">${stageCheckboxesHtml('cl', [])}</div>
        <textarea class="input" id="cl-conversation" placeholder="對話紀錄，可以直接貼上聊天內容…" style="margin-bottom:8px;min-height:80px;resize:vertical"></textarea>
        <textarea class="input" id="cl-suggestion" placeholder="下一步建議（去問 Claude 之後貼在這裡）…" style="margin-bottom:8px;min-height:60px;resize:vertical"></textarea>
        <div class="form-row" style="margin-bottom:8px">
          <input class="input" id="cl-blocker" placeholder="目前卡點（例如：猶豫價格）">
          <input class="input" id="cl-ask" placeholder="想問上線的問題">
        </div>
        <input class="input" type="file" id="cl-files" multiple accept="image/*,.txt,.md" style="margin-bottom:8px">
        <div class="muted" style="font-size:12px;margin-bottom:8px">可以附加截圖或文字檔（例如逐字稿），圖片會自動壓縮</div>
        <button class="btn" style="background:var(--blue-accent);color:#fff" id="cl-add">新增</button>
      </div>
      <div id="client-cards"></div>
    `;
    wireStageCheckboxes('cl');

    document.getElementById('cl-add').onclick = async () => {
      const clientName = document.getElementById('cl-name').value.trim();
      if (!clientName) return;
      const btn = document.getElementById('cl-add');
      btn.disabled = true; btn.textContent = '處理中…';
      const date = document.getElementById('cl-date').value || DataStore.todayStr();
      const stages = getCheckedStages('cl');
      const conversation = document.getElementById('cl-conversation').value.trim();
      const suggestion = document.getElementById('cl-suggestion').value.trim();
      const blocker = document.getElementById('cl-blocker').value.trim();
      const askUpline = document.getElementById('cl-ask').value.trim();
      const fileInput = document.getElementById('cl-files');
      const files = fileInput.files.length ? await handleFiles(fileInput.files) : [];
      DataStore.addClientLog({ clientName, date, stages, conversation, suggestion, blocker, askUpline, files });
      render();
    };

    const wrap = document.getElementById('client-cards');
    if (logs.length === 0) {
      wrap.innerHTML = '<div class="empty-hint">還沒有紀錄，上面新增一筆開始吧</div>';
      return;
    }
    wrap.innerHTML = `<div class="grid grid-2">${logs.map(c => {
      const stages = c.stages || [];
      return `
      <div class="card" style="cursor:pointer" data-id="${c.id}">
        <div class="card-title"><span>${Util.esc(c.clientName)}</span><span class="tag">${c.date}</span></div>
        <div style="margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px">
          ${stages.length === 0 ? '' : stages.map(sk => { const st = stageInfo(sk); return `<span class="tag" style="background:${st.bg};color:${st.fg}">${st.key}</span>`; }).join('')}
        </div>
        ${c.conversation ? `<div class="muted" style="font-size:12px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${Util.esc(c.conversation)}</div>` : '<div class="muted" style="font-size:12px;margin-bottom:6px">還沒有寫對話紀錄</div>'}
        ${c.blocker ? `<div style="font-size:12px;margin-bottom:4px">🚧 ${Util.esc(c.blocker)}</div>` : ''}
        <div style="font-size:12px" class="muted">${c.suggestion ? '✅ 已有下一步建議' : '⏳ 尚未填寫下一步建議'}${c.files && c.files.length ? ` · 📎 ${c.files.length} 個附件` : ''}</div>
      </div>
    `;
    }).join('')}</div>`;
    wrap.querySelectorAll('[data-id]').forEach(el => {
      el.onclick = () => { selectedId = el.dataset.id; render(); };
    });
  }

  function fileTileHtml(f, idx, logId) {
    if (f.kind === 'image') {
      return `<div style="position:relative">
        <img src="${f.data}" alt="${Util.esc(f.name)}" style="width:120px;height:120px;object-fit:cover;border-radius:8px;cursor:pointer" data-view-img="${idx}">
        <button class="idea-tile-del" style="position:absolute;top:-6px;right:-6px" data-del-file="${idx}">✕</button>
      </div>`;
    }
    return `<div class="card" style="width:200px;padding:10px;position:relative">
      <div style="font-size:12px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">📄 ${Util.esc(f.name)}</div>
      <div class="muted" style="font-size:11px;max-height:60px;overflow:hidden;white-space:pre-wrap">${Util.esc(f.data.slice(0, 200))}${f.data.length > 200 ? '…' : ''}</div>
      <button class="idea-tile-del" style="position:absolute;top:-6px;right:-6px" data-del-file="${idx}">✕</button>
    </div>`;
  }

  function renderDetail(root, id) {
    const c = DataStore.getClientLog(id);
    root.innerHTML = `
      <div class="page-hd">
        <button class="link-btn" id="back-btn">← 回客戶紀錄列表</button>
        <div class="page-title" style="margin-top:8px">${Util.esc(c.clientName)}</div>
        <div class="page-sub">${c.date}</div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-title">客戶階段（可複選）</div>
        <div style="margin-bottom:12px">${stageCheckboxesHtml('cld', c.stages || [])}</div>
        <div class="form-row" style="margin-bottom:8px">
          <input class="input" id="cl-d-blocker" placeholder="目前卡點" value="${Util.esc(c.blocker || '')}">
          <input class="input" id="cl-d-ask" placeholder="想問上線的問題" value="${Util.esc(c.askUpline || '')}">
        </div>
        <div class="card-title">對話紀錄</div>
        <textarea class="input" id="cl-d-conversation" style="margin-bottom:8px;min-height:120px;resize:vertical">${Util.esc(c.conversation)}</textarea>
        <div class="card-title">下一步建議（Claude AI）</div>
        <textarea class="input" id="cl-d-suggestion" style="margin-bottom:8px;min-height:80px;resize:vertical">${Util.esc(c.suggestion)}</textarea>
        <button class="btn" style="background:var(--blue-accent);color:#fff" id="cl-d-save">儲存</button>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-title">附件</div>
        <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px" id="cl-file-list">
          ${(c.files || []).length === 0 ? '<div class="empty-hint">還沒有附件</div>' : (c.files || []).map((f, i) => fileTileHtml(f, i, c.id)).join('')}
        </div>
        <input class="input" type="file" id="cl-d-files" multiple accept="image/*,.txt,.md">
      </div>
      <button class="btn btn-ghost" style="color:var(--danger)" id="cl-del">🗑️ 刪除這筆紀錄</button>
    `;
    wireStageCheckboxes('cld');

    document.getElementById('back-btn').onclick = () => { selectedId = null; render(); };
    document.getElementById('cl-d-save').onclick = () => {
      DataStore.updateClientLog(c.id, {
        stages: getCheckedStages('cld'),
        blocker: document.getElementById('cl-d-blocker').value.trim(),
        askUpline: document.getElementById('cl-d-ask').value.trim(),
        conversation: document.getElementById('cl-d-conversation').value.trim(),
        suggestion: document.getElementById('cl-d-suggestion').value.trim(),
      });
      render();
    };
    document.getElementById('cl-del').onclick = () => {
      if (!confirm('確定要刪除這筆客戶紀錄嗎？')) return;
      DataStore.deleteClientLog(c.id);
      selectedId = null;
      render();
    };
    document.getElementById('cl-d-files').onchange = async (e) => {
      if (!e.target.files.length) return;
      const newFiles = await handleFiles(e.target.files);
      DataStore.updateClientLog(c.id, { files: [...(c.files || []), ...newFiles] });
      render();
    };
    document.querySelectorAll('[data-del-file]').forEach(el => {
      el.onclick = () => {
        const idx = Number(el.dataset.delFile);
        const files = (c.files || []).filter((_, i) => i !== idx);
        DataStore.updateClientLog(c.id, { files });
        render();
      };
    });
    document.querySelectorAll('[data-view-img]').forEach(el => {
      el.onclick = () => {
        const idx = Number(el.dataset.viewImg);
        const f = c.files[idx];
        window.open(f.data, '_blank');
      };
    });
  }

  return { render };
})();

</script>
<script>
/* 長期目標頁 — 目標 + 拆解出的小方向 */
window.Pages = window.Pages || {};
Pages.goals = (function () {
  function render() {
    const root = document.getElementById('page-goals');
    const goals = DataStore.getGoals();

    root.innerHTML = `
      <div class="page-hd">
        <div class="page-title">🧭 長期目標</div>
        <div class="page-sub">人生越獄計畫的大方向，底下可以拆解成具體的小方向</div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-title">新增目標</div>
        <div class="form-row">
          <input class="input input-lg" id="goal-text" placeholder="新增一個長期目標，例如：安麗事業達成翡翠等級">
          <button class="btn" style="background:var(--home-accent);color:#fff" id="goal-add">新增</button>
        </div>
      </div>
      <div id="goal-cards"></div>
    `;

    document.getElementById('goal-add').onclick = addGoal;
    document.getElementById('goal-text').onkeydown = (e) => { if (e.key === 'Enter') addGoal(); };

    const wrap = document.getElementById('goal-cards');
    if (goals.length === 0) {
      wrap.innerHTML = '<div class="empty-hint">還沒有設定目標，寫下第一個吧</div>';
      return;
    }

    wrap.innerHTML = goals.map(g => {
      const subs = DataStore.getSubgoals(g.id);
      const doneCount = subs.filter(s => s.done).length;
      return `
        <div class="card" style="margin-bottom:14px">
          <div class="card-title">
            <span style="font-size:16px;color:var(--text);font-weight:700">${Util.esc(g.text)}</span>
            <span style="display:flex;align-items:center;gap:10px">
              ${subs.length ? `<span class="tag">${doneCount}/${subs.length}</span>` : ''}
              <button class="link-btn" style="color:var(--danger)" data-del-goal="${g.id}">刪除目標</button>
            </span>
          </div>
          <div class="form-row">
            <input class="input" data-sub-input="${g.id}" placeholder="拆解出的小方向…">
            <button class="btn btn-sm" style="background:var(--blue-accent);color:#fff" data-sub-add="${g.id}">新增</button>
          </div>
          <div>
            ${subs.length === 0 ? '<div class="empty-hint">還沒有拆解，寫下具體一點的小步驟</div>' : subs.map(s => `
              <div class="list-item">
                <input type="checkbox" ${s.done ? 'checked' : ''} data-sub-toggle="${s.id}">
                <span class="grow ${s.done ? 'strike' : ''}" style="font-size:14px">${Util.esc(s.text)}</span>
                <button class="link-btn" style="color:var(--danger)" data-sub-del="${s.id}">刪除</button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }).join('');

    wrap.querySelectorAll('[data-del-goal]').forEach(el => {
      el.onclick = () => { DataStore.deleteGoal(el.dataset.delGoal); render(); };
    });
    wrap.querySelectorAll('[data-sub-add]').forEach(el => {
      el.onclick = () => addSubgoal(el.dataset.subAdd);
    });
    wrap.querySelectorAll('[data-sub-input]').forEach(el => {
      el.onkeydown = (e) => { if (e.key === 'Enter') addSubgoal(el.dataset.subInput); };
    });
    wrap.querySelectorAll('[data-sub-toggle]').forEach(el => {
      el.onchange = () => { DataStore.toggleSubgoal(el.dataset.subToggle); render(); };
    });
    wrap.querySelectorAll('[data-sub-del]').forEach(el => {
      el.onclick = () => { DataStore.deleteSubgoal(el.dataset.subDel); render(); };
    });
  }

  function addGoal() {
    const input = document.getElementById('goal-text');
    const text = input.value.trim();
    if (!text) return;
    DataStore.addGoal(text);
    render();
  }

  function addSubgoal(goalId) {
    const input = document.querySelector(`[data-sub-input="${goalId}"]`);
    const text = input.value.trim();
    if (!text) return;
    DataStore.addSubgoal(goalId, text);
    render();
  }

  return { render };
})();

</script>
<script>
/* 導覽路由 — 側邊欄切換頁面 */
const App = (function () {
  const pages = ['home', 'goals', 'projects', 'calendar', 'finance', 'creation', 'clients'];

  function goto(name) {
    pages.forEach(p => {
      document.getElementById('page-' + p).classList.toggle('active', p === name);
      document.getElementById('nav-' + p).classList.toggle('active', p === name);
    });
    Pages[name].render();
  }

  function initSidebarPhoto() {
    const frame = document.getElementById('sidebar-photo-frame');
    const fileInput = document.getElementById('sidebar-photo-input');
    const draw = () => {
      const photo = DataStore.getHomePhoto();
      frame.innerHTML = photo ? `<img src="${photo}" alt="">` : '📷';
    };
    frame.onclick = () => fileInput.click();
    fileInput.onchange = () => {
      const file = fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        Util.resizeImage(reader.result, 300, (resized) => {
          DataStore.setHomePhoto(resized);
          draw();
        });
      };
      reader.readAsDataURL(file);
    };
    draw();
  }

  function initSidebarName() {
    const input = document.getElementById('sidebar-name-input');
    input.value = DataStore.getUserName();
    const commit = () => {
      DataStore.setUserName(input.value);
      if (document.getElementById('page-home').classList.contains('active')) Pages.home.render();
    };
    input.onblur = commit;
    input.onkeydown = (e) => { if (e.key === 'Enter') input.blur(); };
  }

  function init() {
    pages.forEach(p => {
      document.getElementById('nav-' + p).onclick = () => goto(p);
    });
    initSidebarPhoto();
    initSidebarName();
    goto('home');
  }

  return { goto, init };
})();
window.App = App;

// 安全機制：粗略估計一份資料裡「東西多不多」，用來判斷雲端資料是不是明顯比本機空、避免誤把真實資料蓋成空的
function estimateDataRichness(db) {
  if (!db) return 0;
  const keys = ['events', 'tasks', 'recurring', 'projects', 'goals', 'subgoals', 'assets', 'liabilities', 'habits', 'habitLogs', 'dateNotes', 'shoppingItems', 'ideas'];
  return keys.reduce((sum, k) => sum + (Array.isArray(db[k]) ? db[k].length : 0), 0);
}

// 資料落差確認：改用網頁自己畫面上的提示框(不是瀏覽器原生 confirm())，因為 confirm() 有時候會卡在畫面看不到的地方，
// 讓使用者以為「當機」，其實只是背景在等一個看不見的視窗回應。這個提示框保證畫面上一定看得到、蓋在最上層。
function showDataLossModal(localRichness, remoteRichness, onApplyRemote, onKeepLocal) {
  const old = document.getElementById('dataloss-modal-overlay');
  if (old) old.remove();
  const overlay = document.createElement('div');
  overlay.id = 'dataloss-modal-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:12px;max-width:420px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)">
      <div style="font-size:16px;font-weight:700;margin-bottom:12px">⚠️ 注意：雲端資料比本機少很多</div>
      <div style="font-size:14px;line-height:1.7;margin-bottom:18px;color:#333">
        本機約 <b>${localRichness}</b> 筆、雲端約 <b>${remoteRichness}</b> 筆。<br>
        直接套用雲端資料可能會蓋掉這台裝置上比較完整的內容。
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button id="dataloss-keep-local" style="padding:12px;border-radius:8px;border:none;background:#2b7fd1;color:#fff;font-weight:600;cursor:pointer;font-size:14px">保留本機這份（比較多），推上雲端覆蓋</button>
        <button id="dataloss-apply-remote" style="padding:12px;border-radius:8px;border:1px solid #ccc;background:#fff;color:#666;cursor:pointer;font-size:14px">仍要套用雲端這份（比較少）</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('dataloss-keep-local').onclick = () => { overlay.remove(); onKeepLocal(); };
  document.getElementById('dataloss-apply-remote').onclick = () => { overlay.remove(); onApplyRemote(); };
}

document.addEventListener('DOMContentLoaded', () => {
  App.init();
  // 打開網頁時檢查雲端有沒有更新的資料(例如剛剛在別的裝置上改過)，有的話就套用並重新整理目前畫面。
  // 安全機制：如果本機本來就有不少東西、但雲端這份資料看起來明顯少很多(可能是舊資料、測試資料、或空白初始狀態)，
  // 不會自動覆蓋，會先跳出來問，避免重演之前雲端同步把真實資料蓋成空的的問題
  CloudSync.listen((payloadStr, remoteUpdatedAt) => {
    const localUpdatedAt = DataStore.getUpdatedAt();
    if (remoteUpdatedAt > localUpdatedAt) {
      try {
        const remoteDb = JSON.parse(payloadStr);
        const localRichness = estimateDataRichness(DataStore.exportRaw ? DataStore.exportRaw() : null);
        const remoteRichness = estimateDataRichness(remoteDb);
        // 門檻放寬：只有雲端「明顯」比本機少(差超過3筆、而且不到本機的7成)才跳出來確認，
        // 一般多裝置使用時，各自剛好還沒同步到的一點點正常落差不會再一直誤觸發
        const looksLikeDataLoss = localRichness > 0 && remoteRichness < localRichness - 3 && remoteRichness < localRichness * 0.7;

        function applyRemoteNow() {
          CloudSync.setApplyingRemote(true);
          DataStore.replaceAll(remoteDb);
          CloudSync.setApplyingRemote(false);
          CloudSync.releaseQueuedPush();
          const activePage = document.querySelector('.page.active');
          if (activePage) {
            const name = activePage.id.replace('page-', '');
            if (Pages[name] && Pages[name].render) Pages[name].render();
          }
        }
        function keepLocalAndPush() {
          console.warn('偵測到雲端資料明顯比本機少，使用者選擇不套用，保留本機資料並推上雲端覆蓋掉舊的');
          CloudSync.releaseQueuedPush();
          // 把本機這份(比較完整的)資料主動推上雲端，蓋掉雲端那份過期/較少的資料，
          // 這樣下次輪詢比對時間戳記，雲端就會是最新的，不會再重複跳出同樣的確認視窗
          const localDb = DataStore.exportRaw ? DataStore.exportRaw() : null;
          if (localDb) {
            localDb.updatedAt = Date.now();
            localStorage.setItem('dashboard_template_v1', JSON.stringify(localDb));
            CloudSync.push(JSON.stringify(localDb), localDb.updatedAt);
          }
        }

        if (looksLikeDataLoss) {
          showDataLossModal(localRichness, remoteRichness, applyRemoteNow, keepLocalAndPush);
          return;
        }
        applyRemoteNow();
      } catch (e) { console.warn('套用雲端資料失敗', e); }
    } else {
      // 雲端沒有比本機新，代表這台裝置的資料本來就是新的(或一樣新)，沒有被覆蓋的風險，可以直接放行推送
      CloudSync.releaseQueuedPush();
    }
  });
});

</script>
