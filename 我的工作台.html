            <select class="input" id="${uid}-todo-flag" style="flex:0 0 130px">
              <option value="">（無標記）</option>
              <option value="‼️">‼️ 緊急</option>
              <option value="⚠️">⚠️ 警告</option>
              <option value="🔥">🔥 燒眉毛</option>
              <option value="⭐">⭐ 重要</option>
              <option value="📌">📌 釘選</option>
            </select>
            <button class="btn" style="background:var(--mint-accent);color:#fff;white-space:nowrap" id="${uid}-todo-add">新增待辦</button>
          </div>
        </div>`;

      panelEl.innerHTML = `
        <div class="card" style="margin-bottom:18px" data-daypanel-part="info">
          <div class="card-title">📅 ${selectedDate}${TW_HOLIDAYS_2026[selectedDate] ? ` <span style="color:var(--danger);font-weight:700">・${Util.esc(TW_HOLIDAYS_2026[selectedDate])}</span>` : ''}</div>
          ${scheduleItems.length === 0 ? '<div class="empty-hint">這天沒有安排行程</div>' : scheduleItems.map(renderItemRow).join('')}
          <div class="card-title" style="margin-top:16px">✅ 待辦事項</div>
          ${taskItems.length === 0 ? '<div class="empty-hint">這天沒有待辦事項</div>' : taskItems.map(renderItemRow).join('')}
        </div>
        ${readOnly ? '' : `<div class="card" data-daypanel-part="eventform" style="display:flex;flex-direction:column;flex:1">
          <div class="card-title">新增行程</div>
          <input class="input" id="${uid}-ev-title" placeholder="行程內容" style="margin-bottom:8px">
          ${categoryFieldHtml(`${uid}-ev-cat`, '', 'green')}
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:8px;cursor:pointer">
            <input type="checkbox" id="${uid}-ev-allday"> 全天（不指定時間，例如生日）
          </label>
          <div class="form-row" id="${uid}-ev-startrow" style="align-items:center;flex-wrap:wrap">
            <input class="input jump-date-input" id="${uid}-jump-date" type="date" value="${selectedDate}" title="開始日期" style="flex:1 1 120px;min-width:100px">
            ${Util.timeSelectHtml(`${uid}-ev-start`, '')}
          </div>
          <div class="form-row" id="${uid}-ev-endrow" style="align-items:center;flex-wrap:wrap">
            <input class="input" id="${uid}-ev-enddate" type="date" value="${selectedDate}" title="結束日期" style="flex:1 1 120px;min-width:100px">
            ${Util.timeSelectHtml(`${uid}-ev-end`, '')}
          </div>
          <div class="muted" id="${uid}-ev-pickhint" style="font-size:11px;margin-top:-4px;margin-bottom:8px">點一下開始或結束日期欄位，再點月曆上的日期即可快速帶入</div>
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:8px;cursor:pointer">
            <input type="checkbox" id="${uid}-ev-recurring"> 設為固定行程（每週／每月重複）
          </label>
          <select class="input" id="${uid}-ev-interval" style="margin-bottom:8px;display:none">
            <option value="week:1">每週</option>
            <option value="week:2">每雙週</option>
            <option value="month:1">每個月</option>
            <option value="year:1">每年</option>
          </select>
          <div id="${uid}-ev-endtype-wrap" style="display:none;margin-bottom:8px">
            <select class="input" id="${uid}-ev-endtype" style="margin-bottom:6px">
              <option value="never">永不結束</option>
              <option value="date">於某天結束</option>
              <option value="count">重複幾次後結束</option>
            </select>
            <input class="input" id="${uid}-ev-endtype-date" type="date" style="display:none">
            <div id="${uid}-ev-endtype-count-wrap" style="display:none;align-items:center;gap:6px">
              <input class="input" id="${uid}-ev-endtype-count" type="number" min="1" step="1" placeholder="次數" style="flex:0 0 90px">
              <span class="muted" style="font-size:12px">次後結束</span>
            </div>
          </div>
          <textarea class="input" id="${uid}-ev-note" placeholder="備註（選填）" style="margin-bottom:8px;min-height:44px;resize:vertical"></textarea>
          <button class="btn" style="background:var(--blue-accent);color:#fff;width:100%;margin-top:auto" id="${uid}-ev-add">新增</button>
        </div>`}
        ${todoEl ? '' : todoCardHtml}
      `;
      if (todoEl) { todoEl.innerHTML = todoCardHtml; }

      // 待辦事項的勾選框不管是不是唯讀模式都會顯示(可以打勾完成)，所以要在下面的 readOnly 提前 return 之前先綁定
      panelEl.querySelectorAll('[data-toggle-task]').forEach(el => {
        el.onchange = () => { if (el.checked) Util.playDing(); DataStore.toggleTask(el.dataset.toggleTask); opts.onRerender(); };
      });

      if (readOnly) return;

      wireCategoryField(`${uid}-ev-cat`);

      const recurringCb = document.getElementById(`${uid}-ev-recurring`);
      const alldayCb = document.getElementById(`${uid}-ev-allday`);
      const startTimeWrap = document.querySelector(`[data-time-select="${uid}-ev-start"]`);
      const endTimeWrap = document.querySelector(`[data-time-select="${uid}-ev-end"]`);
      if (alldayCb) {
        alldayCb.onchange = () => {
          const isAllday = alldayCb.checked;
          startTimeWrap.style.display = isAllday ? 'none' : '';
          endTimeWrap.style.display = isAllday ? 'none' : '';
        };
      }
      const intervalSel = document.getElementById(`${uid}-ev-interval`);
      const addBtn = document.getElementById(`${uid}-ev-add`);
      const startDateInput = document.getElementById(`${uid}-jump-date`);
      const endDateInput = document.getElementById(`${uid}-ev-enddate`);
      const recEndTypeWrap = document.getElementById(`${uid}-ev-endtype-wrap`);
      const recEndTypeSel = document.getElementById(`${uid}-ev-endtype`);
      const recEndDateInput = document.getElementById(`${uid}-ev-endtype-date`);
      const recEndCountWrap = document.getElementById(`${uid}-ev-endtype-count-wrap`);
      const recEndCountInput = document.getElementById(`${uid}-ev-endtype-count`);
      startInputEl = startDateInput;
      endInputEl = endDateInput;
      const pickHint = document.getElementById(`${uid}-ev-pickhint`);
      startDateInput.onfocus = () => { pickMode = 'start'; if (pickHint) pickHint.textContent = '點月曆上的日期，填入開始日期'; };
      endDateInput.onfocus = () => { pickMode = 'end'; if (pickHint) pickHint.textContent = '點月曆上的日期，填入結束日期'; };
      recurringCb.onchange = () => {
        const isRec = recurringCb.checked;
        intervalSel.style.display = isRec ? '' : 'none';
        recEndTypeWrap.style.display = isRec ? '' : 'none';
        // 用 visibility 而非 display，讓結束日期收起來後，結束時間仍留在原本的欄位、對齊在開始時間正下方
        endDateInput.style.visibility = isRec ? 'hidden' : '';
        addBtn.textContent = isRec ? '新增固定行程' : '新增';
      };
      recEndTypeSel.onchange = () => {
        const v = recEndTypeSel.value;
        recEndDateInput.style.display = v === 'date' ? '' : 'none';
        recEndCountWrap.style.display = v === 'count' ? 'flex' : 'none';
      };
      // 結束日期預設跟開始日期一樣；使用者改開始日期時，如果結束日期比新的開始日期還早，也一起往前推
      startDateInput.onchange = (e) => {
        const v = e.target.value;
        if (!v) return;
        if (!endDateInput.value || endDateInput.value < v) endDateInput.value = v;
      };
      addBtn.onclick = () => {
        const title = document.getElementById(`${uid}-ev-title`).value.trim();
        if (!title) return;
        const { text: category, color: categoryColor } = getCategoryFieldValue(`${uid}-ev-cat`);
        const isAllday = alldayCb && alldayCb.checked;
        const startTime = isAllday ? '' : Util.timeSelectValue(`${uid}-ev-start`);
        const endTime = isAllday ? '' : Util.timeSelectValue(`${uid}-ev-end`);
        const note = document.getElementById(`${uid}-ev-note`).value.trim();
        const startDate = startDateInput.value || selectedDate;
        Util.playPop();
        if (recurringCb.checked) {
          const [unit, interval] = intervalSel.value.split(':');
          const recEndType = recEndTypeSel.value;
          const recEndValue = recEndType === 'date' ? recEndDateInput.value : (recEndType === 'count' ? recEndCountInput.value : '');
          DataStore.addRecurring(title, startDate, interval, unit, category, startTime, endTime, categoryColor, recEndType, recEndValue);
        } else {
          const endDate = endDateInput.value || startDate;
          DataStore.addEvent(startDate, title, note, category, startTime, endTime, categoryColor, endDate);
        }
        opts.setSelected(startDate);
        opts.onRerender();
      };

      const todoAddBtn = document.getElementById(`${uid}-todo-add`);
      const todoTitleInput = document.getElementById(`${uid}-todo-title`);
      const submitTodo = () => {
        const title = todoTitleInput.value.trim();
        if (!title) return;
        const flag = document.getElementById(`${uid}-todo-flag`).value;
        Util.playPop();
        DataStore.addTask('', title, selectedDate, '', flag);
        opts.onRerender();
      };
      todoAddBtn.onclick = submitTodo;
      todoTitleInput.onkeydown = (e) => { if (e.key === 'Enter') submitTodo(); };

      panelEl.querySelectorAll('[data-del-event]').forEach(el => {
        el.onclick = () => { DataStore.deleteEvent(el.dataset.delEvent); opts.onRerender(); };
      });
      panelEl.querySelectorAll('[data-del-recurring]').forEach(el => {
        el.onclick = () => { DataStore.deleteRecurring(el.dataset.delRecurring); opts.onRerender(); };
      });
      panelEl.querySelectorAll('[data-cancel-occurrence]').forEach(el => {
        el.onclick = () => { DataStore.cancelRecurringOccurrence(el.dataset.cancelOccurrence, el.dataset.cancelDate); opts.onRerender(); };
      });
      panelEl.querySelectorAll('[data-edit-recurring-btn]').forEach(el => {
        el.onclick = (e) => { e.stopPropagation(); editingId = null; editingRecurringId = el.dataset.editRecurringBtn; render(panelEl); };
      });
      panelEl.querySelectorAll('[data-del-task]').forEach(el => {
        el.onclick = () => { DataStore.deleteTask(el.dataset.delTask); opts.onRerender(); };
      });
      panelEl.querySelectorAll('[data-dblclick-event]').forEach(el => {
        el.ondblclick = () => { editingRecurringId = null; editingId = el.dataset.dblclickEvent; render(panelEl); };
      });
      panelEl.querySelectorAll('[data-edit-event-btn]').forEach(el => {
        el.onclick = (e) => { e.stopPropagation(); editingRecurringId = null; editingId = el.dataset.editEventBtn; render(panelEl); };
      });
      const editRow = panelEl.querySelector('[data-editing-event]');
      if (editRow) {
        const id = editRow.dataset.editingEvent;
        wireCategoryField(`editcat-${id}`);
        const editStartDateInput = document.getElementById(`editev-${id}-jump-date`);
        const editEndDateInput = document.getElementById(`editev-${id}-enddate`);
        const editPickHint = document.getElementById(`editev-${id}-pickhint`);
        if (editStartDateInput && editEndDateInput) {
          editStartDateInput.onfocus = () => { startInputEl = editStartDateInput; endInputEl = editEndDateInput; pickMode = 'start'; if (editPickHint) editPickHint.textContent = '點月曆上的日期，填入開始日期'; };
          editEndDateInput.onfocus = () => { startInputEl = editStartDateInput; endInputEl = editEndDateInput; pickMode = 'end'; if (editPickHint) editPickHint.textContent = '點月曆上的日期，填入結束日期'; };
        }
        const alldayCb = document.getElementById(`editev-${id}-allday`);
        const startWrap = document.getElementById(`editev-${id}-start-wrap`);
        const endWrap = document.getElementById(`editev-${id}-end-wrap`);
        if (alldayCb) {
          alldayCb.onchange = () => {
            const on = alldayCb.checked;
            startWrap.style.display = on ? 'none' : '';
            endWrap.style.display = on ? 'none' : '';
          };
        }
        const toRecurringCb = document.getElementById(`editev-${id}-torecurring`);
        const intervalSel = document.getElementById(`editev-${id}-interval`);
        const endTypeWrap = document.getElementById(`editev-${id}-endtype-wrap`);
        const endTypeSel = document.getElementById(`editev-${id}-endtype`);
        const endTypeDateInput = document.getElementById(`editev-${id}-endtype-date`);
        const endTypeCountInput = document.getElementById(`editev-${id}-endtype-count`);
        if (toRecurringCb) {
          toRecurringCb.onchange = () => {
            const on = toRecurringCb.checked;
            intervalSel.style.display = on ? '' : 'none';
            endTypeWrap.style.display = on ? '' : 'none';
          };
          endTypeSel.onchange = () => {
            const v = endTypeSel.value;
            endTypeDateInput.style.display = v === 'date' ? '' : 'none';
            endTypeCountInput.style.display = v === 'count' ? '' : 'none';
          };
        }
        const confirm = () => {
          const title = editRow.querySelector('[data-f="title"]').value.trim();
          if (!title) { editingId = null; render(panelEl); return; }
          const { text: category, color: categoryColor } = getCategoryFieldValue(`editcat-${id}`);
          const date = editRow.querySelector('[data-f="date"]').value;
          const endDateRaw = editRow.querySelector('[data-f="endDate"]').value;
          const endDate = (endDateRaw && endDateRaw > date) ? endDateRaw : '';
          const isAllday = alldayCb && alldayCb.checked;
          const startTime = isAllday ? '' : Util.timeSelectValue(`editev-${id}-start`);
          const endTime = isAllday ? '' : Util.timeSelectValue(`editev-${id}-end`);
          const note = editRow.querySelector('[data-f="note"]').value.trim();
          if (toRecurringCb && toRecurringCb.checked) {
            // 把這筆單次行程轉成固定行程：刪掉原本那筆單次的，改成新增一筆固定行程，用同一個日期當起算基準
            const [unit, interval] = intervalSel.value.split(':');
            const endType = endTypeSel.value;
            const endValue = endType === 'date' ? endTypeDateInput.value : (endType === 'count' ? endTypeCountInput.value : '');
            DataStore.deleteEvent(id);
            DataStore.addRecurring(title, date, interval, unit, category, startTime, endTime, categoryColor, endType, endValue);
          } else {
            DataStore.updateEvent(id, { title, category, categoryColor, date, endDate, startTime, endTime, note });
          }
          editingId = null;
          opts.onRerender();
        };
        editRow.querySelector('[data-confirm-event]').onclick = confirm;
        editRow.querySelector('[data-f="title"]').onkeydown = (e) => { if (e.key === 'Enter') confirm(); };
        const cancelBtn = editRow.querySelector('[data-cancel-event]');
        if (cancelBtn) cancelBtn.onclick = () => { editingId = null; render(panelEl); };
      }
      const recEditRow = panelEl.querySelector('[data-editing-recurring]');
      if (recEditRow) {
        const id = recEditRow.dataset.editingRecurring;
        wireCategoryField(`editrec-${id}`);
        const endTypeSel = recEditRow.querySelector('[data-f="endType"]');
        const endTypeDateInput = recEditRow.querySelector('[data-f="endTypeDate"]');
        const endTypeCountInput = recEditRow.querySelector('[data-f="endTypeCount"]');
        endTypeSel.onchange = () => {
          const v = endTypeSel.value;
          endTypeDateInput.style.display = v === 'date' ? '' : 'none';
          endTypeCountInput.style.display = v === 'count' ? '' : 'none';
        };
        const toSingleCb = document.getElementById(`editrec-${id}-tosingle`);
        const singleDateInput = document.getElementById(`editrec-${id}-single-date`);
        if (toSingleCb) {
          toSingleCb.onchange = () => { singleDateInput.style.display = toSingleCb.checked ? '' : 'none'; };
        }
        const confirmRec = () => {
          const title = recEditRow.querySelector('[data-f="title"]').value.trim();
          if (!title) { editingRecurringId = null; render(panelEl); return; }
          const { text: category, color: categoryColor } = getCategoryFieldValue(`editrec-${id}`);
          const startTime = Util.timeSelectValue(`editrec-${id}-start`);
          const endTime = Util.timeSelectValue(`editrec-${id}-end`);
          if (toSingleCb && toSingleCb.checked) {
            // 把這筆固定行程轉成單次行程：刪掉固定行程規則，改成新增一筆單次事件，用選定的日期
            const date = singleDateInput.value || DataStore.todayStr();
            DataStore.deleteRecurring(id);
            DataStore.addEvent(date, title, '', category, startTime, endTime, categoryColor, '');
          } else {
            const [unit, interval] = recEditRow.querySelector('[data-f="recurrence"]').value.split(':');
            const endType = endTypeSel.value;
            const endValue = endType === 'date' ? endTypeDateInput.value : (endType === 'count' ? endTypeCountInput.value : '');
            DataStore.updateRecurring(id, { title, category, categoryColor, startTime, endTime, unit, interval: Number(interval), endType, endValue });
          }
          editingRecurringId = null;
          opts.onRerender();
        };
        recEditRow.querySelector('[data-confirm-recurring]').onclick = confirmRec;
        recEditRow.querySelector('[data-f="title"]').onkeydown = (e) => { if (e.key === 'Enter') confirmRec(); };
        const cancelRecBtn = recEditRow.querySelector('[data-cancel-recurring]');
        if (cancelRecBtn) cancelRecBtn.onclick = () => { editingRecurringId = null; render(panelEl); };
      }
    }

    // 讓月曆格子點擊可以把日期灌進「新增行程」的開始/結束日期欄位。
    // 回傳 true 表示這次點擊已經被拿去填日期了(呼叫端不應該再做平常的「切換選取日期」動作)；
    // 回傳 false 表示目前沒有在挑日期，呼叫端應該照平常邏輯處理。
    function pickDate(dateStr) {
      if (!startInputEl || !endInputEl) return false;
      if (pickMode === 'start') {
        startInputEl.value = dateStr;
        // 開始日期不能比結束日期晚：結束日期比新的開始日期還早的話，一起往後推
        if (!endInputEl.value || endInputEl.value < dateStr) endInputEl.value = dateStr;
        pickMode = 'end';
        return true;
      }
      if (pickMode === 'end') {
        const start = startInputEl.value;
        if (start && dateStr < start) {
          // 選到比開始日期還早的日期：兩者對調，維持開始 <= 結束的邏輯
          endInputEl.value = start;
          startInputEl.value = dateStr;
        } else {
          endInputEl.value = dateStr;
        }
        pickMode = null;
        return true;
      }
      return false;
    }

    return { render, pickDate };
  }

  return { COLOR_PALETTE, RECURRING_COLOR, MAX_DOTS, BARS_AREA_H, BAR_H, BAR_GAP, MAX_LANES, colorOf, categoryOf, recurrenceLabel, itemsForDate, isSpanningEvent, weekBars, barSegmentHtml, cellBarStripHtml, cellBarsHtml, splitCellItems, dotHtml, noteHtml, cellHeaderHtml, categoryFieldHtml, wireCategoryField, getCategoryFieldValue, createDayPanel, wireDragDrop };
})();

<script>
/* 首頁 — 語錄 + 小行事曆 + 四個模組摘要卡片(2x2) */
window.Pages = window.Pages || {};
Pages.home = (function () {

    '成長不是一條直線，繞路也是路。',
    '先完成，再完美。',
    '好的內容不會主動找上門，要自己去撞見它。',
    '你能給下線最好的，是你自己先走出來的樣子。',

    '成交之前，先學會看懂一個人真正的困擾。',
    '你走過的每條彎路，都是別人抄不走的經驗。',
    '有想法就寫下來，不然明天就忘了。',
    '生意不是等出來的，是一次次談出來的。',
    '事業是每一次跟進時，客戶心裡留下的信任感。',
    '錢要花在讓你變強的地方，不是讓你安心的地方。',
    '今天的猶豫，明天會變成後悔。',
    '你不用比昨天的自己厲害很多，往前一點就夠。',
    '選擇多不代表自由，專注才是。',
    '把疑惑說出來，答案通常就在對話裡。',
    '累積比爆發更可靠。',
    '先讓自己過得好，才有餘力照顧下線跟客戶。',
    '現在的辛苦，是未來從容的本錢。',
  ];

  const _now = new Date();
  let homeCalYear = _now.getFullYear();
  let homeCalMonth = _now.getMonth();
  let homeCalSelected = DataStore.todayStr();
  let homeCalDotStyle = (window.innerWidth <= 860 ? 'dots' : 'card'); // 手機螢幕小，預設用圓點式比較不雜亂；電腦版維持色塊卡片式方便直接看標題
  let netVisible = false;
  let homeKeyboardBound = false;
  let currentQuote = QUOTES[Math.floor(Math.random() * QUOTES.length)];

  function pickNewQuote() {
    currentQuote = QUOTES[Math.floor(Math.random() * QUOTES.length)];
  }
  setInterval(() => {
    pickNewQuote();
    const page = document.getElementById('page-home');
    if (page && page.classList.contains('active')) render();
  }, 20 * 60 * 1000);

  const dayPanel = CalShared.createDayPanel({
    getSelected: () => homeCalSelected,
    setSelected: (d) => {
      homeCalSelected = d;
      const dt = new Date(d + 'T00:00:00');
      homeCalYear = dt.getFullYear();
      homeCalMonth = dt.getMonth();
    },
    onRerender: () => render(),
    readOnly: true,
  });

  function render() {
    const scrollY = window.scrollY;
    const root = document.getElementById('page-home');
    const today = DataStore.todayStr();
    const openTasks = DataStore.getAllTasks().filter(t => !t.done);
    const projects = DataStore.getProjects();
    const goals = DataStore.getGoals();

    const events = DataStore.getEvents().filter(e => e.date >= today || (e.endDate && e.endDate >= today)).map(e => ({ ...e, kind: 'event' }));
    const taskEvents = openTasks.filter(t => t.dueDate && t.dueDate >= today).map(t => ({ id: t.id, date: t.dueDate, title: t.title, note: t.note, kind: 'task' }));
    const combinedSchedule = [...events, ...taskEvents].sort((a, b) => a.date < b.date ? -1 : 1);
    const upcoming = combinedSchedule.slice(0, 5);
    const in3Days = dateStrPlus(3);
    const near3 = combinedSchedule.filter(e => e.date <= in3Days);

    const assetTotal = DataStore.getAssets().reduce((s, a) => s + a.amount, 0);
    const liabTotal = DataStore.getLiabilities().reduce((s, l) => s + l.amount, 0);
    const net = assetTotal - liabTotal;

    root.innerHTML = `
      <div class="hero">
        <div>
          <div class="page-title">${greetingWord()}${DataStore.getUserName() ? '，' + Util.esc(DataStore.getUserName()) : ''} 👋</div>
          <div class="page-sub home-date">${todayLabel()}</div>
        </div>
        <div class="quote-box" id="home-quote" style="cursor:pointer">${currentQuote}</div>
      </div>

      <div class="grid grid-2" style="margin-bottom:16px">
        ${card('🎯 長期目標', goals.length === 0 ? '<div class="empty-hint">還沒有設定目標</div>' : `
          <div class="goal-preview-grid">
            ${goals.slice(0, 6).map(g => `<div class="goal-preview-item">${Util.esc(g.text)}</div>`).join('')}
          </div>
        `, 'goals')}

        ${card('📁 專案進度', projectProgressBody(projects), 'projects')}
      </div>

      <div class="grid" id="home-cal-row" style="grid-template-columns:1fr 300px;gap:20px;align-items:start;margin-bottom:16px">
        <div class="card" style="min-width:0">
          <div class="cal-hd">
            <button class="btn btn-ghost btn-sm" id="home-cal-prev">←</button>
            <b>📅 ${homeCalYear} 年 ${homeCalMonth + 1} 月</b>
            <button class="btn btn-ghost btn-sm" id="home-cal-next">→</button>
            <div style="margin-left:auto;display:flex;gap:4px">
              <button class="btn btn-sm ${homeCalDotStyle === 'card' ? '' : 'btn-ghost'}" id="home-cal-dotstyle-card" style="${homeCalDotStyle === 'card' ? 'background:var(--blue-accent);color:#fff' : ''}">卡片式</button>
              <button class="btn btn-sm ${homeCalDotStyle === 'dots' ? '' : 'btn-ghost'}" id="home-cal-dotstyle-dots" style="${homeCalDotStyle === 'dots' ? 'background:var(--blue-accent);color:#fff' : ''}">圓點式</button>
            </div>
          </div>
          <div class="cal-grid" id="home-cal-grid" style="min-width:0"></div>
        </div>
        <div id="home-cal-panel" style="min-width:0;position:sticky;top:16px"></div>
      </div>
    `;

    root.querySelectorAll('[data-goto]').forEach(el => {
      el.onclick = () => window.App.goto(el.dataset.goto);
    });
    // 首頁的行程清單不能編輯(只能檢視)，所以這裡不再呼叫任何雙擊編輯的綁定

    document.getElementById('home-quote').onclick = () => {
      pickNewQuote();
      render();
    };

    // 小行事曆
    document.getElementById('home-cal-prev').onclick = () => { homeCalMonth--; if (homeCalMonth < 0) { homeCalMonth = 11; homeCalYear--; } render(); };
    document.getElementById('home-cal-next').onclick = () => { homeCalMonth++; if (homeCalMonth > 11) { homeCalMonth = 0; homeCalYear++; } render(); };
    document.getElementById('home-cal-dotstyle-card').onclick = () => { homeCalDotStyle = 'card'; render(); };
    document.getElementById('home-cal-dotstyle-dots').onclick = () => { homeCalDotStyle = 'dots'; render(); };
    renderHomeCalGrid();
    dayPanel.render(document.getElementById('home-cal-panel'));
    bindHomeKeyboardNav();

    window.scrollTo(0, scrollY);
  }

  function dateStrPlus(days) {
    const d = new Date();
    d.setDate(d.getDate() + days);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function renderUpcomingList(items, emptyText) {
    if (items.length === 0) return `<div class="empty-hint">${emptyText}</div>`;
    return items.map(e => {
      const tag = e.kind === 'task' ? { label: '工作', bg: 'var(--blue-accent-bg)', fg: 'var(--blue-accent)' } : CalShared.categoryOf(e);
      const timeStr = e.kind === 'task' ? Util.timeRange(e.startTime, e.endTime) : Util.simpleTimeLabel(e);
      const isMultiDay = e.kind === 'event' && e.endDate && e.endDate > e.date;
      const dateLabel = isMultiDay ? `${Util.shortDate(e.date)} → ${Util.shortDate(e.endDate)}` : Util.shortDate(e.date);
      return `<div class="list-item" style="align-items:flex-start;flex-direction:column;gap:2px">
        <div style="display:flex;align-items:center;gap:10px;width:100%">
          <span class="tag" style="background:${tag.bg};color:${tag.fg}">${Util.esc(tag.label)}</span>
          <span class="grow" style="font-size:14px;color:#1a1a1a">${Util.esc(e.title)}</span>
          ${timeStr ? `<span style="font-size:12px;white-space:nowrap;color:#1a1a1a">${timeStr}</span>` : ''}
          <span style="font-size:12px;white-space:nowrap;color:#1a1a1a">${dateLabel}</span>
        </div>
        ${e.note ? `<div class="muted" style="font-size:12px;padding-left:2px;white-space:pre-wrap">📝 ${Util.esc(e.note)}</div>` : ''}
      </div>`;
    }).join('');
  }

  function todoPreviewBody(openTasks) {
    if (openTasks.length === 0) return '<div class="empty-hint">目前沒有待辦</div>';
    const sorted = [...openTasks].sort((a, b) => {
      if (!a.dueDate && !b.dueDate) return 0;
      if (!a.dueDate) return 1;
      if (!b.dueDate) return -1;
      return a.dueDate < b.dueDate ? -1 : 1;
    }).slice(0, 5);
    return sorted.map(t => `
      <div class="list-item">
        <span class="grow" style="font-size:14px">${Util.esc(t.title)}</span>
        <span class="${Util.dueClass(t.dueDate)}" style="font-size:12px">${t.dueDate || ''}</span>
      </div>
    `).join('');
  }

  function bindHomeKeyboardNav() {
    if (homeKeyboardBound) return;
    homeKeyboardBound = true;
    document.addEventListener('keydown', (e) => {
      const page = document.getElementById('page-home');
      if (!page || !page.classList.contains('active')) return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
      const deltas = { ArrowUp: -7, ArrowDown: 7, ArrowLeft: -1, ArrowRight: 1 };
      if (!(e.key in deltas)) return;
      e.preventDefault();
      const d = new Date(homeCalSelected + 'T00:00:00');
      d.setDate(d.getDate() + deltas[e.key]);
      homeCalSelected = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      homeCalYear = d.getFullYear();
      homeCalMonth = d.getMonth();
      render();
    });
  }

  function card(title, body, gotoPage) {
    return `<div class="card"${gotoPage ? ` data-goto="${gotoPage}" style="cursor:pointer"` : ''}>
      <div class="card-title">${title}</div>
      ${body}
    </div>`;
  }

  function projectProgressBody(projects) {
    if (projects.length === 0) return '<div class="empty-hint">還沒有專案</div>';
    const progressRow = (p) => {
      const tasks = DataStore.getTasksByProject(p.id);
      const done = tasks.filter(t => t.done).length;
      return `<div class="list-item"><span class="grow project-progress-name">${Util.esc(p.name)}</span><span class="muted" style="font-size:12px">${done}/${tasks.length}</span></div>`;
    };
    if (projects.length <= 3) {
      return projects.map(progressRow).join('');
    }
    const shown = projects.slice(0, 2).map(progressRow).join('');
    const restCount = projects.length - 2;
    return shown + `<div class="list-item"><span class="grow muted" style="font-size:13px">以及其他 ${restCount} 個專案進行中</span></div>`;
  }

  function renderHomeCalGrid() {
    const grid = document.getElementById('home-cal-grid');
    const dows = ['日', '一', '二', '三', '四', '五', '六'];
    const firstDay = new Date(homeCalYear, homeCalMonth, 1).getDay();
    const daysInMonth = new Date(homeCalYear, homeCalMonth + 1, 0).getDate();
    const today = DataStore.todayStr();

    const cells = [];
    for (let i = 0; i < firstDay; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push({ d, dateStr: `${homeCalYear}-${String(homeCalMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}` });
    while (cells.length % 7 !== 0) cells.push(null);
    const weeks = [];
    for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));

    const HOME_BAR_H = 16; // 字縮小了，跨天橫條的高度也跟著縮小，才不會佔掉太多格子空間造成擠壓
    let html = `<div class="cal-dow-row">${dows.map(d => `<div class="cal-dow">${d}</div>`).join('')}</div>`;
    weeks.forEach(week => {
      const weekDates = week.map(c => c ? c.dateStr : null);
      const bars = CalShared.weekBars(weekDates);
      const reserve = bars.length ? CalShared.MAX_LANES * (HOME_BAR_H + CalShared.BAR_GAP) + 4 : 0;
      html += `<div class="cal-week-row">
        <div class="cal-week-grid">
          ${week.map((c, dIdx) => {
            if (!c) return `<div class="cal-cell empty"></div>`;
            // 月曆格子不顯示待辦事項，只顯示行程(事件、固定行程)；待辦要看的話請看下面「當天安排」視窗
            const cellItems = CalShared.itemsForDate(c.dateStr).filter(it => it.kind !== 'task');
            const { visible, hiddenCount } = CalShared.splitCellItems(cellItems, CalShared.MAX_DOTS);
            const cls = ['cal-cell'];
            if (c.dateStr === today) cls.push('today');
            if (c.dateStr === homeCalSelected) cls.push('selected');
            const itemsHtml = homeCalDotStyle === 'dots'
              ? `<div class="cal-dot-circles">${cellItems.slice(0, 8).map(it => `<span class="cal-dot-circle" style="background:${CalShared.categoryOf(it).bg}"></span>`).join('')}</div>`
              : visible.map(it => CalShared.dotHtml(it, { hideTime: true, viewDate: c.dateStr })).join('') + (hiddenCount > 0 ? `<div class="cal-cell-more">+${hiddenCount}</div>` : '');
            return `<div class="${cls.join(' ')}" data-date="${c.dateStr}" style="${reserve ? `padding-bottom:${reserve}px` : ''}">
              ${CalShared.cellHeaderHtml(c.dateStr, c.d)}
              ${itemsHtml}
              ${CalShared.cellBarsHtml(bars, dIdx, HOME_BAR_H)}
            </div>`;
          }).join('')}
        </div>
      </div>`;
    });

    grid.innerHTML = html;
    grid.querySelectorAll('[data-date]').forEach(el => {
      el.onclick = () => { homeCalSelected = el.dataset.date; render(); };
    });
    grid.querySelectorAll('[data-dblclick-bar]').forEach(el => {
      el.onclick = (e) => { e.stopPropagation(); homeCalSelected = el.dataset.dblclickBar; render(); };
    });
    CalShared.wireDragDrop(grid, render);
  }

  function greetingWord() {
    const h = new Date().getHours();
    if (h >= 6 && h < 12) return '早安';
    if (h >= 12 && h < 18) return '午安';
    return '晚安';
  }

  function todayLabel() {
    const d = new Date();
    const w = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
    return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日・星期${w}`;
  }

  return { render };
})();
